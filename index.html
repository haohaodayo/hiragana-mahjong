<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at center,#183c29 0%,#0a1b12 48%,#050b08 100%);
  color:#f7f3df;
  font-family:
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
}

/* =========================
   ヘッダー
========================= */

header{
  height:70px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(4,10,7,.85);
  border-bottom:1px solid #526348;
  box-shadow:0 4px 20px #0008;
}

.logo{
  font-size:26px;
  font-weight:900;
  color:#e7cb72;
  letter-spacing:2px;
}

.headerRight{
  display:flex;
  gap:10px;
  align-items:center;
}

.headerBadge{
  padding:7px 13px;
  border:1px solid #776633;
  border-radius:20px;
  color:#d8c78a;
  background:#16180f;
  font-size:13px;
}

/* =========================
   セットアップ
========================= */

#setup{
  width:min(900px,92%);
  margin:60px auto;
  padding:38px;
  background:rgba(11,26,17,.95);
  border:1px solid #586744;
  border-radius:24px;
  box-shadow:0 20px 60px #0008;
}

.setupTitle{
  text-align:center;
  margin-bottom:30px;
}

.setupTitle h1{
  margin:0;
  color:#ead27b;
  font-size:42px;
}

.setupTitle p{
  color:#9eaa9f;
}

.setupGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field label{
  display:block;
  color:#aeb8a9;
  font-size:13px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #43573e;
  background:#07120c;
  color:#fff;
  font-size:15px;
}

.startButton{
  display:block;
  margin:30px auto 0;
  padding:15px 55px;
  font-size:18px;
  font-weight:bold;
  border-radius:13px;
  border:1px solid #b08d3c;
  background:linear-gradient(#987c2b,#63501b);
  color:#fff8d8;
  cursor:pointer;
}

/* =========================
   ゲーム全体
========================= */

#game{
  display:none;
  width:min(1450px,96%);
  margin:20px auto;
}

.gameLayout{
  display:grid;
  grid-template-columns:220px 1fr 280px;
  gap:15px;
}

@media(max-width:1100px){
  .gameLayout{
    grid-template-columns:1fr;
  }
}

/* =========================
   サイド
========================= */

.sidePanel{
  background:rgba(10,23,15,.95);
  border:1px solid #3e553d;
  border-radius:17px;
  padding:15px;
}

.sideTitle{
  color:#e3c969;
  font-weight:bold;
  margin-bottom:12px;
  border-bottom:1px solid #344735;
  padding-bottom:8px;
}

.playerCard{
  background:#09170f;
  border:1px solid #30442f;
  padding:11px;
  border-radius:10px;
  margin-bottom:8px;
}

.playerCard.active{
  border-color:#d5b85d;
  box-shadow:0 0 12px #b8953540;
}

.playerName{
  font-weight:bold;
}

.playerStats{
  margin-top:5px;
  color:#8f9d91;
  font-size:11px;
  line-height:1.7;
}

.wordBook{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.bookWord{
  padding:5px 8px;
  background:#18291d;
  border:1px solid #38513c;
  border-radius:12px;
  font-size:12px;
}

/* =========================
   卓
========================= */

.table{
  position:relative;
  min-height:730px;
  padding:22px;
  border-radius:30px;
  background:
    radial-gradient(circle,#24603a 0%,#17472c 45%,#0e3320 100%);
  border:9px solid #372d1b;
  box-shadow:
    inset 0 0 0 2px #927844,
    inset 0 0 50px #0007,
    0 15px 50px #000b;
  overflow:hidden;
}

/* 卓の中央 */

.centerTable{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:58%;
  height:46%;
  min-height:250px;
  border-radius:22px;
  border:2px solid #64805a;
  background:#0a2818aa;
  box-shadow:inset 0 0 40px #0008;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.turnText{
  color:#e8d27d;
  font-weight:bold;
  font-size:17px;
}

.deckText{
  color:#aeb9ad;
  margin-top:5px;
  font-size:13px;
}

.progress{
  display:flex;
  gap:7px;
  margin-top:18px;
}

.progressBox{
  width:42px;
  height:42px;
  border-radius:8px;
  border:1px solid #69745c;
  background:#08150d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

.progressBox.done{
  background:#705b20;
  border-color:#d5b85d;
  color:#fff2ae;
}

/* =========================
   捨て牌
========================= */

.riverArea{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:52%;
  margin-top:120px;
  z-index:2;
}

.riverTitle{
  text-align:center;
  font-size:11px;
  color:#9eaa9f;
  margin-bottom:5px;
}

.river{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
}

.discardTile{
  width:35px;
  height:42px;
  background:linear-gradient(#fffef1,#d8d2b7);
  color:#15150e;
  border-radius:6px;
  border:1px solid #9d987a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:bold;
  box-shadow:0 2px 0 #696653;
}

/* =========================
   相手
========================= */

.opponent{
  position:absolute;
  background:#08150eaa;
  border:1px solid #466044;
  border-radius:12px;
  padding:9px 14px;
  min-width:130px;
  text-align:center;
}

.opponent.top{
  top:15px;
  left:50%;
  transform:translateX(-50%);
}

.opponent.left{
  left:15px;
  top:50%;
  transform:translateY(-50%);
}

.opponent.right{
  right:15px;
  top:50%;
  transform:translateY(-50%);
}

.opponentName{
  font-size:13px;
  font-weight:bold;
}

.opponentInfo{
  color:#8f9d91;
  font-size:10px;
  margin-top:3px;
}

/* =========================
   鳴き
========================= */

.meldArea{
  position:absolute;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  width:80%;
  text-align:center;
}

.meld{
  display:inline-block;
  padding:7px 11px;
  margin:3px;
  border-radius:8px;
  background:#302918;
  border:1px solid #92763a;
  color:#f4dc8a;
  font-size:13px;
}

/* =========================
   自分の手牌
========================= */

.handArea{
  margin-top:15px;
  background:#07140c;
  border:1px solid #40543d;
  border-radius:15px;
  padding:13px;
}

.handHeader{
  display:flex;
  justify-content:space-between;
  color:#aeb9ad;
  font-size:12px;
  margin-bottom:10px;
}

.hand{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  min-height:68px;
}

.tile{
  width:49px;
  height:63px;
  flex:none;
  border-radius:8px;
  background:linear-gradient(#fffef2,#d9d4bb);
  color:#14140e;
  border:1px solid #aaa486;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
  cursor:grab;
  user-select:none;
  box-shadow:0 3px 0 #74705b;
  transition:.12s;
}

.tile:hover{
  transform:translateY(-3px);
}

.tile.selected{
  transform:translateY(-8px);
  outline:3px solid #e7c969;
}

.tile.hint{
  box-shadow:
    0 0 0 3px #63c58c,
    0 0 20px #63c58c;
}

/* =========================
   アクション
========================= */

.actionArea{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.action{
  padding:11px 20px;
  border-radius:10px;
  border:1px solid #4d6548;
  background:#182c1d;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.action.primary{
  background:#806622;
  border-color:#b59645;
}

.action.ron{
  background:#662727;
  border-color:#a74d4d;
}

.action:disabled{
  opacity:.3;
  cursor:not-allowed;
}

/* =========================
   下情報
========================= */

.bottomInfo{
  margin-top:12px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.infoBox{
  background:#0b1b11;
  border:1px solid #354a37;
  border-radius:11px;
  padding:10px;
}

.infoTitle{
  color:#aeb9ad;
  font-size:11px;
}

.infoValue{
  margin-top:4px;
  color:#e8d27d;
  font-size:17px;
  font-weight:bold;
}

.waitTiles{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:7px;
}

.wait{
  padding:5px 8px;
  background:#1a2d1e;
  border:1px solid #456048;
  border-radius:7px;
  font-size:13px;
}

/* =========================
   ログ
========================= */

.log{
  max-height:270px;
  overflow:auto;
  color:#9da99f;
  font-size:11px;
  line-height:1.7;
}

.log div{
  border-bottom:1px solid #1d3022;
  padding:3px 0;
}

/* =========================
   勝利演出
========================= */

#overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  align-items:center;
  justify-content:center;
}

.winModal{
  width:min(650px,92%);
  padding:40px;
  border-radius:25px;
  text-align:center;
  background:
    radial-gradient(circle,#263d26,#0e1e13);
  border:2px solid #c5a64f;
  box-shadow:
    0 0 70px #c9a84c55,
    0 20px 80px #000;
  animation:winIn .35s ease-out;
}

@keyframes winIn{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.winMark{
  font-size:64px;
  color:#efd477;
  font-weight:900;
  text-shadow:0 0 25px #d7b54e88;
}

.winName{
  font-size:25px;
  margin:10px;
}

.winWords{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:25px 0;
}

.winWord{
  padding:10px 15px;
  border-radius:9px;
  background:#2d2613;
  border:1px solid #a4873c;
  color:#ffe99b;
  font-size:20px;
}

.rematch{
  padding:13px 35px;
  border-radius:11px;
  background:#866c25;
  color:white;
  border:1px solid #c5a64f;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<script>

/* =========================================================
   登録語彙
   ※正式版では検証済み語彙データへ分離予定
========================================================= */

const WORDS = new Set(`

あい あお あき あさ あし あじ あす あせ あと
あな あめ あゆ

いえ いか いき いけ いし いす いぬ いま いろ

かめ から

きく きの きみ きり

くさ くち くつ くに くま くも

けし

こえ こめ ころ

さけ さき さく さと さば さめ さら

しお しか しき しし した しも

すい すし すな

せき せみ

そら

たい たこ たね たに たま

ちえ ちず ちち

つき つく つち つの

てら

とき とけ とり

なつ なみ

にく にし にわ

ぬの

ねこ

のり

はこ はし はな はね はる

ひと ひる

ふね

へや

ほし ほん

まえ まめ まる みず みせ みち みみ

むし むね

めし

もり

やま ゆき

よる

らく

りす りん

れき れん

わに わら


あさひ あかり あきら あなた あゆみ
いかだ いかり いきもの いちご いなか いのち
うさぎ うしろ うみべ えがお
おかし おしろ おすし おとこ おんな
かがみ かたち かなた からす かわら
きつね きのこ
くじら くすり くもり けむり
こいぬ こいびと こおり こたえ ことば こども
さかな さくら さとう
しずく しごと すいか すずめ せかい
たぬき たまご ちから つばさ つぼみ
てがみ てまり とかげ とまと ともだち
ながれ なつやすみ にじいろ にんじん
ねずみ のはら はさみ はたけ はなび
ひかり ひつじ ふくろ ほたる
まくら まつり みかん みずうみ
むかし めがね もみじ
やさい やかた ゆめ ゆめみ
りんご わたし わたげ

`.trim().split(/\s+/));


/* =========================================================
   牌
========================================================= */

const BASIC = [
..."あいうえお",
..."かきくけこ",
..."さしすせそ",
..."たちつてと",
..."なにぬねの",
..."はひふへほ",
..."まみむめも",
..."やゆよ",
..."らりるれろ",
..."わをん"
];

const EXTRA = [
..."がぎぐげござじずぜぞ",
..."だぢづでど",
..."ばびぶべぼ",
..."ぱぴぷぺぽ",
..."ゃゅょっ"
];

const TILE_TYPES =
  [...new Set([...BASIC,...EXTRA])];


/* =========================================================
   状態
========================================================= */

let players=[];
let hands=[];
let melds=[];
let wins=[];
let stats=[];
let books=[];
let deck=[];
let river=[];
let turn=0;
let selected=-1;
let dragIndex=null;

let gameOver=false;

let pendingRon=null;
let pendingChi=null;


/* =========================================================
   ユーティリティ
========================================================= */

function shuffle(arr){

  for(let i=arr.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [arr[i],arr[j]]=
      [arr[j],arr[i]];

  }

  return arr;
}


function log(text){

  const box=
    document.getElementById("log");

  const div=
    document.createElement("div");

  div.textContent=text;

  box.prepend(div);
}


function combinations(arr,n){

  const result=[];

  function rec(start,picked){

    if(picked.length===n){

      result.push([...picked]);
      return;

    }

    for(
      let i=start;
      i<=arr.length-(n-picked.length);
      i++
    ){

      picked.push(i);

      rec(i+1,picked);

      picked.pop();

    }

  }

  rec(0,[]);

  return result;
}


function possibleWords(tiles,length){

  const result=[];

  for(const ids of combinations(tiles,length)){

    const word=
      ids.map(i=>tiles[i]).join("");

    if(WORDS.has(word)){

      result.push({
        word,
        ids
      });

    }

  }

  return result;
}


/* =========================================================
   和了判定
========================================================= */

function solve14(tiles){

  if(tiles.length!==14)
    return null;

  const pairs=
    possibleWords(tiles,2);

  for(const pair of pairs){

    const rest1=
      tiles.filter(
        (_,i)=>!pair.ids.includes(i)
      );

    const aList=
      possibleWords(rest1,3);

    for(const a of aList){

      const rest2=
        rest1.filter(
          (_,i)=>!a.ids.includes(i)
        );

      const bList=
        possibleWords(rest2,3);

      for(const b of bList){

        const rest3=
          rest2.filter(
            (_,i)=>!b.ids.includes(i)
          );

        const cList=
          possibleWords(rest3,3);

        for(const c of cList){

          const rest4=
            rest3.filter(
              (_,i)=>!c.ids.includes(i)
            );

          const dList=
            possibleWords(rest4,3);

          if(dList.length){

            return {
              pair:pair.word,
              words:[
                a.word,
                b.word,
                c.word,
                dList[0].word
              ]
            };

          }

        }

      }

    }

  }

  return null;
}


function completedWords(tiles){

  return [
    ...new Set(
      possibleWords(tiles,3)
        .map(x=>x.word)
    )
  ];

}


function waitsFor(tiles){

  if(tiles.length!==13)
    return [];

  const result=[];

  for(const c of TILE_TYPES){

    if(
      solve14(
        [...tiles,c]
      )
    ){

      result.push(c);

    }

  }

  return result;
}


/* =========================================================
   山
========================================================= */

function makeDeck(){

  const result=[];

  for(const c of TILE_TYPES){

    for(let i=0;i<4;i++){

      result.push(c);

    }

  }

  return shuffle(result);
}


/* =========================================================
   プレイヤー人数変更
========================================================= */

document
.getElementById("playerCount")
.addEventListener("change",function(){

  const n=
    Number(this.value);

  document
    .getElementById("name3box")
    .style.display=
      n>=3 ? "block":"none";

  document
    .getElementById("name4box")
    .style.display=
      n>=4 ? "block":"none";

});


/* =========================================================
   ゲーム開始
========================================================= */

document
.getElementById("start")
.addEventListener("click",startGame);


function startGame(){

  const n=
    Number(
      document
        .getElementById("playerCount")
        .value
    );

  players=[];

  for(let i=1;i<=n;i++){

    players.push({

      name:
        document
          .getElementById("name"+i)
          .value
          .trim()
          ||
          "プレイヤー"+i

    });

  }

  wins=
    Array(n).fill(0);

  stats=
    Array.from(
      {length:n},
      ()=>({
        ron:0,
        tsumo:0,
        chi:0
      })
    );

  books=
    Array.from(
      {length:n},
      ()=>new Set()
    );

  document
    .getElementById("setup")
    .style.display="none";

  document
    .getElementById("game")
    .style.display="block";

  newRound();

}


/* =========================================================
   新しい局
========================================================= */

function newRound(){

  deck=
    makeDeck();

  river=[];

  melds=
    Array.from(
      {length:players.length},
      ()=>[]
    );

  hands=
    Array.from(
      {length:players.length},
      ()=>[]
    );

  turn=0;

  selected=-1;

  gameOver=false;

  pendingRon=null;
  pendingChi=null;

  /*
    最初は全員13枚
  */

  for(let i=0;i<13;i++){

    for(let p=0;p<players.length;p++){

      hands[p].push(
        deck.pop()
      );

    }

  }

  document
    .getElementById("overlay")
    .style.display="none";

  document
    .getElementById("log")
    .innerHTML="";

  log("新しい局が始まった。");

  render();

}


/* =========================================================
   ツモ
========================================================= */

document
.getElementById("draw")
.addEventListener("click",()=>{

  if(gameOver)
    return;

  if(turn!==0){

    log("今は相手の手番。");

    return;

  }

  if(hands[0].length>=14){

    log("先に牌を捨てよう。");

    return;

  }

  if(deck.length===0){

    log("山牌がなくなった。");

    return;

  }

  hands[0].push(
    deck.pop()
  );

  selected=-1;

  render();

  const result=
    solve14(hands[0]);

  if(result){

    showWin(
      0,
      result,
      "ツモ"
    );

  }

});


/* =========================================================
   捨てる
========================================================= */

document
.getElementById("discard")
.addEventListener("click",()=>{

  if(
    gameOver ||
    turn!==0
  )
    return;

  if(hands[0].length!==14){

    log("14枚になるまでツモってね。");

    return;

  }

  if(selected<0){

    log("捨てる牌を選んでね。");

    return;

  }

  const char=
    hands[0].splice(
      selected,
      1
    )[0];

  selected=-1;

  river.push({

    player:0,
    char

  });

  log(
    players[0].name+
    " が「"+
    char+
    "」を捨てた"
  );

  checkDiscard(
    char,
    0
  );

});


/* =========================================================
   ロン
========================================================= */

document
.getElementById("ron")
.addEventListener("click",()=>{

  if(!pendingRon)
    return;

  const data=
    pendingRon;

  pendingRon=null;

  stats[0].ron++;

  showWin(
    0,
    data.result,
    "ロン！"
  );

});


/* =========================================================
   ツモ和了
========================================================= */

document
.getElementById("tsumo")
.addEventListener("click",()=>{

  if(
    gameOver ||
    turn!==0
  )
    return;

  const result=
    solve14(hands[0]);

  if(!result)
    return;

  stats[0].tsumo++;

  showWin(
    0,
    result,
    "ツモ！"
  );

});


/* =========================================================
   チー
========================================================= */

document
.getElementById("chi")
.addEventListener("click",()=>{

  if(!pendingChi)
    return;

  const data=
    pendingChi;

  if(!data.choices.length)
    return;

  /*
    現段階では最初の候補を採用。
    後で候補選択UIを追加する。
  */

  const choice=
    data.choices[0];

  const discardIndex=
    hands[0].length;

  const ownIndexes=
    choice.ids.filter(
      i=>i!==discardIndex
    );

  hands[0]=
    hands[0].filter(
      (_,i)=>!ownIndexes.includes(i)
    );

  melds[0].push(
    choice.word
  );

  stats[0].chi++;

  books[0].add(
    choice.word
  );

  pendingChi=null;

  log(
    "🀄 チー！ "+
    choice.word
  );

  render();

});


/* =========================================================
   捨て牌処理
========================================================= */

function checkDiscard(char,discarder){

  pendingRon=null;
  pendingChi=null;

  /*
    ロン
  */

  if(discarder!==0){

    const result=
      solve14(
        [...hands[0],char]
      );

    if(result){

      pendingRon={
        result,
        char
      };

      log(
        "🔥 「"+
        char+
        "」でロンできる！"
      );

      render();

      return;

    }

  }

  /*
    チー
  */

  if(discarder!==0){

    const all=[
      ...hands[0],
      char
    ];

    const choices=
      possibleWords(all,3)
      .filter(x=>
        x.ids.includes(
          hands[0].length
        )
      );

    if(choices.length){

      pendingChi={
        char,
        choices
      };

      log(
        "🀄 チー候補："+
        choices
          .map(x=>x.word)
          .join(" / ")
      );

      render();

      return;

    }

  }

  nextTurn();

}


/* =========================================================
   次の手番
========================================================= */

function nextTurn(){

  if(gameOver)
    return;

  turn=
    (turn+1)
    %
    players.length;

  render();

  if(turn!==0){

    setTimeout(
      aiTurn,
      650
    );

  }

}


/* =========================================================
   AI
========================================================= */

function aiTurn(){

  if(gameOver)
    return;

  const p=turn;

  if(deck.length===0){

    log("山牌がなくなった。");

    return;

  }

  hands[p].push(
    deck.pop()
  );

  const result=
    solve14(
      hands[p]
    );

  if(result){

    stats[p].tsumo++;

    showWin(
      p,
      result,
      "ツモ！"
    );

    return;

  }

  /*
    できるだけ単語候補を
    残す牌を捨てる
  */

  let bestIndex=0;
  let bestScore=-1;

  for(
    let i=0;
    i<hands[p].length;
    i++
  ){

    const test=
      hands[p].filter(
        (_,j)=>j!==i
      );

    const score=
      completedWords(test).length;

    if(score>bestScore){

      bestScore=score;
      bestIndex=i;

    }

  }

  const char=
    hands[p].splice(
      bestIndex,
      1
    )[0];

  river.push({
    player:p,
    char
  });

  log(
    players[p].name+
    " が「"+
    char+
    "」を捨てた"
  );

  /*
    人間のロン判定
  */

  const humanResult=
    solve14(
      [...hands[0],char]
    );

  if(humanResult){

    pendingRon={
      result:humanResult,
      char
    };

    log(
      "🔥 「"+
      char+
      "」でロンできる！"
    );

    render();

    return;

  }

  nextTurn();

}


/* =========================================================
   和了
========================================================= */

function showWin(
  player,
  result,
  type
){

  gameOver=true;

  wins[player]++;

  const words=[
    ...result.words,
    result.pair
  ];

  words.forEach(w=>
    books[player].add(w)
  );

  document
    .getElementById("winType")
    .textContent=
      type;

  document
    .getElementById("winner")
    .textContent=
      players[player].name+
      " の和了！";

  document
    .getElementById("winWords")
    .innerHTML=
      words
        .map(w=>
          `<span class="winWord">${w}</span>`
        )
        .join("");

  document
    .getElementById("overlay")
    .style.display="flex";

  render();

}


/* =========================================================
   再戦
========================================================= */

document
.getElementById("rematch")
.addEventListener(
  "click",
  newRound
);


/* =========================================================
   描画
========================================================= */

function render(){

  if(!players.length)
    return;


  /* 手番 */

  document
    .getElementById("turn")
    .textContent=
      players[turn].name;


  /* 山 */

  document
    .getElementById("deckCount")
    .textContent=
      deck.length;


  /* 捨て牌 */

  document
    .getElementById("river")
    .innerHTML=
      river
        .map(x=>
          `<div
            class="discardTile"
            title="${players[x.player].name}"
          >${x.char}</div>`
        )
        .join("");


  /* 進行 */

  const words=
    completedWords(
      hands[0]
    );

  const pair=
    possibleWords(
      hands[0],
      2
    );

  const progress=
    document
      .getElementById("progress");

  progress.innerHTML="";

  for(let i=0;i<5;i++){

    const box=
      document.createElement("div");

    box.className=
      "progressBox";

    if(
      i<Math.min(
        words.length,
        4
      )
    ){

      box.classList.add("done");
      box.textContent="3";

    }
    else if(
      i===4 &&
      pair.length
    ){

      box.classList.add("done");
      box.textContent="2";

    }
    else{

      box.textContent=
        i===4
          ? "2"
          : "3";

    }

    progress.appendChild(box);

  }


  /* 手牌 */

  const hand=
    document.getElementById("hand");

  hand.innerHTML="";

  /*
    3文字候補に含まれる牌を
    光らせる
  */

  const candidates=
    new Set();

  for(
    const x of
    possibleWords(
      hands[0],
      3
    )
  ){

    x.ids.forEach(i=>
      candidates.add(i)
    );

  }

  hands[0].forEach(
    (char,i)=>{

      const tile=
        document.createElement("div");

      tile.className="tile";

      tile.textContent=char;

      if(i===selected){

        tile.classList.add(
          "selected"
        );

      }

      if(
        candidates.has(i)
      ){

        tile.classList.add(
          "hint"
        );

      }

      tile.draggable=true;

      tile.onclick=()=>{

        selected=i;

        render();

      };

      tile.ondragstart=()=>{

        dragIndex=i;

      };

      tile.ondragover=e=>
        e.preventDefault();

      tile.ondrop=()=>{

        if(
          dragIndex===null ||
          dragIndex===i
        )
          return;

        const x=
          hands[0]
            .splice(
              dragIndex,
              1
            )[0];

        hands[0]
          .splice(
            i,
            0,
            x
          );

        dragIndex=null;
        selected=-1;

        render();

      };

      hand.appendChild(tile);

    }
  );


  /* 鳴き */

  document
    .getElementById("meldArea")
    .innerHTML=
      melds[0]
        .map(w=>
          `<span class="meld">
            🀄 ${w}
          </span>`
        )
        .join("");


  /* あと何個 */

  const completed=
    Math.min(
      words.length,
      4
    )
    +
    (pair.length ? 1:0);

  document
    .getElementById("remain")
    .textContent=
      Math.max(
        0,
        5-completed
      )+
      "個";


  /* 待ち牌 */

  const waits=
    waitsFor(
      hands[0]
    );

  document
    .getElementById("waits")
    .innerHTML=
      waits.length
        ?
        waits
          .map(c=>
            `<span class="wait">${c}</span>`
          )
          .join("")
        :
        `<span style="color:#7f8d82">
          テンパイしていません
        </span>`;


  /* ボタン */

  document
    .getElementById("draw")
    .disabled=
      gameOver ||
      turn!==0 ||
      hands[0].length>=14;

  document
    .getElementById("discard")
    .disabled=
      gameOver ||
      turn!==0 ||
      hands[0].length!==14;

  document
    .getElementById("ron")
    .disabled=
      !pendingRon;

  document
    .getElementById("chi")
    .disabled=
      !pendingChi;

  document
    .getElementById("tsumo")
    .disabled=
      gameOver ||
      turn!==0 ||
      !solve14(hands[0]);


  /* プレイヤー */

  const playerBox=
    document.getElementById(
      "players"
    );

  playerBox.innerHTML=
    players
      .map((p,i)=>`

        <div class="playerCard
          ${i===turn?"active":""}">

          <div class="playerName">
            ${p.name}
          </div>

          <div class="playerStats">

            🏆 勝利：${wins[i]}<br>

            🔥 ロン：${stats[i].ron}
           　
            ✨ ツモ：${stats[i].tsumo}<br>

            🀄 チー：${stats[i].chi}

          </div>

        </div>

      `)
      .join("");


  /* 相手表示 */

  updateOpponents();


  /* 図鑑 */

  document
    .getElementById("book")
    .innerHTML=
      [...books[0]]
        .sort()
        .map(w=>
          `<span class="bookWord">
            ${w}
          </span>`
        )
        .join("")
      ||
      `<span style="color:#7f8d82">
        まだ発見なし
      </span>`;


  /* 今回の単語 */

  document
    .getElementById("roundWords")
    .innerHTML=
      [...books[0]]
        .slice(-12)
        .map(w=>
          `<span class="bookWord">
            ${w}
          </span>`
        )
        .join("")
      ||
      `<span style="color:#7f8d82">
        まだなし
      </span>`;

}


/* =========================================================
   相手表示
========================================================= */

function updateOpponents(){

  const positions=[
    "opponentTop",
    "opponentLeft",
    "opponentRight"
  ];

  const others=
    players
      .map((p,i)=>({p,i}))
      .filter(x=>x.i!==0);

  positions.forEach(
    (id,index)=>{

      const el=
        document.getElementById(id);

      if(!el)
        return;

      const target=
        others[index];

      if(!target){

        el.style.display="none";

        return;

      }

      el.style.display="block";

      el.innerHTML=`

        <div class="opponentName">
          ${target.p.name}
        </div>

        <div class="opponentInfo">
          手牌：${hands[target.i].length}枚
        </div>

      `;

    }
  );

}

</script>
