<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ひらがな麻雀 V4</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #07110c;
      --panel: #102017;
      --panel-2: #0b1710;
      --line: #385441;
      --gold: #e7c866;
      --text: #f5f1df;
      --muted: #aeb9ad;
      --green: #67c98b;
      --red: #df7068;
      --blue: #80b6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1a3828, #07110c 65%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Yu Gothic", Meiryo, sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: 1px solid #55725d;
      background: #20382a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
    }
    button:hover { filter: brightness(1.12); }
    button:disabled { opacity: .38; cursor: not-allowed; }
    .primary { background: #896b20; border-color: #d8bd62; }
    .danger { background: #522724; border-color: #8d4a45; }
    .ghost { background: transparent; }
    .wrap { max-width: 1450px; margin: auto; padding: 18px; }
    .card {
      background: rgba(16, 32, 23, .94);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px #0005;
    }
    .hidden { display: none !important; }
    .grid { display: grid; gap: 14px; }
    .lobby { max-width: 620px; margin: 7vh auto; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .row button { flex: 0 0 auto; }
    .title { font-size: 30px; font-weight: 950; color: var(--gold); letter-spacing: .05em; }
    .sub { color: var(--muted); font-size: 13px; }
    .small { font-size: 12px; color: var(--muted); }
    .hint { color: var(--green); font-weight: 800; }
    .warn { color: #efb8a8; font-weight: 800; }
    .roomcode { font-size: 32px; font-weight: 950; letter-spacing: .18em; color: var(--gold); padding: 10px 0; }
    .board { display: grid; grid-template-columns: 1fr 320px; gap: 14px; }
    .table { min-height: 650px; position: relative; }
    .players { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .player { padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
    .player.me { border-color: var(--gold); }
    .player.active { box-shadow: 0 0 0 2px #67c98b55; }
    .player.ronable { box-shadow: 0 0 0 2px #df706855, 0 0 30px #df706822; }
    .host-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #314f84;
      color: #e9f0ff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .river, .preview {
      min-height: 110px;
      border: 1px dashed #53685a;
      border-radius: 12px;
      padding: 10px;
      margin-top: 12px;
      background: #0a1510;
    }
    .tiles { display: flex; gap: 7px; flex-wrap: wrap; align-items: end; }
    .tile {
      width: 48px;
      height: 58px;
      border-radius: 8px;
      border: 1px solid #d9cfaa;
      background: #f7f2dc;
      color: #171b16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      user-select: none;
      box-shadow: 0 3px 0 #b6ad91;
      position: relative;
    }
    .tile:hover { transform: translateY(-2px); }
    .tile.selected { outline: 3px solid var(--gold); transform: translateY(-7px); }
    .tile .idx { position: absolute; bottom: 1px; right: 4px; font-size: 9px; color: #777; font-weight: 600; }
    .discard { width: 42px; height: 49px; font-size: 23px; }
    .handzone { margin-top: 18px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button { min-width: 86px; }
    .side h3 { margin: 6px 0 8px; }
    .log { height: 230px; overflow: auto; background: #08120c; border-radius: 10px; padding: 8px; font-size: 12px; }
    .log div { padding: 3px 0; border-bottom: 1px solid #203426; }
    .book { max-height: 260px; overflow: auto; }
    .word { display: inline-block; margin: 4px; padding: 5px 8px; border: 1px solid #48614e; border-radius: 999px; }
    .modal { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal > .card { max-width: 760px; width: 100%; }
    .winner { font-size: 34px; color: var(--gold); font-weight: 950; }
    .pulse { animation: pulse 1.05s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.15); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
      .table { min-height: 500px; }
      .tile { width: 43px; height: 53px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <section id="lobby" class="card lobby">
      <div class="title">ひらがな麻雀</div>
      <p class="sub">2〜4人オンライン対戦 / チーなし・ポンなし / ロンとツモのみ</p>
      <div class="grid">
        <label>名前<input id="name" maxlength="12" placeholder="プレイヤー名"></label>
        <div class="row">
          <button class="primary" id="create">部屋を作る</button>
          <input id="room" maxlength="8" placeholder="部屋コード">
          <button id="join">参加する</button>
        </div>
        <div id="lobbyStatus" class="sub"></div>
        <div id="roomWait" class="hidden"></div>
      </div>
    </section>

    <section id="game" class="hidden">
      <div class="row card" style="margin-bottom:14px">
        <div><b>ひらがな麻雀</b>　部屋 <span id="codeView" class="hint"></span></div>
        <div id="turnView" class="hint"></div>
        <div>

          <button id="leave" class="danger">退出</button>
        </div>
      </div>

      <div class="board">
        <main class="card table">
          <div class="players" id="players"></div>

          <div class="preview">
            <b>成立語プレビュー / 待ち牌</b>
            <div id="previewNow" style="margin-top:8px"></div>
          </div>

          <div class="river">
            <b>公開捨て牌</b>
            <div id="river" class="tiles" style="margin-top:8px"></div>
          </div>

          <div class="handzone">
            <div class="row">
              <b>あなたの手牌</b>
              <span id="handInfo" class="small"></span>
            </div>
            <div id="hand" class="tiles" style="margin-top:10px"></div>
            <div id="actions" class="actions"></div>
            <div id="hint" class="small" style="margin-top:8px"></div>
          </div>
        </main>

        <aside class="card side">
          <h3>部屋の戦績</h3>
          <div id="scores"></div>
          <h3>単語帳</h3>
          <div id="book" class="book"></div>
          <h3>ログ</h3>
          <div id="log" class="log"></div>
        </aside>
      </div>
    </section>

    <div id="modal" class="modal hidden">
      <div class="card">
        <div id="modalBody"></div>
        <div class="actions"><button id="modalClose">閉じる</button></div>
      </div>
    </div>
  </div>

    let peer = null;
    let myId = '';
    let roomCode = '';
    let conn = null;
    let S = null;
    let selected = null;
    let playerToken = '';
    let lastShownResultSig = '';
    let roomClosed = false;

    const conns = {};
    const $ = id => document.getElementById(id);

    function log(text) {
      const el = document.createElement('div');
      el.textContent = text;
      $('log').prepend(el);
    }

    function makeWall() {
      const wall = [];
      for (const c of WALL_BASE) for (let i = 0; i < 4; i++) wall.push(c);
      return shuffle(wall);
    }

    function emptyState() {
      return {
        players: [],
        hands: {},
        melds: {},
        discards: [],
        wall: [],
        current: 0,
        drawn: false,
        started: false,
        books: {},
        wins: {},
        round: 1,
        lastAction: '',
        pending: null,
        result: null,
        hostId: ''
      };
    }

    function name() {
      return ($('name').value || '名無し').trim().slice(0, 12);
    }

    function readStoredSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {};
      } catch {
        return {};
      }
    }

    function writeStoredSession(patch) {
      try {
        const next = { ...readStoredSession(), ...patch };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        return next;
      } catch {
        return patch;
      }
    }

    function ensurePlayerToken() {
      const saved = readStoredSession();
      if (saved.playerToken) return saved.playerToken;
      const token = 'pt-' + uid() + uid();
      writeStoredSession({ playerToken: token });
      return token;
    }

    function rememberSession(extra = {}) {
      writeStoredSession({ name: name(), roomCode, playerToken, ...extra });
    }

    function hostPeerId(code) {
      return 'hiragana-mahjong-v4-' + code.toLowerCase();
    }

    function initPeer(id, cb) {
      peer = new Peer(id, { debug: 0 });
      peer.on('open', openedId => { myId = openedId; cb && cb(); });
      peer.on('error', e => {
        console.error(e);
        $('lobbyStatus').textContent = '通信エラー：' + e.type;
      });
      peer.on('connection', c => { if (role === 'host') setupHostConn(c); });
    }

    function setupHostConn(c) {
      c.on('open', () => {});
      c.on('data', m => hostMessage(c, m));
      c.on('close', () => {
        const p = S?.players.find(x => x.id === c.peer);
        if (p) {
          p.connected = false;
          S.lastAction = `${p.name}が切断されました。再参加で復帰できます。`;
          broadcast();
          renderHost();
        }
      });
    }

    function publicSnap() {
      return {
        players: S.players,
        discards: S.discards,
        melds: S.melds,
        current: S.current,
        drawn: S.drawn,
        started: S.started,
        books: S.books,
        wins: S.wins,
        round: S.round,
        lastAction: S.lastAction,
        pending: S.pending,
        result: S.result,
        hostId: S.hostId,
        wallCount: S.wall.length
      };
    }

    function snapshotFor(id) {
      return { type: 'state', pub: publicSnap(), hand: S.hands[id] || [], me: id };
    }

    function broadcast() {
      if (role !== 'host') return;
      for (const p of S.players) {
        const c = conns[p.id];
        if (c && c.open) c.send(snapshotFor(p.id));
      }
    }

    function replaceIdInCollection(col, fromId, toId) {
      if (col && Object.prototype.hasOwnProperty.call(col, fromId)) {
        col[toId] = col[fromId];
        delete col[fromId];
      }
    }

    function reconnectPlayer(oldId, newId, c, displayName) {
      const player = S.players.find(p => p.id === oldId);
      if (!player) return false;
      player.id = newId;
      player.connected = true;
      player.name = (displayName || player.name || '名無し').slice(0, 12);
      replaceIdInCollection(S.hands, oldId, newId);
      replaceIdInCollection(S.melds, oldId, newId);
      replaceIdInCollection(S.books, oldId, newId);
      replaceIdInCollection(S.wins, oldId, newId);
      if (S.discards) S.discards.forEach(d => { if (d.p === oldId) d.p = newId; });
      if (S.pending) {
        if (S.pending.discardBy === oldId) S.pending.discardBy = newId;
        S.pending.ron = (S.pending.ron || []).map(x => x === oldId ? newId : x);
        S.pending.passed = (S.pending.passed || []).map(x => x === oldId ? newId : x);
      }
      delete conns[oldId];
      conns[newId] = c;
      S.lastAction = `${player.name}が再接続しました。`;
      return true;
    }

    function currentPlayer() {
      return S.players[S.current]?.id;
    }

    function isWord3(a, b, c) {
      return WORDS.has(a + b) && WORDS.has(b + c);
    }

    function canWin(arr, id = myId) {
      const exposed = (S?.melds?.[id] || []).length;
      const need = 4 - exposed;
      return !!partition(arr, need).length;
    }

    function partition(arr, needGroups = 4) {
      if (arr.length !== needGroups * 3 + 2) return [];
      const counts = {};
      arr.forEach(x => counts[x] = (counts[x] || 0) + 1);
      const keys = Object.keys(counts);
      for (const pair of keys) {
        if (counts[pair] < 2) continue;
        const copy = { ...counts };
        copy[pair] -= 2;
        const groups = [];
        if (makeGroups(copy, groups) && groups.length === needGroups) return [...groups, pair + pair];
      }
      return [];
    }

    function makeGroups(counts, out) {
      if (out.length > 4) return false;
      const first = Object.keys(counts).find(x => counts[x] > 0);
      if (!first) return true;
      counts[first]--;
      const seconds = Object.keys(counts).filter(x => counts[x] > 0);
      for (const second of seconds) {
        if (!WORDS.has(first + second)) continue;
        counts[second]--;
        const thirds = Object.keys(counts).filter(x => counts[x] > 0);
        for (const third of thirds) {
          if (!isWord3(first, second, third)) continue;
          counts[third]--;
          out.push(first + second + third);
          if (makeGroups(counts, out)) return true;
          out.pop();
          counts[third]++;
        }
        counts[second]++;
      }
      counts[first]++;
      return false;
    }

    function getWinningTiles(arr, id = myId) {
      const waits = [];
      for (const tile of ALL_TILES) {
        if (canWin([...arr, tile], id) && !waits.includes(tile)) waits.push(tile);
      }
      return waits;
    }

    function evaluateTenpaiPlayers() {
      return S.players.map(p => {
        const waits = getWinningTiles(S.hands[p.id] || [], p.id);
        return { id: p.id, name: p.name, waits, state: waits.length ? 'テンパイ' : 'ノーテン' };
      });
    }

    function finishDraw(reason = '山札が尽きたため流局') {
      S.started = false;
      S.drawn = false;
      S.pending = null;
      S.lastAction = reason;
      S.result = { type: 'draw', reason, tenpai: evaluateTenpaiPlayers(), sig: uid() };
    }

    function autoDrawCurrent() {
      const id = currentPlayer();
      if (!S.started || S.drawn || !id) return false;
      if (!S.wall.length) {
        finishDraw('山札が尽きたため流局です。');
        return false;
      }
      S.hands[id].push(S.wall.pop());
      S.drawn = true;
      S.lastAction = `${playerName(id)}が自動ツモ。`;
      return true;
    }

    function drawFor(id) {
      return currentPlayer() === id && autoDrawCurrent();
    }

    function advanceTurn() {
      if (!S.started) return;
      S.pending = null;
      S.current = (S.current + 1) % S.players.length;
      S.drawn = false;
      const drew = autoDrawCurrent();
      if (drew && S.started) S.lastAction = `${playerName(currentPlayer())}の番。自動ツモ。`;
    }

    function discardFor(id, index) {
      if (currentPlayer() !== id || !S.drawn) return false;
      const hand = S.hands[id];
      if (index < 0 || index >= hand.length) return false;
      const tile = hand.splice(index, 1)[0];
      S.discards.push({ p: id, tile });
      S.drawn = false;
      const ron = S.players
        .filter(p => p.id !== id)
        .filter(p => canWin([...S.hands[p.id], tile], p.id))
        .map(p => p.id);
      S.pending = { discardBy: id, tile, ron, passed: [] };
      S.lastAction = `${playerName(id)}が「${tile}」を捨てた。`;
      if (!S.pending.ron.length) advanceTurn();
      broadcast();
      return true;
    }

    function resultBreakdownHtml(words, pair) {
      const rows = words.map((w, i) =>
        `<div><b>語${i + 1}</b> <span class="word">${escapeHtml(w)}</span> <span class="small">(${escapeHtml(w.slice(0, 2))} / ${escapeHtml(w.slice(1, 3))})</span></div>`
      ).join('');
      const pairRow = pair ? `<div><b>対子</b> <span class="word">${escapeHtml(pair)}</span></div>` : '';
      return rows || pairRow ? `<div class="grid" style="margin-top:10px">${rows}${pairRow}</div>` : '';
    }

    function buildWinningPreview(hand, id = myId, extraTile = '') {
      const full = extraTile ? [...hand, extraTile] : [...hand];
      const exposed = (S.melds[id] || []).length;
      const parts = partition(full, 4 - exposed);
      if (!parts.length) return null;
      return {
        words: parts.filter(w => w.length === 3),
        pair: parts.find(w => w.length === 2) || '',
        extraTile
      };
    }

    function miniTilesHtml(list) {
      if (!list.length) return '<div class="small" style="margin-top:8px">待ちなし</div>';
      return `<div class="tiles" style="margin-top:8px">${list.map(x => `<div class="tile discard">${escapeHtml(x)}</div>`).join('')}</div>`;
    }

    function discardPreviewData(hand, id = myId, index = selected) {
      if (index == null || index < 0 || index >= hand.length) return null;
      const next = [...hand];
      const tile = next.splice(index, 1)[0];
      const waits = getWinningTiles(next, id);
      return { tile, waits, state: waits.length ? 'テンパイ' : 'ノーテン' };
    }

    function previewPanelHtml(hand) {
      if (roomClosed) return `<div class="warn">${escapeHtml(HOST_LEFT_MESSAGE)}</div>`;

      if (S.pending?.ron?.includes(myId)) {
        const preview = buildWinningPreview(hand, myId, S.pending.tile);
        return `<div class="warn pulse">ロン可能！ 牌 ${escapeHtml(S.pending.tile)}</div>${preview ? resultBreakdownHtml(preview.words, preview.pair) : ''}`;
      }

      if (currentPlayer() === myId && S.drawn && canWin(hand, myId)) {
        const preview = buildWinningPreview(hand, myId);
        return `<div class="hint">ツモ可能です。</div>${preview ? resultBreakdownHtml(preview.words, preview.pair) : ''}`;
      }

      if (currentPlayer() === myId && S.drawn) {
        const info = discardPreviewData(hand, myId, selected);
        if (info) {
          return `<div><b>${escapeHtml(info.tile)}</b> を切ると <span class="${info.waits.length ? 'hint' : 'warn'}">${info.state}</span></div><div class="small">待ち牌 ${info.waits.length}種</div>${miniTilesHtml(info.waits)}`;
        }
        return '<div class="small">牌を選ぶと、捨てたあとの待ち牌を表示します。</div>';
      }

      const waits = getWinningTiles(hand, myId);
      if (hand.length % 3 === 1 && waits.length) {
        return `<div class="hint">現在テンパイです。</div><div class="small">待ち牌 ${waits.length}種</div>${miniTilesHtml(waits)}`;
      }

      return '<div class="small">プレビューは自分の手番中に表示されます。</div>';
    }

    function finishWin(id, kind, from) {
      const winTile = kind === 'ロン' ? S.pending?.tile : null;
      const exposed = (S.melds[id] || []).length;
      const fullHand = kind === 'ロン' && winTile ? [...S.hands[id], winTile] : [...S.hands[id]];
      const parts = partition(fullHand, 4 - exposed);
      if (!parts.length) return;
      const words = parts.filter(w => w.length === 3);
      const pair = parts.find(w => w.length === 2) || '';
      const book = S.books[id] || [];
      words.forEach(w => { if (!book.includes(w)) book.push(w); });
      S.books[id] = book;
      S.wins[id] = (S.wins[id] || 0) + 1;
      S.lastAction = `${playerName(id)}が${kind}！`;
      S.started = false;
      S.pending = null;
      S.result = { type: 'win', winner: id, kind, from, winTile, words, pair, wins: S.wins[id], sig: uid() };
    }

    function playerName(id) {
      return S.players.find(p => p.id === id)?.name || '名無し';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]);
    }

    function resultModalHtml() {
      if (!S?.result) return '';
      if (S.result.type === 'draw') {
        const rows = (S.result.tenpai || []).map(p =>
          `<div><b>${escapeHtml(p.name)}</b> <span class="${p.waits?.length ? 'hint' : 'warn'}">${escapeHtml(p.state || 'ノーテン')}</span>${p.waits?.length ? `<div class="small">待ち: ${escapeHtml(p.waits.join(' '))}</div>` : ''}</div>`
        ).join('');
        return `<div class="winner">流局</div><p>${escapeHtml(S.result.reason || '流局です。')}</p><div class="grid" style="margin-top:10px">${rows}</div><p>部屋の勝利数はそのままです。</p>`;
      }
      if (S.result.type === 'notice') {
        return `<div class="winner">対局終了</div><p>${escapeHtml(S.result.reason || HOST_LEFT_MESSAGE)}</p>`;
      }
      const winnerName = playerName(S.result.winner);
      return `<div class="winner">${escapeHtml(winnerName)}　${escapeHtml(S.result.kind || '和了')}！</div><p>${S.result.kind === 'ロン' && S.result.winTile ? `ロン牌：${escapeHtml(S.result.winTile)} / ` : ''}この部屋の勝利数：${S.result.wins || 0}</p>${resultBreakdownHtml(S.result.words || [], S.result.pair || '')}`;
    }

    function showModal(html) {
      $('modalBody').innerHTML = html;
      $('modal').classList.remove('hidden');
    }

    function rerenderSelf() {
      if (!S) return;
      renderState({
        pub: {
          players: S.players,
          discards: S.discards,
          melds: S.melds,
          current: S.current,
          drawn: S.drawn,
          started: S.started,
          books: S.books,
          wins: S.wins,
          round: S.round,
          lastAction: S.lastAction,
          pending: S.pending,
          result: S.result,
          hostId: S.hostId,
          wallCount: S.wall?.length ?? 0
        },
        hand: S.hands?.[myId] || [],
        me: myId
      });
    }

    function renderHost() {
      if (!S) return;
      renderState(snapshotFor(myId));
    }

    function renderState(msg) {
      S = { ...S, ...msg.pub };
      S.hands = S.hands || {};
      S.hands[myId] = msg.hand || S.hands[myId] || [];

      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      $('codeView').textContent = roomCode;
      $('turnView').textContent = roomClosed
        ? '対局終了'
        : S.started
          ? `手番：${playerName(currentPlayer())} / 山 ${S.wallCount}枚`
          : `対局待機中 / 山 ${S.wallCount ?? 0}枚`;

      $('players').innerHTML = S.players.map(p => `
        <div class="player ${p.id === myId ? 'me ' : ''}${p.id === currentPlayer() && S.started ? 'active ' : ''}${S.pending?.ron?.includes(p.id) ? 'ronable' : ''}">
          <b>${escapeHtml(p.name)}</b>
          ${p.isHost ? '<span class="host-badge">HOST</span>' : ''}
          ${p.id === myId ? '（あなた）' : ''}
          ${p.connected === false ? '<span class="warn"> 切断中</span>' : ''}
          <br>
          <span class="small">${p.id === currentPlayer() && S.started ? '● 手番' : ''}　勝利 ${S.wins[p.id] || 0}</span>
        </div>
      `).join('');

      $('river').innerHTML = S.discards.map((d, i) =>
        `<div class="tile discard" title="${escapeHtml(playerName(d.p))}">${escapeHtml(d.tile)}<span class="idx">${i + 1}</span></div>`
      ).join('');

      const hand = S.hands[myId] || [];
      $('previewNow').innerHTML = previewPanelHtml(hand);
      $('hand').innerHTML = hand.map((x, i) => `
        <div class="tile ${selected === i ? 'selected' : ''}"
             draggable="true"
             data-i="${i}"
             onclick="tileClick(${i})"
             ondragstart="dragStart(event, ${i})"
             ondragover="event.preventDefault()"
             ondrop="dropTile(event, ${i})">
          ${escapeHtml(x)}<span class="idx">${i + 1}</span>
        </div>
      `).join('');

      $('handInfo').textContent = `${hand.length}枚　※牌をクリックすると濁音・半濁音・小文字を順番に切替`;

      const actions = $('actions');
      actions.innerHTML = '';
      const myTurn = currentPlayer() === myId;
      if (S.started && myTurn && S.drawn) {
        button('選択牌を捨てる', 'discard', selected == null);
        button('ツモ！', 'tsumo', !canWin(hand, myId));
      }
      if (S.pending?.ron?.includes(myId)) {
        button('ロン！', 'ron', false);
        button('見送る', 'pass', false);
      }

      $('hint').innerHTML = roomClosed
        ? `<span class="warn">${escapeHtml(HOST_LEFT_MESSAGE)}</span>`
        : S.started && myTurn && S.drawn
          ? '自動ツモ済み。捨てる牌を選択。選択中の牌を切ったあとの待ち牌も上に表示します。'
          : S.pending?.ron?.includes(myId)
            ? '<span class="warn pulse">ロンできます。見送ると次の手番へ進みます。</span>'
            : S.started
              ? '自分の手番以外は手牌を自由に並べ替えできます。'
              : '対局結果を確認して再戦できます。';

      $('scores').innerHTML = S.players.map(p => `${escapeHtml(p.name)}：${S.wins[p.id] || 0}勝`).join('<br>');
      $('book').innerHTML = (S.books[myId] || []).map(w => `<span class="word">${escapeHtml(w)}</span>`).join('') || '<span class="small">まだ登録なし</span>';

      const resultSig = S.result?.sig || '';
      if (resultSig && resultSig !== lastShownResultSig) {
        showModal(resultModalHtml());
        lastShownResultSig = resultSig;
      } else if (!resultSig) {
        lastShownResultSig = '';
        $('modal').classList.add('hidden');
      }
    }

    function button(label, type, disabled) {
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = disabled || roomClosed;
      if (type === 'ron') b.classList.add('danger', 'pulse');
      if (type === 'tsumo' && !disabled) b.classList.add('primary');
      b.onclick = () => {
        if (type === 'discard') {
          if (selected == null) return;
          send({ type, index: selected });
          selected = null;
        } else {
          send({ type });
        }
      };
      $('actions').appendChild(b);
    }

    function tileClick(i) {
      const hand = S.hands[myId] || [];
      if (i < 0 || i >= hand.length) return;
      if (selected === i && CYCLE[hand[i]]) {
        send({ type: 'transform', index: i });
        return;
      }
      selected = i;
      rerenderSelf();
    }

    function dragStart(e, i) {
      e.dataTransfer.setData('text/plain', String(i));
      selected = i;
    }

    function dropTile(e, to) {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData('text/plain'));
      if (Number.isInteger(from) && from !== to) {
        send({ type: 'reorder', from, to });
        selected = to;
      }
    }

    function applyAction(id, action) {
      if (!S || !S.started || !action) return;
      let ok = false;
      if (action.type === 'draw') ok = drawFor(id);
      else if (action.type === 'transform') {
        const hand = S.hands[id] || [];
        if (Number.isInteger(action.index) && action.index >= 0 && action.index < hand.length && CYCLE[hand[action.index]]) {
          hand[action.index] = CYCLE[hand[action.index]];
          ok = true;
          S.lastAction = `${playerName(id)}が牌を変換。`;
        }
      } else if (action.type === 'reorder') {
        const hand = S.hands[id] || [];
        if (Number.isInteger(action.from) && Number.isInteger(action.to) && action.from >= 0 && action.to >= 0 && action.from < hand.length && action.to < hand.length && action.from !== action.to) {
          [hand[action.from], hand[action.to]] = [hand[action.to], hand[action.from]];
          ok = true;
        }
      } else if (action.type === 'discard') ok = discardFor(id, action.index);
      else if (action.type === 'ron') {
        if (S.pending?.ron.includes(id)) { finishWin(id, 'ロン', S.pending.discardBy); ok = true; }
      } else if (action.type === 'tsumo') {
        if (currentPlayer() === id && S.drawn && canWin(S.hands[id], id)) { finishWin(id, 'ツモ', id); ok = true; }
      } else if (action.type === 'pass') {
        if (S.pending?.ron?.includes(id) && !S.pending.passed.includes(id)) {
          S.pending.passed.push(id);
          if (S.pending.ron.every(x => S.pending.passed.includes(x))) advanceTurn();
          ok = true;
        }
      } else if (action.type === 'newRound') {
        if (role === 'host') { startGame(); ok = true; }
      }
      if (ok) broadcast();
      renderHost();
    }

    function hostMessage(c, m) {
      if (!S) return;
      if (m.type === 'join') {
        const joinName = (m.name || '名無し').trim().slice(0, 12);
        const token = m.token || '';
        const existing = token ? S.players.find(x => x.token === token) : null;
        if (existing && !existing.connected) {
          reconnectPlayer(existing.id, c.peer, c, joinName);
          c.send({ type: 'joined', id: c.peer, code: roomCode, reconnected: true });
          broadcast();
          return;
        }
        if (S.started) return c.send({ type: 'error', msg: '対局中です。同じ端末から同じ名前で入り直して復帰してください。' });
        if (S.players.length >= 4) return c.send({ type: 'error', msg: '満員です' });
        const p = { id: c.peer, name: joinName, connected: true, isHost: false, token: token || ('guest-' + uid()) };
        S.players.push(p);
        S.hands[p.id] = [];
        S.books[p.id] = [];
        S.wins[p.id] = 0;
        conns[p.id] = c;
        c.send({ type: 'joined', id: p.id, code: roomCode });
        broadcast();
        $('roomWait').innerHTML = `参加者 ${S.players.length}/4　<button onclick="startGame()" class="primary">対局開始</button>`;
        return;
      }
      if (m.type === 'action') applyAction(c.peer, m.action);
      if (m.type === 'chat') log(m.text || '');
    }

    function send(action) {
      if (roomClosed) return;
      if (role === 'host') applyAction(myId, action);
      else if (conn?.open) conn.send({ type: 'action', action });
    }

    function handleHostDisconnected() {
      roomClosed = true;
      if (S) {
        S.started = false;
        S.drawn = false;
        S.pending = null;
        S.lastAction = HOST_LEFT_MESSAGE;
        S.result = { type: 'notice', reason: HOST_LEFT_MESSAGE, sig: uid() };
        rerenderSelf();
      }
      showModal(`<div class="winner">対局終了</div><p>${escapeHtml(HOST_LEFT_MESSAGE)}</p>`);
    }

    $('modalClose').onclick = () => $('modal').classList.add('hidden');
    $('newRound').onclick = () => {
      if (roomClosed) return;
      if (role === 'host') startGame();
      else send({ type: 'newRound' });
    };
    $('leave').onclick = () => location.reload();

    const savedSession = readStoredSession();
    if (savedSession.name) $('name').value = savedSession.name;
    if (savedSession.roomCode) $('room').value = savedSession.roomCode;
    playerToken = ensurePlayerToken();

    $('create').onclick = () => {
      playerToken = ensurePlayerToken();
      roomClosed = false;
      roomCode = Math.random().toString(36).slice(2, 7).toUpperCase();
      role = 'host';
      rememberSession();
      $('lobbyStatus').textContent = '部屋を作成中…';
      initPeer(hostPeerId(roomCode), () => {
        S = emptyState();
        S.hostId = myId;
        S.players = [{ id: myId, name: name(), connected: true, isHost: true, token: playerToken }];
        S.hands[myId] = [];
        S.books[myId] = [];
        S.wins[myId] = 0;
        rememberSession({ host: true });
        $('lobbyStatus').innerHTML = '部屋コード';
        $('roomWait').classList.remove('hidden');
        $('roomWait').innerHTML = `<div class="roomcode">${roomCode}</div>参加者 1/4　友達にこのコードを渡して参加してもらってください。<br><button class="primary" onclick="startGame()">対局開始</button>`;
      });
    };

    $('join').onclick = () => {
      playerToken = ensurePlayerToken();
      roomClosed = false;
      roomCode = ($('room').value || '').trim().toUpperCase();
      if (!roomCode) return;
      role = 'guest';
      rememberSession({ host: false });
      $('lobbyStatus').textContent = '参加中…';
      initPeer('guest-' + uid(), () => {
        conn = peer.connect(hostPeerId(roomCode), { reliable: true });
        conn.on('open', () => conn.send({ type: 'join', name: name(), token: playerToken }));
        conn.on('data', m => {
          if (m.type === 'joined') {
            myId = m.id;
            rememberSession({ host: false });
            $('lobbyStatus').textContent = m.reconnected ? '再接続しました。対局に復帰します。' : '参加しました。ホストの開始を待っています。';
          } else if (m.type === 'state') {
            roomClosed = false;
            renderState(m);
            log(S.lastAction || '');
          } else if (m.type === 'error') {
            $('lobbyStatus').textContent = m.msg;
          }
        });
        conn.on('close', () => handleHostDisconnected());
      });
    };

    function startGame() {
      roomClosed = false;
      S.started = true;
      S.wall = makeWall();
      S.current = 0;
      S.drawn = false;
      S.discards = [];
      S.melds = {};
      S.pending = null;
      S.result = null;
      lastShownResultSig = '';
      S.players.forEach(p => {
        p.connected = true;
        S.hands[p.id] = S.wall.splice(0, 13);
        S.melds[p.id] = [];
        if (!S.books[p.id]) S.books[p.id] = [];
        if (S.wins[p.id] == null) S.wins[p.id] = 0;
      });
      S.lastAction = '対局開始。各自13枚からスタート。';
      autoDrawCurrent();
      broadcast();
      renderHost();
    }
  </script>
</body>
</html>
