<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ひらがな麻雀 V5</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #07110c;
      --felt: #0f2b1d;
      --felt-2: #123524;
      --line: #3f5d4a;
      --gold: #e6c45d;
      --text: #f5f1df;
      --muted: #aab5a9;
      --accent: #6dd39a;
      --danger: #e07b73;
      --pond: #0a1911;
      --tile-face: #f7f2dc;
      --tile-edge: #d2c79f;
      --tile-text: #171b16;
      --word1: #ff8a80;
      --word2: #ffd180;
      --word3: #ffff8d;
      --word4: #a7ffeb;
      --word5: #82b1ff;
      --word6: #b388ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b402c, #07110c 68%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Yu Gothic", Meiryo, sans-serif;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: 1px solid #55725d;
      background: #20382a;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .38; cursor: not-allowed; }
    .primary { background: #8c6d23; border-color: #d6bb62; }
    .danger { background: #542826; border-color: #8d4a45; }
    .ghost { background: transparent; }
    .wrap { max-width: 1480px; margin: auto; padding: 18px; }
    .card {
      background: rgba(16, 32, 23, .94);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px #0005;
    }
    .hidden { display: none !important; }
    .grid { display: grid; gap: 14px; }
    .lobby { max-width: 620px; margin: 7vh auto; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .row button { flex: 0 0 auto; }
    .title { font-size: 30px; font-weight: 950; color: var(--gold); letter-spacing: .05em; }
    .sub { color: var(--muted); font-size: 13px; }
    .small { color: var(--muted); font-size: 12px; }
    .hint { color: var(--accent); font-weight: 800; }
    .warn { color: #f0b5a5; font-weight: 800; }
    .roomcode { font-size: 32px; font-weight: 950; letter-spacing: .18em; color: var(--gold); padding: 10px 0; }
    .board { display: grid; grid-template-columns: 1fr 320px; gap: 14px; }
    .table { min-height: 760px; }
    .table-layout {
      display: grid;
      grid-template-columns: 180px 1fr 180px;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      align-items: stretch;
    }
    .seat {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(11, 23, 16, .96);
      padding: 10px;
      min-height: 84px;
    }
    .seat.active { box-shadow: 0 0 0 2px #6dd39a55; }
    .seat.me { border-color: var(--gold); }
    .seatTop { grid-column: 2; grid-row: 1; }
    .seatLeft { grid-column: 1; grid-row: 2; align-self: center; }
    .seatCenter {
      grid-column: 2;
      grid-row: 2;
      background: radial-gradient(circle at center, var(--felt-2), var(--felt));
      border: 1px solid #496b57;
      border-radius: 22px;
      padding: 18px;
      box-shadow: inset 0 0 0 1px #ffffff0f, inset 0 0 30px #0000002e;
      min-height: 380px;
    }
    .seatRight { grid-column: 3; grid-row: 2; align-self: center; }
    .seatBottom { grid-column: 2; grid-row: 3; }
    .centerHead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .pond {
      background: rgba(7, 16, 11, .72);
      border: 1px solid #526b58;
      border-radius: 16px;
      padding: 14px;
      min-height: 245px;
    }
    .pondTitle { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .riverGrid {
      display: grid;
      grid-template-columns: repeat(6, 42px);
      gap: 7px;
      align-content: start;
      min-height: 175px;
    }
    .tiles { display: flex; gap: 7px; flex-wrap: wrap; align-items: end; }
    .handzone { margin-top: 16px; }
    .tile {
      width: 48px;
      height: 58px;
      border-radius: 8px;
      border: 1px solid var(--tile-edge);
      background: var(--tile-face);
      color: var(--tile-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      user-select: none;
      box-shadow: 0 3px 0 #b6ad91;
      position: relative;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .tile:hover { transform: translateY(-2px); }
    .tile.selected { outline: 3px solid var(--gold); transform: translateY(-7px); }
    .tile .idx { position: absolute; bottom: 1px; right: 4px; font-size: 9px; color: #777; font-weight: 600; }
    .discard { width: 42px; height: 49px; font-size: 23px; }
    .word0 { box-shadow: inset 0 -8px 0 var(--word1), 0 3px 0 #b6ad91; }
    .word1 { box-shadow: inset 0 -8px 0 var(--word2), 0 3px 0 #b6ad91; }
    .word2 { box-shadow: inset 0 -8px 0 var(--word3), 0 3px 0 #b6ad91; }
    .word3 { box-shadow: inset 0 -8px 0 var(--word4), 0 3px 0 #b6ad91; }
    .word4 { box-shadow: inset 0 -8px 0 var(--word5), 0 3px 0 #b6ad91; }
    .word5 { box-shadow: inset 0 -8px 0 var(--word6), 0 3px 0 #b6ad91; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .legendItem { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 800; }
    .legend0 { background: color-mix(in srgb, var(--word1) 28%, transparent); }
    .legend1 { background: color-mix(in srgb, var(--word2) 28%, transparent); }
    .legend2 { background: color-mix(in srgb, var(--word3) 28%, transparent); color: #393400; }
    .legend3 { background: color-mix(in srgb, var(--word4) 28%, transparent); color: #00352e; }
    .legend4 { background: color-mix(in srgb, var(--word5) 28%, transparent); }
    .legend5 { background: color-mix(in srgb, var(--word6) 28%, transparent); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button { min-width: 86px; }
    .side h3 { margin: 6px 0 8px; }
    .log { height: 230px; overflow: auto; background: #08120c; border-radius: 10px; padding: 8px; font-size: 12px; }
    .log div { padding: 3px 0; border-bottom: 1px solid #203426; }
    .book { max-height: 260px; overflow: auto; }
    .word { display: inline-block; margin: 4px; padding: 5px 8px; border: 1px solid #48614e; border-radius: 999px; }
    .statusLine { margin-top: 8px; min-height: 20px; }
    .modal { position: fixed; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal > .card { max-width: 760px; width: 100%; }
    .winner { font-size: 34px; color: var(--gold); font-weight: 950; }
    @media (max-width: 980px) {
      .board { grid-template-columns: 1fr; }
      .table-layout { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; }
      .seatTop, .seatLeft, .seatCenter, .seatRight, .seatBottom { grid-column: 1; }
      .seatTop { grid-row: 1; }
      .seatLeft { grid-row: 2; }
      .seatCenter { grid-row: 3; }
      .seatRight { grid-row: 4; }
      .seatBottom { grid-row: 5; }
      .riverGrid { grid-template-columns: repeat(6, 42px); justify-content: center; }
      .tile { width: 43px; height: 53px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <section id="lobby" class="card lobby">
      <div class="title">ひらがな麻雀</div>
      <p class="sub">2〜4人オンライン対戦 / チーなし・ポンなし / ロン・ツモ・流局のみ</p>
      <div class="grid">
        <label>名前<input id="name" maxlength="12" placeholder="プレイヤー名"></label>
        <div class="row">
          <button class="primary" id="create">部屋を作る</button>
          <input id="room" maxlength="8" placeholder="部屋コード">
          <button id="join">参加する</button>
        </div>
        <div id="lobbyStatus" class="sub"></div>
        <div id="roomWait" class="hidden"></div>
      </div>
    </section>

    <section id="game" class="hidden">
      <div class="row card" style="margin-bottom:14px">
        <div><b>ひらがな麻雀</b>　部屋 <span id="codeView" class="hint"></span></div>
        <div id="turnView" class="hint"></div>
        <div>
          <button id="newRound" class="ghost">再戦</button>
          <button id="leave" class="danger">退出</button>
        </div>
      </div>

      <div class="board">
        <main class="card table">
          <div class="table-layout">
            <div id="seatTop" class="seat seatTop"></div>
            <div id="seatLeft" class="seat seatLeft"></div>
            <div class="seatCenter">
              <div class="centerHead">
                <div><b>場</b><div id="lastAction" class="small" style="margin-top:4px"></div></div>
                <div class="small">山 <span id="wallCount">0</span> 枚</div>
              </div>
              <div class="pond">
                <div class="pondTitle">
                  <b>河（かわ）</b>
                  <span class="small">捨て牌</span>
                </div>
                <div id="river" class="riverGrid"></div>
              </div>
            </div>
            <div id="seatRight" class="seat seatRight"></div>
            <div id="seatBottom" class="seat seatBottom"></div>
          </div>

          <div class="handzone">
            <div class="row">
              <b>あなたの手牌</b>
              <span id="handInfo" class="small"></span>
            </div>
            <div id="hand" class="tiles" style="margin-top:10px"></div>
            <div id="wordLegend" class="legend"></div>
            <div id="actions" class="actions"></div>
            <div id="hint" class="statusLine small"></div>
          </div>
        </main>

        <aside class="card side">
          <h3>部屋の戦績</h3>
          <div id="scores"></div>
          <h3>登録語</h3>
          <div id="book" class="book"></div>
          <h3>ログ</h3>
          <div id="log" class="log"></div>
        </aside>
      </div>
    </section>

    <div id="modal" class="modal hidden">
      <div class="card">
        <div id="modalBody"></div>
        <div class="actions"><button id="modalClose">閉じる</button></div>
      </div>
    </div>
  </div>

  <script>
    // ===== ひらがな麻雀 V5 =====
    // 語彙は「ひらがな 2文字 / 3文字」の一般名詞中心のみを採用。
    // 濁音・半濁音・拗音・促音（例: が / ぱ / ゃ / っ）は 1牌 として扱い、牌クリックで変換します。

    const BASE = [...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];
    const RAW_WORDS = `
あき あし あせ あな あみ あめ あわ いえ いけ いし いす いと いぬ いね いも いわ うし うた
うで うに うま うみ えき えだ えび えり おか おけ おと おに おゆ かい かお かぎ かさ かた
かべ かみ かゆ かわ きく きし きた きぬ きり くき くさ くし くつ くに くも こえ こけ こな
こめ さけ さと さば しか しま しる すし すみ せき せみ そら たい たこ たに たね たま つき
つち つの つゆ てら とら とり なし なべ なみ にく にわ ぬの はし はた はな はね はら ひざ
ひと ひも ふえ ふね ふろ へび へや ほし ほね ほん まち まど まめ まゆ みず みそ みち みみ
むし むね めし もじ もり やま ゆき ゆめ よる りく わた わに あらし いちご いなか いのち いわし えのぐ
えほん おかし おとな おやつ かえる かがみ かもめ からす かわら きつね きもの くじら くるま けしき けむり こいぬ ことり こども
こねこ こむぎ さかな さくら さとう しずく すいか すずめ せかい せなか たぬき たまご たわし つくえ つばき つばめ つみき てがみ
とけい とんぼ なすび なみだ ねずみ のはら はさみ はっぱ はなび ひつじ ひのき ふすま ふたご へいわ ほうき ほたて ほたる ぼたん
まくら まつり みかん みどり みのり みらい めがね めだか もみじ やかん やさい ゆうひ ゆかた ゆびわ よもぎ らっぱ りんご わかめ
わさび わたげ
`.trim().split(/\s+/);
    const WORDS = [...new Set(RAW_WORDS.filter(w => /^[ぁ-ゖ]+$/.test(w) && (w.length === 2 || w.length === 3)))];
    const WORDS_BY_LEN = {
      2: WORDS.filter(w => w.length === 2),
      3: WORDS.filter(w => w.length === 3)
    };
    const WORD_SET = new Set(WORDS);

    const TRANS = {
      'あ':['あ','ぁ'],'い':['い','ぃ'],'う':['う','ぅ','ゔ'],'え':['え','ぇ'],'お':['お','ぉ'],
      'か':['か','が'],'き':['き','ぎ'],'く':['く','ぐ'],'け':['け','げ'],'こ':['こ','ご'],
      'さ':['さ','ざ'],'し':['し','じ'],'す':['す','ず'],'せ':['せ','ぜ'],'そ':['そ','ぞ'],
      'た':['た','だ'],'ち':['ち','ぢ'],'つ':['つ','づ','っ'],'て':['て','で'],'と':['と','ど'],
      'は':['は','ば','ぱ'],'ひ':['ひ','び','ぴ'],'ふ':['ふ','ぶ','ぷ'],'へ':['へ','べ','ぺ'],'ほ':['ほ','ぼ','ぽ'],
      'や':['や','ゃ'],'ゆ':['ゆ','ゅ'],'よ':['よ','ょ'],'わ':['わ','ゎ']
    };

    const CYCLE = {};
    Object.entries(TRANS).forEach(([base, arr]) => arr.forEach((x, i) => CYCLE[x] = arr[(i + 1) % arr.length]));
    const STORAGE_KEY = 'hiragana-mahjong-v5-session';
    const HOST_LEFT_MESSAGE = 'ホストが切断されたため、この対局は終了しました。ページを再読み込みして新しい部屋を作り直してください。';
    const WORD_COLORS = ['word0','word1','word2','word3','word4','word5'];

    const uid = () => Math.random().toString(36).slice(2, 9);
    const shuffle = arr => {
      arr = [...arr];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    let role = '';
    let peer = null;
    let myId = '';
    let roomCode = '';
    let conn = null;
    let S = null;
    let selected = null;
    let playerToken = '';
    let lastShownResultSig = '';
    let roomClosed = false;

    const conns = {};
    const $ = id => document.getElementById(id);

    function log(text) {
      const el = document.createElement('div');
      el.textContent = text;
      $('log').prepend(el);
    }

    function makeWall() {
      const wall = [];
      for (const c of BASE) for (let i = 0; i < 4; i++) wall.push(c);
      return shuffle(wall);
    }

    function emptyState() {
      return {
        players: [],
        hands: {},
        discards: [],
        wall: [],
        current: 0,
        drawn: false,
        started: false,
        books: {},
        wins: {},
        lastAction: '',
        pending: null,
        result: null,
        hostId: ''
      };
    }

    function readStoredSession() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {}; }
      catch { return {}; }
    }

    function writeStoredSession(patch) {
      try {
        const next = { ...readStoredSession(), ...patch };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        return next;
      } catch {
        return patch;
      }
    }

    function ensurePlayerToken() {
      const saved = readStoredSession();
      if (saved.playerToken) return saved.playerToken;
      const token = 'pt-' + uid() + uid();
      writeStoredSession({ playerToken: token });
      return token;
    }

    function rememberSession(extra = {}) {
      writeStoredSession({ name: playerNameInput(), roomCode, playerToken, ...extra });
    }

    function playerNameInput() {
      return ($('name').value || '名無し').trim().slice(0, 12);
    }

    function hostPeerId(code) {
      return 'hiragana-mahjong-v5-' + code.toLowerCase();
    }

    function initPeer(id, cb) {
      peer = new Peer(id, { debug: 0 });
      peer.on('open', openedId => { myId = openedId; cb && cb(); });
      peer.on('error', e => {
        console.error(e);
        $('lobbyStatus').textContent = '通信エラー：' + e.type;
      });
      peer.on('connection', c => { if (role === 'host') setupHostConn(c); });
    }

    function setupHostConn(c) {
      c.on('open', () => {});
      c.on('data', m => hostMessage(c, m));
      c.on('close', () => {
        const p = S?.players.find(x => x.id === c.peer);
        if (p) {
          p.connected = false;
          S.lastAction = `${p.name}が切断されました。再参加で復帰できます。`;
          broadcast();
          renderHost();
        }
      });
    }

    function publicSnap() {
      return {
        players: S.players,
        discards: S.discards,
        current: S.current,
        drawn: S.drawn,
        started: S.started,
        books: S.books,
        wins: S.wins,
        lastAction: S.lastAction,
        pending: S.pending,
        result: S.result,
        hostId: S.hostId,
        wallCount: S.wall.length
      };
    }

    function snapshotFor(id) {
      return { type: 'state', pub: publicSnap(), hand: S.hands[id] || [], me: id };
    }

    function broadcast() {
      if (role !== 'host') return;
      for (const p of S.players) {
        const c = conns[p.id];
        if (c && c.open) c.send(snapshotFor(p.id));
      }
    }

    function playerName(id) {
      return S.players.find(p => p.id === id)?.name || '名無し';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    function replaceIdInCollection(col, fromId, toId) {
      if (col && Object.prototype.hasOwnProperty.call(col, fromId)) {
        col[toId] = col[fromId];
        delete col[fromId];
      }
    }

    function reconnectPlayer(oldId, newId, c, displayName) {
      const player = S.players.find(p => p.id === oldId);
      if (!player) return false;
      player.id = newId;
      player.connected = true;
      player.name = (displayName || player.name || '名無し').slice(0, 12);
      replaceIdInCollection(S.hands, oldId, newId);
      replaceIdInCollection(S.books, oldId, newId);
      replaceIdInCollection(S.wins, oldId, newId);
      if (S.discards) S.discards.forEach(d => { if (d.p === oldId) d.p = newId; });
      if (S.pending) {
        if (S.pending.discardBy === oldId) S.pending.discardBy = newId;
        S.pending.ron = (S.pending.ron || []).map(x => x === oldId ? newId : x);
        S.pending.passed = (S.pending.passed || []).map(x => x === oldId ? newId : x);
      }
      delete conns[oldId];
      conns[newId] = c;
      S.lastAction = `${player.name}が再接続しました。`;
      return true;
    }

    function countTiles(arr) {
      const counts = {};
      arr.forEach(x => counts[x] = (counts[x] || 0) + 1);
      return counts;
    }

    function canMakeWord(counts, word) {
      const need = {};
      for (const ch of word) need[ch] = (need[ch] || 0) + 1;
      return Object.entries(need).every(([ch, n]) => (counts[ch] || 0) >= n);
    }

    function removeWord(counts, word) {
      const next = { ...counts };
      for (const ch of word) next[ch]--;
      return next;
    }

    function scoreWords(words) {
      return words.reduce((n, w) => n + w.length, 0);
    }

    function betterResult(a, b) {
      if (!a) return b;
      if (!b) return a;
      const scoreA = scoreWords(a.words);
      const scoreB = scoreWords(b.words);
      if (scoreB !== scoreA) return scoreB > scoreA ? b : a;
      if (b.words.length !== a.words.length) return b.words.length > a.words.length ? b : a;
      return a.words.join('|') <= b.words.join('|') ? a : b;
    }

    function bestWordCoverFromCounts(counts, memo = new Map()) {
      const key = Object.keys(counts).sort().map(k => `${k}${counts[k]}`).join('');
      if (memo.has(key)) return memo.get(key);
      let best = { words: [] };
      const candidates = WORDS.filter(w => canMakeWord(counts, w)).sort((a, b) => b.length - a.length || a.localeCompare(b, 'ja'));
      for (const word of candidates) {
        const nextCounts = removeWord(counts, word);
        const next = bestWordCoverFromCounts(nextCounts, memo);
        const result = { words: [word, ...next.words] };
        best = betterResult(best, result);
      }
      memo.set(key, best);
      return best;
    }

    function bestWordCover(hand) {
      const result = bestWordCoverFromCounts(countTiles(hand));
      return { words: result.words.slice().sort((a, b) => b.length - a.length || a.localeCompare(b, 'ja')) };
    }

    function canCompleteHand(hand) {
      const cover = bestWordCover(hand);
      return scoreWords(cover.words) === hand.length ? cover : null;
    }

    function assignWordClasses(hand, words) {
      const idxMap = {};
      hand.forEach((ch, i) => {
        if (!idxMap[ch]) idxMap[ch] = [];
        idxMap[ch].push(i);
      });
      const classes = Array(hand.length).fill('');
      const legend = [];
      words.forEach((word, wi) => {
        const cls = WORD_COLORS[wi % WORD_COLORS.length];
        for (const ch of word) {
          const arr = idxMap[ch] || [];
          const index = arr.shift();
          if (index != null) classes[index] = cls;
        }
        legend.push({ word, cls, idx: wi % WORD_COLORS.length });
      });
      return { classes, legend };
    }

    function currentPlayer() {
      return S.players[S.current]?.id;
    }

    function finishDraw(reason = '山札が尽きたため流局です。') {
      S.started = false;
      S.drawn = false;
      S.pending = null;
      S.lastAction = reason;
      S.result = { type: 'draw', reason, sig: uid() };
    }

    function autoDrawCurrent() {
      const id = currentPlayer();
      if (!S.started || S.drawn || !id) return false;
      if (!S.wall.length) {
        finishDraw('山札が尽きたため流局です。');
        return false;
      }
      S.hands[id].push(S.wall.pop());
      S.drawn = true;
      S.lastAction = `${playerName(id)}がツモ。`;
      return true;
    }

    function advanceTurn() {
      if (!S.started) return;
      S.pending = null;
      S.current = (S.current + 1) % S.players.length;
      S.drawn = false;
      const drew = autoDrawCurrent();
      if (drew && S.started) S.lastAction = `${playerName(currentPlayer())}の手番。`;
    }

    function discardFor(id, index) {
      if (currentPlayer() !== id || !S.drawn) return false;
      const hand = S.hands[id];
      if (index < 0 || index >= hand.length) return false;
      const tile = hand.splice(index, 1)[0];
      S.discards.push({ p: id, tile });
      S.drawn = false;
      const ron = S.players.filter(p => p.id !== id).filter(p => canCompleteHand([...S.hands[p.id], tile])).map(p => p.id);
      S.pending = { discardBy: id, tile, ron, passed: [] };
      S.lastAction = `${playerName(id)}が「${tile}」を打牌。`;
      if (!ron.length) advanceTurn();
      broadcast();
      return true;
    }

    function resultModalHtml() {
      if (!S?.result) return '';
      if (S.result.type === 'draw') return `<div class="winner">流局</div><p>${escapeHtml(S.result.reason || '流局です。')}</p>`;
      if (S.result.type === 'notice') return `<div class="winner">対局終了</div><p>${escapeHtml(S.result.reason || HOST_LEFT_MESSAGE)}</p>`;
      const winWords = S.result.words || [];
      return `<div class="winner">${escapeHtml(playerName(S.result.winner))}　${escapeHtml(S.result.kind)}！</div><p>完成語：${winWords.map(escapeHtml).join(' / ')}</p><p>この部屋の勝利数：${S.result.wins || 0}</p>`;
    }

    function showModal(html) {
      $('modalBody').innerHTML = html;
      $('modal').classList.remove('hidden');
    }

    function renderSeat(player) {
      if (!player) return '<div class="small">空席</div>';
      return `<b>${escapeHtml(player.name)}</b>${player.isHost ? ' <span class="small">HOST</span>' : ''}${player.connected === false ? ' <span class="warn">切断中</span>' : ''}<br><span class="small">勝利 ${S.wins[player.id] || 0}</span>`;
    }

    function relativeSeats() {
      const players = S.players || [];
      const myIndex = Math.max(0, players.findIndex(p => p.id === myId));
      const rotate = offset => players[(myIndex + offset) % players.length];
      if (players.length === 1) return { top: null, left: null, right: null, bottom: rotate(0) };
      if (players.length === 2) return { top: rotate(1), left: null, right: null, bottom: rotate(0) };
      if (players.length === 3) return { top: rotate(1), left: rotate(2), right: null, bottom: rotate(0) };
      return { top: rotate(2), left: rotate(1), right: rotate(3), bottom: rotate(0) };
    }

    function renderHost() {
      if (!S) return;
      renderState(snapshotFor(myId));
    }

    function renderState(msg) {
      S = { ...S, ...msg.pub };
      S.hands = S.hands || {};
      S.hands[myId] = msg.hand || S.hands[myId] || [];
      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      $('codeView').textContent = roomCode;
      $('turnView').textContent = roomClosed ? '対局終了' : (S.started ? `手番：${playerName(currentPlayer())}` : '局終了');
      $('wallCount').textContent = S.wallCount ?? 0;
      $('lastAction').textContent = S.lastAction || '';

      const seats = relativeSeats();
      const seatMap = [
        ['seatTop', seats.top],
        ['seatLeft', seats.left],
        ['seatRight', seats.right],
        ['seatBottom', seats.bottom]
      ];
      seatMap.forEach(([id, player]) => {
        const el = $(id);
        el.innerHTML = renderSeat(player);
        el.className = id.includes('Top') ? 'seat seatTop' : id.includes('Left') ? 'seat seatLeft' : id.includes('Right') ? 'seat seatRight' : 'seat seatBottom';
        if (player?.id === myId) el.classList.add('me');
        if (player?.id === currentPlayer() && S.started) el.classList.add('active');
        if (player && S.pending?.ron?.includes(player.id)) el.classList.add('warn');
      });

      $('river').innerHTML = S.discards.map((d, i) => `<div class="tile discard" title="${escapeHtml(playerName(d.p))}">${escapeHtml(d.tile)}<span class="idx">${i + 1}</span></div>`).join('');

      const hand = S.hands[myId] || [];
      const cover = bestWordCover(hand);
      const assignment = assignWordClasses(hand, cover.words);
      $('hand').innerHTML = hand.map((x, i) => `<div class="tile ${assignment.classes[i]} ${selected === i ? 'selected' : ''}" draggable="true" data-i="${i}" onclick="tileClick(${i})" ondragstart="dragStart(event, ${i})" ondragover="event.preventDefault()" ondrop="dropTile(event, ${i})">${escapeHtml(x)}<span class="idx">${i + 1}</span></div>`).join('');
      $('handInfo').textContent = `${hand.length}枚　※同じ牌をもう一度クリックすると濁音・半濁音・小文字に変換`;
      $('wordLegend').innerHTML = assignment.legend.map((item, i) => `<span class="legendItem legend${item.idx}">${escapeHtml(item.word)}</span>`).join('');

      const actions = $('actions');
      actions.innerHTML = '';
      const myTurn = currentPlayer() === myId;
      const canTsumo = !!canCompleteHand(hand);
      if (S.started && myTurn && S.drawn) {
        button('選択牌を捨てる', 'discard', selected == null);
        button('ツモ！', 'tsumo', !canTsumo);
      }
      if (S.pending?.ron?.includes(myId)) {
        button('ロン！', 'ron', false);
        button('見送る', 'pass', false);
      }

      $('hint').innerHTML = roomClosed
        ? `<span class="warn">${escapeHtml(HOST_LEFT_MESSAGE)}</span>`
        : S.pending?.ron?.includes(myId)
          ? '<span class="warn">ロンできます。見送ると次の手番へ進みます。</span>'
          : S.started && myTurn && S.drawn
            ? '牌を選んで打牌してください。完成している語だけ色が付きます。'
            : S.started
              ? '相手の打牌待ちです。'
              : '局が終わりました。再戦できます。';

      $('scores').innerHTML = S.players.map(p => `${escapeHtml(p.name)}：${S.wins[p.id] || 0}勝`).join('<br>');
      $('book').innerHTML = (S.books[myId] || []).map(w => `<span class="word">${escapeHtml(w)}</span>`).join('') || '<span class="small">まだ登録なし</span>';

      const resultSig = S.result?.sig || '';
      if (resultSig && resultSig !== lastShownResultSig) {
        showModal(resultModalHtml());
        lastShownResultSig = resultSig;
      } else if (!resultSig) {
        lastShownResultSig = '';
        $('modal').classList.add('hidden');
      }
    }

    function button(label, type, disabled) {
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = disabled || roomClosed;
      if (type === 'tsumo' || type === 'ron') b.classList.add('primary');
      b.onclick = () => {
        if (type === 'discard') {
          if (selected == null) return;
          send({ type, index: selected });
          selected = null;
        } else {
          send({ type });
        }
      };
      $('actions').appendChild(b);
    }

    function tileClick(i) {
      const hand = S.hands[myId] || [];
      if (i < 0 || i >= hand.length) return;
      if (selected === i && CYCLE[hand[i]]) {
        send({ type: 'transform', index: i });
        return;
      }
      selected = i;
      renderHost();
    }

    function dragStart(e, i) {
      e.dataTransfer.setData('text/plain', String(i));
      selected = i;
    }

    function dropTile(e, to) {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData('text/plain'));
      if (Number.isInteger(from) && from !== to) {
        send({ type: 'reorder', from, to });
        selected = to;
      }
    }

    function applyAction(id, action) {
      if (!S || !S.started || !action) return;
      let ok = false;
      if (action.type === 'transform') {
        const hand = S.hands[id] || [];
        if (Number.isInteger(action.index) && action.index >= 0 && action.index < hand.length && CYCLE[hand[action.index]]) {
          hand[action.index] = CYCLE[hand[action.index]];
          ok = true;
          S.lastAction = `${playerName(id)}が牌を変換。`;
        }
      } else if (action.type === 'reorder') {
        const hand = S.hands[id] || [];
        if (Number.isInteger(action.from) && Number.isInteger(action.to) && action.from >= 0 && action.to >= 0 && action.from < hand.length && action.to < hand.length && action.from !== action.to) {
          [hand[action.from], hand[action.to]] = [hand[action.to], hand[action.from]];
          ok = true;
        }
      } else if (action.type === 'discard') {
        ok = discardFor(id, action.index);
      } else if (action.type === 'tsumo') {
        const result = canCompleteHand(S.hands[id] || []);
        if (currentPlayer() === id && S.drawn && result) {
          S.books[id] = [...new Set([...(S.books[id] || []), ...result.words])];
          S.wins[id] = (S.wins[id] || 0) + 1;
          S.lastAction = `${playerName(id)}がツモ！`;
          S.started = false;
          S.pending = null;
          S.result = { type: 'win', winner: id, kind: 'ツモ', words: result.words, wins: S.wins[id], sig: uid() };
          ok = true;
        }
      } else if (action.type === 'ron') {
        const base = [...(S.hands[id] || []), S.pending?.tile].filter(Boolean);
        const result = canCompleteHand(base);
        if (S.pending?.ron?.includes(id) && result) {
          S.books[id] = [...new Set([...(S.books[id] || []), ...result.words])];
          S.wins[id] = (S.wins[id] || 0) + 1;
          S.lastAction = `${playerName(id)}がロン！`;
          S.started = false;
          S.pending = null;
          S.result = { type: 'win', winner: id, kind: 'ロン', words: result.words, wins: S.wins[id], sig: uid() };
          ok = true;
        }
      } else if (action.type === 'pass') {
        if (S.pending?.ron?.includes(id) && !S.pending.passed.includes(id)) {
          S.pending.passed.push(id);
          if (S.pending.ron.every(x => S.pending.passed.includes(x))) advanceTurn();
          ok = true;
        }
      } else if (action.type === 'newRound') {
        if (role === 'host') { startGame(); ok = true; }
      }
      if (ok) broadcast();
      renderHost();
    }

    function hostMessage(c, m) {
      if (!S) return;
      if (m.type === 'join') {
        const joinName = (m.name || '名無し').trim().slice(0, 12);
        const token = m.token || '';
        const existing = token ? S.players.find(x => x.token === token) : null;
        if (existing && !existing.connected) {
          reconnectPlayer(existing.id, c.peer, c, joinName);
          c.send({ type: 'joined', id: c.peer, code: roomCode, reconnected: true });
          broadcast();
          return;
        }
        if (S.started) return c.send({ type: 'error', msg: '対局中です。同じ端末から同じ名前で入り直して復帰してください。' });
        if (S.players.length >= 4) return c.send({ type: 'error', msg: '満員です' });
        const p = { id: c.peer, name: joinName, connected: true, isHost: false, token: token || ('guest-' + uid()) };
        S.players.push(p);
        S.hands[p.id] = [];
        S.books[p.id] = [];
        S.wins[p.id] = 0;
        conns[p.id] = c;
        c.send({ type: 'joined', id: p.id, code: roomCode });
        broadcast();
        $('roomWait').innerHTML = `参加者 ${S.players.length}/4　<button onclick="startGame()" class="primary">対局開始</button>`;
        return;
      }
      if (m.type === 'action') applyAction(c.peer, m.action);
    }

    function send(action) {
      if (roomClosed) return;
      if (role === 'host') applyAction(myId, action);
      else if (conn?.open) conn.send({ type: 'action', action });
    }

    function handleHostDisconnected() {
      roomClosed = true;
      if (S) {
        S.started = false;
        S.drawn = false;
        S.pending = null;
        S.lastAction = HOST_LEFT_MESSAGE;
        S.result = { type: 'notice', reason: HOST_LEFT_MESSAGE, sig: uid() };
        renderHost();
      }
      showModal(`<div class="winner">対局終了</div><p>${escapeHtml(HOST_LEFT_MESSAGE)}</p>`);
    }

    $('modalClose').onclick = () => $('modal').classList.add('hidden');
    $('newRound').onclick = () => {
      if (roomClosed) return;
      if (role === 'host') startGame();
      else send({ type: 'newRound' });
    };
    $('leave').onclick = () => location.reload();

    const savedSession = readStoredSession();
    if (savedSession.name) $('name').value = savedSession.name;
    if (savedSession.roomCode) $('room').value = savedSession.roomCode;
    playerToken = ensurePlayerToken();

    $('create').onclick = () => {
      playerToken = ensurePlayerToken();
      roomClosed = false;
      roomCode = Math.random().toString(36).slice(2, 7).toUpperCase();
      role = 'host';
      rememberSession();
      $('lobbyStatus').textContent = '部屋を作成中…';
      initPeer(hostPeerId(roomCode), () => {
        S = emptyState();
        S.hostId = myId;
        S.players = [{ id: myId, name: playerNameInput(), connected: true, isHost: true, token: playerToken }];
        S.hands[myId] = [];
        S.books[myId] = [];
        S.wins[myId] = 0;
        rememberSession({ host: true });
        $('lobbyStatus').innerHTML = '部屋コード';
        $('roomWait').classList.remove('hidden');
        $('roomWait').innerHTML = `<div class="roomcode">${roomCode}</div>参加者 1/4　友達にこのコードを渡して参加してもらってください。<br><button class="primary" onclick="startGame()">対局開始</button>`;
      });
    };

    $('join').onclick = () => {
      playerToken = ensurePlayerToken();
      roomClosed = false;
      roomCode = ($('room').value || '').trim().toUpperCase();
      if (!roomCode) return;
      role = 'guest';
      rememberSession({ host: false });
      $('lobbyStatus').textContent = '参加中…';
      initPeer('guest-' + uid(), () => {
        conn = peer.connect(hostPeerId(roomCode), { reliable: true });
        conn.on('open', () => conn.send({ type: 'join', name: playerNameInput(), token: playerToken }));
        conn.on('data', m => {
          if (m.type === 'joined') {
            myId = m.id;
            rememberSession({ host: false });
            $('lobbyStatus').textContent = m.reconnected ? '再接続しました。対局に復帰します。' : '参加しました。ホストの開始を待っています。';
          } else if (m.type === 'state') {
            roomClosed = false;
            renderState(m);
            log(S.lastAction || '');
          } else if (m.type === 'error') {
            $('lobbyStatus').textContent = m.msg;
          }
        });
        conn.on('close', () => handleHostDisconnected());
      });
    };

    function startGame() {
      roomClosed = false;
      S.started = true;
      S.wall = makeWall();
      S.current = 0;
      S.drawn = false;
      S.discards = [];
      S.pending = null;
      S.result = null;
      lastShownResultSig = '';
      S.players.forEach(p => {
        p.connected = true;
        S.hands[p.id] = S.wall.splice(0, 13);
        if (!S.books[p.id]) S.books[p.id] = [];
        if (S.wins[p.id] == null) S.wins[p.id] = 0;
      });
      S.lastAction = '対局開始。各自13枚からスタート。';
      autoDrawCurrent();
      broadcast();
      renderHost();
    }
  </script>
</body>
</html>
