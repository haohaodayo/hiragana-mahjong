<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#07110b;color:#f7f3df;
  font-family:system-ui,"Yu Gothic",Meiryo,sans-serif
}
button{
  border:1px solid #806d37;background:#243b2b;color:#fff;
  padding:9px 14px;border-radius:9px;cursor:pointer
}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.35;cursor:not-allowed}
.primary{background:#876b20}
header{
  padding:18px 24px;border-bottom:1px solid #304735;
  display:flex;justify-content:space-between;align-items:center
}
h1{margin:0;color:#e7ca70}
#setup,#game{max-width:1200px;margin:20px auto;padding:20px}
.panel{
  background:#102017;border:1px solid #36513e;
  border-radius:16px;padding:18px
}
.setup{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px
}
label{display:block;color:#aeb9ad;font-size:13px;margin-bottom:5px}
input,select{
  width:100%;padding:10px;background:#07110b;
  border:1px solid #3c5945;color:white;border-radius:8px
}
.layout{display:grid;grid-template-columns:1fr 300px;gap:15px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.river{
  min-height:220px;background:#07110b;border:1px dashed #49604e;
  border-radius:14px;padding:12px
}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{
  width:45px;height:57px;border-radius:8px;
  background:linear-gradient(#fffef0,#d8d2b5);
  color:#15150e;border:1px solid #999477;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:bold;cursor:pointer;
  user-select:none;box-shadow:0 3px 0 #77745c
}
.tile.selected{outline:3px solid #e6c76a;transform:translateY(-4px)}
.tile.hint{box-shadow:0 0 0 3px #65c48b,0 0 18px #65c48b}
.discard{width:37px;height:44px;font-size:21px}
.hand{min-height:75px;padding:12px 0}
.info{
  display:flex;gap:10px;flex-wrap:wrap;
  margin:12px 0
}
.badge{
  padding:7px 10px;border:1px solid #36513e;
  border-radius:9px;background:#09160e
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meld{
  display:inline-block;padding:8px 11px;margin:4px;
  background:#292514;border:1px solid #8a7434;border-radius:9px
}
.side section{margin-bottom:20px}
.side h3{color:#e6c76a;font-size:15px}
.player{
  padding:9px;margin:6px 0;background:#0a1710;
  border:1px solid #304735;border-radius:9px
}
.player.active{border-color:#e6c76a}
.log{
  max-height:220px;overflow:auto;font-size:12px;
  color:#bdc7bc
}
.word{
  display:inline-block;padding:4px 8px;margin:3px;
  border:1px solid #36513e;border-radius:20px;background:#172a1e;
  font-size:12px
}
#overlay{
  display:none;position:fixed;inset:0;background:#000c;
  align-items:center;justify-content:center;z-index:10
}
.modal{
  width:min(650px,90%);background:#112219;
  border:1px solid #a68a42;border-radius:20px;
  padding:30px;text-align:center
}
.win{
  font-size:58px;color:#e8cc70;font-weight:900
}
.result{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px}
.result span{
  padding:10px 15px;background:#2a2515;
  border:1px solid #8d7839;border-radius:9px;font-size:20px
}
</style>
</head>

<body>

<header>
  <h1>🀄 ひらがな麻雀</h1>
  <span>試作版｜2〜4人</span>
</header>

<section id="setup" class="panel">
  <h2>対局設定</h2>

  <div class="setup">
    <div>
      <label>人数</label>
      <select id="playerCount">
        <option value="2">2人（試作）</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
      </select>
    </div>

    <div><label>プレイヤー1</label><input id="name1" value="プレイヤー1"></div>
    <div><label>プレイヤー2</label><input id="name2" value="プレイヤー2"></div>
    <div id="name3box"><label>プレイヤー3</label><input id="name3" value="プレイヤー3"></div>
    <div id="name4box"><label>プレイヤー4</label><input id="name4" value="プレイヤー4"></div>
  </div>

  <p>
    3文字の単語×4 ＋ 2文字の単語×1を完成させて和了する、
    ひらがな版の麻雀ゲーム試作です。
  </p>

  <button id="start" class="primary">対局開始</button>
</section>

<section id="game" style="display:none">

<div class="layout">

<main class="panel">

  <div style="display:flex;justify-content:space-between">
    <b>手番：<span id="turn"></span></b>
    <span>山：<b id="deckCount"></b>枚</span>
  </div>

  <div class="river">
    <div style="margin-bottom:10px">🀄 捨て牌</div>
    <div id="river" class="tiles"></div>
  </div>

  <div id="melds"></div>

  <div class="info">
    <div class="badge">3文字：<b id="three"></b> / 4</div>
    <div class="badge">2文字：<b id="two"></b> / 1</div>
    <div class="badge">あと：<b id="remain"></b></div>
  </div>

  <div class="panel" style="padding:10px">
    <b>🎯 待ち</b>
    <span style="color:#9eaa9f">（自分だけ表示）</span>
    <div id="waits" class="tiles" style="margin-top:8px"></div>
  </div>

  <h3>自分の手牌</h3>
  <div id="hand" class="tiles hand"></div>

  <div class="actions">
    <button id="draw" class="primary">ツモる</button>
    <button id="discard">選択牌を捨てる</button>
    <button id="chi">チー</button>
    <button id="ron">ロン！</button>
    <button id="tsumo">ツモ！</button>
  </div>

  <p id="help"></p>

</main>

<aside class="panel side">

<section>
<h3>👥 プレイヤー</h3>
<div id="players"></div>
</section>

<section>
<h3>📖 今回の単語</h3>
<div id="roundWords"></div>
</section>

<section>
<h3>📚 通算図鑑</h3>
<div id="book"></div>
</section>

<section>
<h3>📜 ログ</h3>
<div id="log" class="log"></div>
</section>

</aside>

</div>
</section>

<div id="overlay">
<div class="modal">
  <div class="win" id="winType"></div>
  <h2 id="winner"></h2>
  <div class="result" id="result"></div>
  <button id="rematch" class="primary">同じ部屋で再戦</button>
</div>
</div>

<script>

/* =========================================================
   ひらがな麻雀 試作版
   ========================================================= */

/*
  現段階ではゲーム判定用の登録語彙を使用。
  正式版ではこの部分を検証済み語彙データに分離する。
*/

const WORDS = new Set(`
あい あお あき あさ あし あじ あす あせ あと
あな あめ あゆ いえ いか いき いけ いし いす
いぬ いま いろ うえ うし うそ うた うみ えき
えさ おい おか おき おと おに おや
かお かき かぎ かさ かぜ かた かに かね かみ
かめ から きく きの きみ きり くさ くち くつ
くに くま くも けし こえ こめ ころ
さけ さき さく さと さば さめ さら
しお しか しき しし した しも すい すし
すな せき せみ そら
たい たこ たね たに たま ちえ ちず
ちち つき つく つち つの てら とき
とけ とり なつ なみ にく にし にわ
ぬの ねこ のり はこ はし はな はね はる
ひと ひる ふね へや ほし ほん
まえ まめ まる みず みせ みち みみ
むし むね めし もり やま ゆき よる
らく りす りん れき れん わに わら

あさひ あかり あきら あなた あゆみ
いかだ いかり いきもの いちご いなか いのち
うさぎ うしろ うみべ えがお
おかし おしろ おすし おとこ おんな
かがみ かたち かなた からす かわら
きつね きのこ きもの
くじら くすり くもり けむり
こいぬ こいびと こおり こたえ ことば こども
さかな さくら さとう
しずく しごと すいか すずめ せかい
たぬき たまご ちから つばさ つぼみ
てがみ てまり とかげ とまと ともだち
ながれ なつやすみ にじいろ にんじん
ねずみ のはら はさみ はたけ はなび
ひかり ひつじ ふくろ ほたる
まくら まつり みかん みずうみ
むかし めがね もみじ
やさい やかた ゆめ ゆめみ
よる りんご わたし わたげ
`.trim().split(/\s+/));

const KANA = [
..."あいうえおかきくけこさしすせそたちつてと",
..."なにぬねのはひふへほまみむめもやゆよ",
..."らりるれろわをん"
];

const EXTRA = [..."がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっ"];

const TILE_TYPES = [...new Set([...KANA,...EXTRA])];

/* ---------- 状態 ---------- */

let players=[];
let hands=[];
let melds=[];
let wins=[];
let stats=[];
let books=[];
let deck=[];
let river=[];
let turn=0;
let selected=-1;
let gameOver=false;
let pendingRon=null;
let pendingChi=null;

/* ---------- 共通 ---------- */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function log(text){
  const e=document.createElement("div");
  e.textContent=text;
  document.getElementById("log").prepend(e);
}

function countChars(str){
  const m={};
  for(const c of str)m[c]=(m[c]||0)+1;
  return m;
}

function isWord(str){
  return WORDS.has(str);
}

function combinations(arr,n){
  const result=[];
  function rec(start,picked){
    if(picked.length===n){
      result.push([...picked]);
      return;
    }
    for(let i=start;i<=arr.length-(n-picked.length);i++){
      picked.push(i);
      rec(i+1,picked);
      picked.pop();
    }
  }
  rec(0,[]);
  return result;
}

function possibleWords(tiles,length){
  const result=[];
  for(const ids of combinations(tiles,length)){
    const word=ids.map(i=>tiles[i]).join("");
    if(isWord(word)){
      result.push({word,ids});
    }
  }
  return result;
}

/* ---------- 和了判定 ---------- */

function solve14(tiles){

  if(tiles.length!==14)return null;

  const pairs=possibleWords(tiles,2);

  for(const pair of pairs){

    const remain1=tiles.filter((_,i)=>!pair.ids.includes(i));

    const words1=possibleWords(remain1,3);

    for(const a of words1){

      const remain2=remain1.filter((_,i)=>!a.ids.includes(i));

      const words2=possibleWords(remain2,3);

      for(const b of words2){

        const remain3=remain2.filter((_,i)=>!b.ids.includes(i));

        const words3=possibleWords(remain3,3);

        for(const c of words3){

          const remain4=remain3.filter((_,i)=>!c.ids.includes(i));

          const words4=possibleWords(remain4,3);

          if(words4.length){

            return {
              pair:pair.word,
              words:[a.word,b.word,c.word,words4[0].word]
            };

          }
        }
      }
    }
  }

  return null;
}

function completedThree(tiles){
  return [...new Set(possibleWords(tiles,3).map(x=>x.word))];
}

function waitsFor(tiles){

  if(tiles.length!==13)return [];

  const result=[];

  for(const c of TILE_TYPES){

    if(solve14([...tiles,c])){
      result.push(c);
    }
  }

  return result;
}

/* ---------- 山 ---------- */

function makeDeck(){

  const d=[];

  for(const c of TILE_TYPES){
    for(let i=0;i<4;i++){
      d.push(c);
    }
  }

  return shuffle(d);
}

/* ---------- 開始 ---------- */

document.getElementById("playerCount").onchange=function(){

  const n=Number(this.value);

  document.getElementById("name3box").style.display=n>=3?"block":"none";
  document.getElementById("name4box").style.display=n>=4?"block":"none";

};

document.getElementById("start").onclick=startGame;

function startGame(){

  const n=Number(document.getElementById("playerCount").value);

  players=[];

  for(let i=1;i<=n;i++){

    players.push({
      name:document.getElementById("name"+i).value.trim()||"プレイヤー"+i
    });

  }

  wins=Array(n).fill(0);

  stats=Array.from({length:n},()=>({
    ron:0,
    tsumo:0,
    chi:0
  }));

  books=Array.from({length:n},()=>new Set());

  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="block";

  newRound();

}

/* ---------- 新しい局 ---------- */

function newRound(){

  deck=makeDeck();
  river=[];
  melds=Array.from({length:players.length},()=>[]);
  hands=Array.from({length:players.length},()=>[]);
  turn=0;
  selected=-1;
  gameOver=false;
  pendingRon=null;
  pendingChi=null;

  for(let r=0;r<13;r++){

    for(let p=0;p<players.length;p++){

      hands[p].push(deck.pop());

    }

  }

  document.getElementById("overlay").style.display="none";
  document.getElementById("log").innerHTML="";

  log("対局開始！");
  render();

}

/* ---------- ツモ ---------- */

document.getElementById("draw").onclick=function(){

  if(gameOver)return;

  if(turn!==0){
    log("今は相手の手番です。");
    return;
  }

  if(hands[0].length>=14){
    log("すでに14枚あります。先に牌を捨ててください。");
    return;
  }

  if(deck.length===0){
    log("山がなくなりました。");
    return;
  }

  hands[0].push(deck.pop());

  const result=solve14(hands[0]);

  render();

  if(result){
    showWin(0,result,"ツモ");
  }

};

/* ---------- 捨てる ---------- */

document.getElementById("discard").onclick=function(){

  if(gameOver||turn!==0)return;

  if(hands[0].length!==14){
    log("14枚になるまでツモってください。");
    return;
  }

  if(selected<0){
    log("捨てる牌を選んでください。");
    return;
  }

  const c=hands[0].splice(selected,1)[0];

  selected=-1;

  river.push({
    player:0,
    char:c
  });

  log(players[0].name+"："+c+"を捨てた");

  checkDiscard(c,0);

};

/* ---------- ロン ---------- */

document.getElementById("ron").onclick=function(){

  if(!pendingRon)return;

  const data=pendingRon;

  pendingRon=null;

  stats[0].ron++;

  showWin(0,data.result,"ロン");

};

/* ---------- ツモ ---------- */

document.getElementById("tsumo").onclick=function(){

  const result=solve14(hands[0]);

  if(result){

    stats[0].tsumo++;

    showWin(0,result,"ツモ");

  }

};

/* ---------- チー ---------- */

document.getElementById("chi").onclick=function(){

  if(!pendingChi)return;

  const data=pendingChi;

  if(!data.choices.length)return;

  const choice=data.choices[0];

  const ownIndexes=choice.ids.filter(i=>i<hands[0].length);

  hands[0]=hands[0].filter((_,i)=>!ownIndexes.includes(i));

  melds[0].push(choice.word);

  stats[0].chi++;

  books[0].add(choice.word);

  pendingChi=null;

  log("チー！「"+choice.word+"」");

  if(deck.length)hands[0].push(deck.pop());

  render();

};

/* ---------- 捨て牌処理 ---------- */

function checkDiscard(char,discarder){

  pendingRon=null;
  pendingChi=null;

  /* 人間のロン */

  const candidate=[...hands[0],char];

  if(discarder!==0){

    const result=solve14(candidate);

    if(result){

      pendingRon={
        result:result,
        char:char
      };

      render();

      log("🔥 "+char+"でロンできます！");
      return;

    }

  }

  /* 人間のチー */

  if(discarder!==0){

    const all=[...hands[0],char];

    const choices=possibleWords(all,3).filter(x=>{
      return x.ids.includes(hands[0].length);
    });

    if(choices.length){

      pendingChi={
        char:char,
        choices:choices
      };

      log("🀄 チー候補："+choices.map(x=>x.word).join(" / "));

      render();

      return;

    }

  }

  nextTurn();

}

/* ---------- 次の手番 ---------- */

function nextTurn(){

  if(gameOver)return;

  turn=(turn+1)%players.length;

  render();

  if(turn!==0){

    setTimeout(aiTurn,600);

  }

}

/* ---------- AI ---------- */

function aiTurn(){

  if(gameOver)return;

  const p=turn;

  if(deck.length===0)return;

  hands[p].push(deck.pop());

  const result=solve14(hands[p]);

  if(result){

    showWin(p,result,"ツモ");
    return;

  }

  /*
    試作AI：
    完成単語数が少なくなる牌を優先して捨てる。
  */

  let bestIndex=0;
  let bestScore=999;

  for(let i=0;i<hands[p].length;i++){

    const test=hands[p].filter((_,j)=>j!==i);
    const score=completedThree(test).length;

    if(score<bestScore){

      bestScore=score;
      bestIndex=i;

    }

  }

  const c=hands[p].splice(bestIndex,1)[0];

  river.push({
    player:p,
    char:c
  });

  log(players[p].name+"："+c+"を捨てた");

  /* 人間ロン */

  const humanResult=solve14([...hands[0],c]);

  if(humanResult){

    pendingRon={
      result:humanResult,
      char:c
    };

    render();

    log("🔥 "+c+"でロンできます！");
    return;

  }

  nextTurn();

}

/* ---------- 和了 ---------- */

function showWin(player,result,type){

  gameOver=true;

  wins[player]++;

  const words=[
    ...result.words,
    result.pair
  ];

  words.forEach(w=>{
    books[player].add(w);
  });

  document.getElementById("winType").textContent=type+"！";

  document.getElementById("winner").textContent=
    players[player].name+" の和了！";

  document.getElementById("result").innerHTML=
    words.map(w=>"<span>"+w+"</span>").join("");

  document.getElementById("overlay").style.display="flex";

  render();

}

document.getElementById("rematch").onclick=newRound;

/* ---------- ドラッグ並び替え ---------- */

let dragIndex=null;

/* ---------- 描画 ---------- */

function render(){

  document.getElementById("turn").textContent=
    players[turn]?.name||"";

  document.getElementById("deckCount").textContent=
    deck.length;

  /* 捨て牌 */

  document.getElementById("river").innerHTML=
    river.map(x=>
      `<div class="tile discard" title="${players[x.player].name}">
        ${x.char}
      </div>`
    ).join("");

  /* 手牌 */

  const hand=document.getElementById("hand");

  hand.innerHTML="";

  hands[0].forEach((c,i)=>{

    const tile=document.createElement("div");

    tile.className="tile";

    tile.textContent=c;

    if(i===selected)
      tile.classList.add("selected");

    /*
      完成可能な3文字単語に含まれている牌を
      自分だけ軽くハイライト。
    */

    const complete=completedThree(hands[0]);

    if(complete.some(w=>w.includes(c)))
      tile.classList.add("hint");

    tile.draggable=true;

    tile.onclick=()=>{
      selected=i;
      render();
    };

    tile.ondragstart=()=>{
      dragIndex=i;
    };

    tile.ondragover=e=>e.preventDefault();

    tile.ondrop=()=>{

      if(dragIndex===null)return;

      const x=hands[0].splice(dragIndex,1)[0];

      hands[0].splice(i,0,x);

      dragIndex=null;
      selected=-1;

      render();

    };

    hand.appendChild(tile);

  });

  /* 鳴き */

  document.getElementById("melds").innerHTML=
    melds[0].map(w=>
      `<span class="meld">🀄 チー「<b>${w}</b>」</span>`
    ).join("");

  /* 進捗 */

  const three=completedThree(hands[0]);

  document.getElementById("three").textContent=
    Math.min(three.length,4);

  const pair=possibleWords(hands[0],2);

  document.getElementById("two").textContent=
    pair.length?1:0;

  const remain=
    Math.max(
      0,
      5-Math.min(three.length,4)-(pair.length?1:0)
    );

  document.getElementById("remain").textContent=remain+"個";

  /* 待ち */

  const waits=waitsFor(hands[0]);

  document.getElementById("waits").innerHTML=
    waits.length
      ?waits.map(c=>`<span class="word">${c} が必要</span>`).join("")
      :'<span style="color:#879389">現在テンパイしていません</span>';

  /* ボタン */

  document.getElementById("draw").disabled=
    gameOver||turn!==0||hands[0].length>=14;

  document.getElementById("discard").disabled=
    gameOver||turn!==0||hands[0].length!==14;

  document.getElementById("ron").disabled=
    !pendingRon;

  document.getElementById("chi").disabled=
    !pendingChi;

  document.getElementById("tsumo").disabled=
    !solve14(hands[0]);

  /* プレイヤー */

  document.getElementById("players").innerHTML=
    players.map((p,i)=>`

      <div class="player ${i===turn?"active":""}">

        <b>${p.name}</b>

        <div style="font-size:12px;color:#9eaa9f">
          勝利：${wins[i]}
          ／ ロン：${stats[i].ron}
          ／ ツモ：${stats[i].tsumo}
          ／ チー：${stats[i].chi}
        </div>

        <div style="font-size:12px;color:#9eaa9f">
          鳴き：
          ${melds[i].join("・")||"なし"}
        </div>

      </div>

    `).join("");

  /* 図鑑 */

  document.getElementById("book").innerHTML=
    [...books[0]].sort().map(w=>
      `<span class="word">${w}</span>`
    ).join("")
    ||'<span style="color:#879389">まだありません</span>';

  /* 今回の単語 */

  document.getElementById("roundWords").innerHTML=
    [...books[0]].slice(-20).map(w=>
      `<span class="word">${w}</span>`
    ).join("");

  document.getElementById("help").textContent=
    gameOver
      ?"対局終了"
      :turn===0
        ?"あなたの番：ツモ → 必要なら和了 → 牌を選んで捨てる"
        :"相手の番：AIが自動で進行中";

}

</script>

</body>
</html>
