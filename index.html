<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f1e8;color:#222}
.wrap{max-width:1000px;margin:auto;padding:20px}
h1{margin:0 0 8px;font-size:32px}
.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,button,select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #bbb}
button{cursor:pointer;background:#222;color:white;border:0}
button:disabled{opacity:.4;cursor:not-allowed}
button.sub{background:#777}
button.good{background:#167c45}
#status{font-weight:700}
#players{display:flex;gap:8px;flex-wrap:wrap}
.player{padding:8px 12px;border-radius:10px;background:#eee}
.player.me{outline:2px solid #222}
.player.turn{background:#dff4e7}
#hand{display:flex;gap:7px;flex-wrap:wrap;min-height:74px;padding:10px;background:#eee;border-radius:14px}
.tile{width:48px;height:58px;background:#fff;border:2px solid #aaa;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700;cursor:grab;user-select:none}
.tile.selected{border-color:#167c45;background:#e9fff2}
#discard{display:flex;gap:7px;flex-wrap:wrap}
.discardTile{width:42px;height:50px;background:#fff;border:1px solid #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:23px}
.log{max-height:180px;overflow:auto;background:#fafafa;padding:10px;border-radius:10px;font-size:14px}
.small{font-size:13px;color:#666}
.hidden{display:none}
#roomCode{font-size:28px;font-weight:800;letter-spacing:5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ひらがな麻雀</h1>
  <div class="card" id="setup">
    <h2>部屋を作る / 入る</h2>
    <div class="row">
      <input id="name" placeholder="名前" maxlength="12">
      <select id="playerCount">
        <option value="4">4人</option>
        <option value="3">3人</option>
      </select>
      <button id="create">新しい部屋を作る</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="joinCode" placeholder="6文字の部屋コード" maxlength="6">
      <button id="join">部屋に入る</button>
    </div>
    <p class="small">※ 13枚スタート → ツモって14枚 → 14枚で上がり。チーは3文字の登録語が作れる場合だけ使えます。</p>
  </div>

  <div class="card hidden" id="game">
    <div class="row">
      <div>部屋コード：<span id="roomCode">------</span></div>
      <div id="status"></div>
    </div>
    <div id="players" style="margin-top:12px"></div>
  </div>

  <div class="card hidden" id="table">
    <h3>場</h3>
    <div id="discard"></div>
    <div class="small" id="lastDiscard"></div>
  </div>

  <div class="card hidden" id="mine">
    <h3>自分の手牌 <span class="small">（ドラッグして自由に並べ替え）</span></h3>
    <div id="hand"></div>
    <div class="row" style="margin-top:12px">
      <button id="draw">ツモる</button>
      <button id="win" class="good">14枚で上がる</button>
      <button id="chi" class="good">チー</button>
      <button id="discardBtn">選択した牌を捨てる</button>
    </div>
    <p class="small">チー：直前の捨て牌＋手牌2枚で、3文字の登録語を作れるときだけ使用できます。</p>
  </div>

  <div class="card hidden" id="info">
    <h3>ログ</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================
   ひらがな麻雀
   ルール
   - 3/4人
   - 13枚スタート
   - 自分の番にツモって14枚
   - 14枚で「上がり」
   - チーのみ
   - チーは3文字の登録語になる場合だけ
   - 手牌はドラッグで自由に並べ替え
   ========================= */

const WORDS = new Set([
  // 一般語（3ひらがな）
  "あいさつ","あおぞら","あかり","あさひ","あたま","あつさ","あにき","あめだま",
  "いきもの","いなか","いのち","いぬ","いろ","うさぎ","うみ","うわさ",
  "えがお","えほん","おかし","おかね","おとな","おもい","おもて",
  "かおり","かがみ","かぜ","かぞく","かたち","かなり","かばん","からだ",
  "きもち","きもの","きんぎょ","くうき","くもり","こころ","ことば","こども",
  "さかな","さくら","さむらい","しごと","しずく","しずか","しるし","すずめ",
  "せかい","せんせい","そら","たいこ","たいせつ","たから","たまご","ちから",
  "つき","つくえ","てがみ","でんき","ともだち","なかま","なみだ","にじ",
  "ねこ","のど","はな","ひかり","ひみつ","ふゆ","ほし","まつり",
  "みかた","みず","みらい","むかし","めがね","もり","やさしさ","ゆめ",
  "よる","らくご","りゆう","るす","れきし","わらい",
  // ネット・ミーム系
  "おつ","きた","それ","なう","草","ｗｗｗ","神","沼","無理","優勝",
  "限界","天才","古参","新参","案件","解釈","情緒","尊い","爆笑","悲報",
  "朗報","炎上","虚無","布教","供給","需要","反応","実況",
  // 言ノ国系の短い語
  "ことの","ひょう","さむらい","はしら","せいと","こうしゃ","ひょうか",
  "かいい","しょうたい","じゅみょう","しょうたい","おりて","せんせい",
  "せんぱい","ともだち","ねおち","いいこえ","こえまね","おおぎり"
]);

// チー判定では「3文字ひらがな」のみを有効語にする。
// 4文字以上・漢字・記号はチー対象外。
function is3KanaWord(w){
  return /^[ぁ-ゖー]{3}$/.test(w) && WORDS.has(w);
}

const kana = [..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
let peer=null, conn=null, host=false, roomId="";
let state=null, myId="", myName="";

const $=id=>document.getElementById(id);
function log(t){
  const d=document.createElement("div"); d.textContent=t;
  $("log").prepend(d);
}
function randomCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}
function shuffled(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  return b;
}
function makeTiles(){
  // ひらがな牌を十分な枚数用意
  const arr=[];
  for(const k of kana) for(let i=0;i<4;i++) arr.push(k);
  return shuffled(arr);
}
function newState(count){
  const deck=makeTiles();
  const players=[];
  for(let i=0;i<count;i++){
    players.push({id:null,name:"",hand:deck.splice(0,13),ready:false});
  }
  return {maxPlayers:count,players,deck,turn:0,phase:"draw",discard:[],lastDiscard:null,started:false,winner:null};
}
function broadcast(){
  if(host && conn) conn.send({type:"state",state});
}
function render(){
  if(!state)return;
  $("game").classList.remove("hidden");
  $("table").classList.remove("hidden");
  $("mine").classList.remove("hidden");
  $("info").classList.remove("hidden");
  $("roomCode").textContent=roomId;
  $("players").innerHTML="";
  state.players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="player"+(p.id===myId?" me":"")+(state.turn===i?" turn":"");
    d.textContent=(i+1)+". "+(p.name||"待機中")+(state.turn===i?" ← 手番":"");
    $("players").appendChild(d);
  });
  $("status").textContent=state.winner?`🎉 ${state.winner} の上がり！`:state.started?`${state.players[state.turn]?.name||""} の番`:"参加者待ち…";
  $("discard").innerHTML="";
  state.discard.slice(-20).forEach(x=>{
    const d=document.createElement("div");d.className="discardTile";d.textContent=x.tile;$("discard").appendChild(d);
  });
  $("lastDiscard").textContent=state.lastDiscard?`${state.lastDiscard.name} が「${state.lastDiscard.tile}」を捨てました`:"";
  const me=state.players.find(p=>p.id===myId);
  $("hand").innerHTML="";
  if(me){
    me.hand.forEach((t,i)=>{
      const d=document.createElement("div");
      d.className="tile";
      d.textContent=t;
      d.draggable=true;
      d.dataset.i=i;
      d.onclick=()=>d.classList.toggle("selected");
      d.ondragstart=e=>e.dataTransfer.setData("text/plain",i);
      d.ondragover=e=>e.preventDefault();
      d.ondrop=e=>{
        e.preventDefault();
        const from=Number(e.dataTransfer.getData("text/plain"));
        const to=Number(d.dataset.i);
        const h=[...me.hand]; const [x]=h.splice(from,1); h.splice(to,0,x);
        me.hand=h; sendStateAction({type:"reorder",hand:h});
      };
      $("hand").appendChild(d);
    });
  }
  const myTurn=state.started && !state.winner && state.players[state.turn]?.id===myId;
  $("draw").disabled=!myTurn || state.phase!=="draw";
  $("win").disabled=!myTurn || state.phase!=="wincheck" || !me || me.hand.length!==14;
  $("discardBtn").disabled=!myTurn || state.phase!=="discard";
  $("chi").disabled=!canChi();
}
function sendStateAction(action){
  if(host) applyAction(myId,action);
  else if(conn) conn.send({type:"action",action});
}
function applyAction(id,a){
  if(!host)return;
  const pi=state.players.findIndex(p=>p.id===id);
  if(pi<0)return;
  const p=state.players[pi];
  if(a.type==="reorder" && p.hand.length===a.hand.length){
    p.hand=a.hand; broadcast(); render(); return;
  }
  if(!state.started || state.winner || state.turn!==pi)return;

  if(a.type==="draw" && state.phase==="draw"){
    if(!state.deck.length){state.deck=makeTiles()}
    p.hand.push(state.deck.pop());
    state.phase="wincheck";
    broadcast();render();return;
  }
  if(a.type==="win" && state.phase==="wincheck" && p.hand.length===14){
    state.winner=p.name;
    broadcast();render();log(`🎉 ${p.name} が14枚で上がりました！`);return;
  }
  if(a.type==="discard" && state.phase==="discard"){
    const idx=a.index;
    if(idx<0||idx>=p.hand.length)return;
    const tile=p.hand.splice(idx,1)[0];
    state.discard.push({tile,name:p.name});
    state.lastDiscard={tile,name:p.name,index:pi};
    state.turn=(pi+1)%state.maxPlayers;
    state.phase="draw";
    broadcast();render();return;
  }
  if(a.type==="chi"){
    const result=findChi(p.hand,state.lastDiscard?.tile);
    if(!result)return;
    p.hand=result.remaining;
    p.hand.push(...result.used); // チーした3枚は手牌として保持
    state.discard.push({tile:state.lastDiscard.tile,name:p.name+"（チー）"});
    state.lastDiscard=null;
    state.turn=pi;
    state.phase="discard";
    broadcast();render();
    log(`${p.name} が「${result.word}」でチー！`);
  }
}
function findChi(hand,discard){
  if(!discard)return null;
  for(let i=0;i<hand.length;i++){
    for(let j=i+1;j<hand.length;j++){
      const pair=[hand[i],hand[j],discard];
      for(const w of permutations(pair)){
        if(is3KanaWord(w)) return {word:w,used:[hand[i],hand[j],discard],remaining:hand.filter((_,k)=>k!==i&&k!==j)};
      }
    }
  }
  return null;
}
function permutations(a){
  return [
    a.join(""),
    [a[0],a[2],a[1]].join(""),
    [a[1],a[0],a[2]].join(""),
    [a[1],a[2],a[0]].join(""),
    [a[2],a[0],a[1]].join(""),
    [a[2],a[1],a[0]].join("")
  ];
}
function canChi(){
  if(!state||!state.started||state.winner||!state.lastDiscard)return true===false;
  const me=state.players.find(p=>p.id===myId);
  if(!me)return true===false;
  const next=(state.lastDiscard.index+1)%state.maxPlayers;
  return state.turn===next && !!findChi(me.hand,state.lastDiscard.tile);
}

$("create").onclick=()=>{
  myName=$("name").value.trim()||"プレイヤー1";
  const count=Number($("playerCount").value);
  roomId=randomCode(); host=true;
  peer=new Peer(roomId);
  peer.on("open",()=>{
    myId=roomId+"-host";
    state=newState(count);
    state.players[0].id=myId; state.players[0].name=myName;
    state.started=true;
    log(`部屋 ${roomId} を作成しました。`);
    render();
  });
  peer.on("connection",c=>setupConnection(c));
  peer.on("error",e=>alert("通信エラー："+e.message));
};
$("join").onclick=()=>{
  myName=$("name").value.trim()||"プレイヤー";
  roomId=$("joinCode").value.trim().toUpperCase();
  if(roomId.length!==6){alert("6文字の部屋コードを入れてください");return}
  peer=new Peer();
  peer.on("open",id=>{
    myId=id;
    conn=peer.connect(roomId,{reliable:true});
    conn.on("open",()=>conn.send({type:"join",name:myName,id}));
    conn.on("data",onData);
  });
  peer.on("error",e=>alert("通信エラー："+e.message));
};
function setupConnection(c){
  c.on("data",msg=>{
    if(msg.type==="join"){
      const empty=state.players.findIndex(p=>!p.id);
      if(empty<0){c.send({type:"full"});return}
      state.players[empty].id=msg.id;
      state.players[empty].name=msg.name;
      c.send({type:"state",state});
      broadcast();render();
      log(`${msg.name} が参加しました。`);
    }else if(msg.type==="action"){
      applyAction(msg.id,msg.action);
    }
  });
}
function onData(msg){
  if(msg.type==="state"){
    state=msg.state;
    const me=state.players.find(p=>p.id===myId);
    if(me) myName=me.name;
    render();
  }
  if(msg.type==="full")alert("この部屋は満員です。");
}
$("draw").onclick=()=>sendStateAction({type:"draw"});
$("win").onclick=()=>sendStateAction({type:"win"});
$("discardBtn").onclick=()=>{
  const els=[...$("hand").children];
  const idx=els.findIndex(e=>e.classList.contains("selected"));
  if(idx<0){alert("捨てる牌を1枚選んでください");return}
  const me=state.players.find(p=>p.id===myId);
  if(!me)return;
  // DOM順＝現在の手牌順
  sendStateAction({type:"discard",index:idx});
};
$("chi").onclick=()=>sendStateAction({type:"chi"});
</script>
</body>
</html>
