function snapshotFor(id){return {type:'state',pub:publicSnap(),hand:S.hands[id]||[],me:id}}
function startGame(){S.started=true;S.wall=makeWall();S.current=0;S.drawn=false;S.discards=[];S.melds={};S.pending=null;S.players.forEach(p=>{S.hands[p.id]=S.wall.splice(0,13);S.melds[p.id]=[];if(!S.books[p.id])S.books[p.id]=[];if(S.wins[p.id]==null)S.wins[p.id]=0});S.lastAction='対局開始。各自13枚からスタート。';autoDrawCurrent();broadcast();renderHost()}
function hostMessage(c,m){if(!S)return;if(m.type==='join'){if(S.started)return c.send({type:'error',msg:'この部屋はすでに開始しています'});if(S.players.length>=4)return c.send({type:'error',msg:'満員です'});const p={id:c.peer,name:m.name||'名無し',connected:true};S.players.push(p);S.hands[p.id]=[];S.books[p.id]=[];S.wins[p.id]=0;conns[p.id]=c;c.send({type:'joined',id:p.id,code:roomCode});broadcast();$('roomWait').innerHTML=`参加者 ${S.players.length}/4　<button onclick="startGame()" class="primary">対局開始</button>`;return}
 if(m.type==='action') applyAction(c.peer,m.action);
 if(m.type==='chat') log(m.text||'');}
function send(a){if(role==='host'){applyAction(myId,a)}else if(conn?.open)conn.send({type:'action',action:a})}
function currentPlayer(){return S.players[S.current]?.id}
function autoDrawCurrent(){const id=currentPlayer();if(!S.started||S.drawn||!id)return false;if(!S.wall.length){S.lastAction='山札が尽きました。';return false}S.hands[id].push(S.wall.pop());S.drawn=true;S.lastAction=`${playerName(id)}が自動ツモ。`;return true}
function drawFor(id){return currentPlayer()===id&&autoDrawCurrent()}
function discardFor(id,index){if(currentPlayer()!==id||!S.drawn)return false;const h=S.hands[id];if(index<0||index>=h.length)return false;const tile=h.splice(index,1)[0];S.discards.push({p:id,tile});lastDiscard=tile;S.drawn=false;S.pending={discardBy:id,tile,ron:[],pon:[],chi:[]};for(let i=0;i<S.players.length;i++){const q=S.players[i].id;if(q===id)continue;const cnt=S.hands[q].filter(x=>x===tile).length;if(cnt>=2)S.pending.pon.push(q);if(i===((S.current+1)%S.players.length)&&cnt>=1)S.pending.chi.push(q)}
 const ron=S.players.filter(p=>p.id!==id&&canWin([...S.hands[p.id],tile],p.id)).map(p=>p.id);S.pending.ron=ron;S.pending.passed=[];S.lastAction=`${playerName(id)}が「${tile}」を捨てた。`;if(!S.pending.ron.length&&!S.pending.pon.length&&!S.pending.chi.length)advanceTurn();broadcast();return true}
function canWin(arr,id=myId){const exposed=(S&&S.melds&&S.melds[id])?S.melds[id].length:0;const need=4-exposed;const r=partition(arr,need);return !!r.length}
function partition(arr,needGroups=4){if(arr.length!==needGroups*3+2)return [];const n=arr.length;const counts={};arr.forEach(x=>counts[x]=(counts[x]||0)+1);const keys=Object.keys(counts);for(const pair of keys){if(counts[pair]<2)continue;const c={...counts};c[pair]-=2;let groups=[];if(makeGroups(c,groups)&&groups.length===needGroups)return [...groups,pair+pair]}return []}
function makeGroups(c,out){if(out.length>4)return false;let k=Object.keys(c).find(x=>c[x]>0);if(!k)return true;if(c[k]>=1){for(const w of WORDS){if(w.length!==3||w[0]!==k)continue;if((c[w[1]]||0)>0&&(c[w[2]]||0)>0){c[k]--;c[w[1]]--;c[w[2]]--;out.push(w);if(makeGroups(c,out))return true;out.pop();c[k]++;c[w[1]]++;c[w[2]]++}}}return false}
function applyAction(id,a){if(!S||!S.started)return;let ok=false;
 if(a.type==='draw')ok=drawFor(id);
 else if(a.type==='discard')ok=discardFor(id,a.index);
 else if(a.type==='ron'){if(S.pending?.ron.includes(id)){finishWin(id,'ロン',S.pending.discardBy);ok=true}}
 else if(a.type==='tsumo'){if(currentPlayer()===id&&S.drawn&&canWin(S.hands[id],id)){finishWin(id,'ツモ',id);ok=true}}
 else if(a.type==='pon'){if(S.pending?.pon.includes(id)){const h=S.hands[id],t=S.pending.tile;let idx=[];for(let i=0;i<h.length&&idx.length<2;i++)if(h[i]===t)idx.push(i);idx.reverse().forEach(i=>h.splice(i,1));S.melds[id].push([t,t,t]);S.current=S.players.findIndex(p=>p.id===id);S.drawn=true;S.pending=null;S.lastAction=`${playerName(id)}が「${t}」をポン。鳴いたので即捨て番。`;ok=true}}
 else if(a.type==='chi'){if(S.pending?.chi.includes(id)){const t=S.pending.tile;const h=S.hands[id];let made=null;for(const w of WORDS){if(w.length!==3||!w.includes(t))continue;const need=[...w];need.splice(need.indexOf(t),1);const temp=[...h];let good=true;for(const x of need){const j=temp.indexOf(x);if(j<0){good=false;break}temp.splice(j,1)}if(good){made=w;break}}if(made){for(const x of made){if(x===t)continue;const j=h.indexOf(x);h.splice(j,1)}S.melds[id].push(made);S.current=S.players.findIndex(p=>p.id===id);S.drawn=true;S.pending=null;S.lastAction=`${playerName(id)}が「${made}」でチー。鳴いたので即捨て番。`;ok=true}}}
 else if(a.type==='pass'){if(S.pending){const elig=[...new Set([...(S.pending.ron||[]),...(S.pending.pon||[]),...(S.pending.chi||[])])];if(elig.includes(id)&&!S.pending.passed.includes(id)){S.pending.passed.push(id);if(elig.every(x=>S.pending.passed.includes(x)))advanceTurn();ok=true}}}
 else if(a.type==='newRound'){if(role==='host')startGame()}
 if(ok)broadcast();renderHost()}
function advanceTurn(){if(!S.started)return;S.pending=null;S.current=(S.current+1)%S.players.length;S.drawn=false;autoDrawCurrent();S.lastAction=`${playerName(currentPlayer())}の番。自動ツモ。`}
function finishWin(id,kind,from){const hand=S.hands[id];const words=partition(hand);if(!words.length&&!S.melds[id].length)return;const newWords=words.filter(w=>w.length===2||w.length===3);const book=S.books[id]||[];newWords.forEach(w=>{if(!book.includes(w))book.push(w)});S.books[id]=book;S.wins[id]=(S.wins[id]||0)+1;S.lastAction=`${playerName(id)}が${kind}！`;S.started=false;S.pending=null;showModal(`<div class="winner">${escapeHtml(playerName(id))}　${kind}！</div><p>成立語：${words.map(escapeHtml).join(' / ')||'登録済みの副露を含む'}</p><p>この部屋の勝利数：${S.wins[id]}</p>`)}
function playerName(id){return S.players.find(p=>p.id===id)?.name||'名無し'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderHost(){if(!S)return;renderState(snapshotFor(myId));}
function renderState(msg){S={...S,...msg.pub};S.hands=S.hands||{};S.hands[myId]=msg.hand||S.hands[myId]||[];$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('codeView').textContent=roomCode;$('turnView').textContent=S.started?`手番：${playerName(currentPlayer())}`:'対局待機中';
 $('players').innerHTML=S.players.map((p,i)=>`<div class="player ${p.id===myId?'me ':''}${p.id===currentPlayer()?'active':''}"><b>${escapeHtml(p.name)}</b>${p.id===myId?'（あなた）':''}<br><span class="small">${p.id===currentPlayer()?'● 手番':''}　勝利 ${S.wins[p.id]||0}</span></div>`).join('');
 $('river').innerHTML=S.discards.map((d,i)=>`<div class="tile discard" title="${escapeHtml(playerName(d.p))}">${escapeHtml(d.tile)}<span class="idx">${i+1}</span></div>`).join('');
 $('melds').innerHTML=S.players.flatMap(p=>(S.melds[p.id]||[]).map(m=>`<div class="meld" title="${escapeHtml(p.name)}"><b class="small">${escapeHtml(p.name)}</b><div class="tiles">${m.map(x=>`<div class="tile">${x}</div>`).join('')}</div></div>`)).join('');
 const h=S.hands[myId]||[];$('hand').innerHTML=h.map((x,i)=>`<div class="tile ${selected===i?'selected':''}" draggable="true" data-i="${i}" onclick="tileClick(${i})" ondragstart="dragStart(event,${i})" ondragover="event.preventDefault()" ondrop="dropTile(event,${i})">${escapeHtml(x)}<span class="idx">${i+1}</span></div>`).join('');
 $('handInfo').textContent=`${h.length}枚　※牌をクリックすると濁音・半濁音・小文字を順番に切替`;
 const act=$('actions');act.innerHTML='';const myTurn=currentPlayer()===myId;
 if(S.started&&myTurn&&S.drawn){button('選択牌を捨てる','discard',selected==null);button('ツモ！','tsumo',!canWin(h,myId));}
 if(S.pending?.ron?.includes(myId))button('ロン！','ron',false);if(S.pending?.pon?.includes(myId))button('ポン','pon',false);if(S.pending?.chi?.includes(myId))button('チー','chi',false);if(S.pending&&[...(S.pending.ron||[]),...(S.pending.pon||[]),...(S.pending.chi||[])].includes(myId))button('見送る','pass',false);
 $('hint').innerHTML= S.started&&myTurn&&S.drawn?'自動ツモ済み。捨てる牌を選択。和了できるなら「ツモ！」で確定。':S.pending?.ron?.includes(myId)?'ロンできます。':'自分の手番以外は手牌を自由に並べ替えできます。';
 $('scores').innerHTML=S.players.map(p=>`${escapeHtml(p.name)}：${S.wins[p.id]||0}勝`).join('<br>');$('book').innerHTML=(S.books[myId]||[]).map(w=>`<span class="word">${escapeHtml(w)}</span>`).join('')||'<span class="small">まだ登録なし</span>';
}
function button(label,type,disabled){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=()=>{if(type==='discard'){if(selected==null)return;send({type,index:selected});selected=null}else send({type})};$('actions').appendChild(b)}
function tileClick(i){const h=S.hands[myId]||[];if(i<0||i>=h.length)return;const x=h[i];if(CYCLE[x]){h[i]=CYCLE[x];selected=i;renderState(snapshotFor(myId))}else selected=i;}
function dragStart(e,i){e.dataTransfer.setData('text/plain',String(i));selected=i}
function dropTile(e,to){e.preventDefault();const from=Number(e.dataTransfer.getData('text/plain'));const h=S.hands[myId];if(Number.isInteger(from)&&from!==to){[h[from],h[to]]=[h[to],h[from]];selected=to;renderState(snapshotFor(myId))}}
function showModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
$('modalClose').onclick=()=>$('modal').classList.add('hidden');$('newRound').onclick=()=>{if(role==='host')startGame();else send({type:'newRound'})};$('leave').onclick=()=>location.reload();
$('create').onclick=()=>{roomCode=Math.random().toString(36).slice(2,7).toUpperCase();role='host';$('lobbyStatus').textContent='部屋を作成中…';initPeer(hostPeerId(roomCode),()=>{S=emptyState();S.players=[{id:myId,name:name(),connected:true}];S.hands[myId]=[];S.books[myId]=[];S.wins[myId]=0;$('lobbyStatus').innerHTML='部屋コード';$('roomWait').classList.remove('hidden');$('roomWait').innerHTML=`<div class="roomcode">${roomCode}</div>参加者 1/4　友達にこのコードを渡して参加してもらってください。<br><button class="primary" onclick="startGame()">対局開始</button>`})};
$('join').onclick=()=>{roomCode=($('room').value||'').trim().toUpperCase();if(!roomCode)return;$('lobbyStatus').textContent='参加中…';role='guest';initPeer('guest-'+uid(),()=>{conn=peer.connect(hostPeerId(roomCode),{reliable:true});conn.on('open',()=>conn.send({type:'join',name:name()}));conn.on('data',m=>{if(m.type==='joined'){myId=m.id;$('lobbyStatus').textContent='参加しました。ホストの開始を待っています。'}else if(m.type==='state'){renderState(m);log(S.lastAction||'')}else if(m.type==='error')$('lobbyStatus').textContent=m.msg});conn.on('close',()=>$('lobbyStatus').textContent='接続が切れました')})};
</script></body></html>
