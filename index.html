<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ひらジャン - ひらがな麻雀</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="words.js"></script>
  <style>
    :root {
      --table-bg: #0b2216;
      --felt-center: #153e29;
      --felt-outer: #0d2a1b;
      --frame-wood: #3a1e05;
      --gold: #f1c40f;
      --tile-face: #fffdf5;
      --tile-side: #e5d8b0;
      --tile-text: #1a252f;
    }
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; min-height: 100vh; background: #050a07; color: #fff; display: flex; flex-direction: column; align-items: center; }
    button { cursor: pointer; border: none; background: #27ae60; color: #fff; border-radius: 6px; padding: 10px 18px; font-weight: bold; }
    button:hover { filter: brightness(1.1); }
    button.primary { background: #e67e22; }
    button.danger { background: #c0392b; }
    .wrap { width: 100%; max-width: 1000px; padding: 12px; }
    .card { background: #0f1712; border: 2px solid #27ae60; border-radius: 12px; padding: 20px; text-align: center; }
    .hidden { display: none !important; }

    /* 卓のデザイン */
    .table-container { background: var(--frame-wood); padding: 12px; border-radius: 16px; border: 4px solid #5c330a; margin-top: 10px; }
    .table-felt { background: radial-gradient(circle, var(--felt-center), var(--felt-outer)); border-radius: 10px; padding: 15px; min-height: 400px; }
    .river-area { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 120px; margin: 15px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }

    /* 牌のデザイン */
    .tile { width: 40px; height: 54px; background: linear-gradient(180deg, var(--tile-face) 80%, var(--tile-side)); color: var(--tile-text); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #887a50; margin: 3px; user-select: none; }
    .tile.selected { transform: translateY(-8px); outline: 2px solid var(--gold); }
    .tile-river { width: 32px; height: 44px; font-size: 18px; box-shadow: 0 2px 0 #776a40; cursor: default; }

    .hand-container { margin-top: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; border: 1px solid #27ae60; }
    .complete-hint { background: rgba(241, 196, 15, 0.2); border: 1px solid var(--gold); color: var(--gold); padding: 6px; border-radius: 6px; margin-top: 10px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ロビー画面 -->
    <section id="lobby" class="card" style="max-width:400px; margin: 50px auto;">
      <h1 style="color:var(--gold);">🀄 ひらジャン</h1>
      <input id="name" maxlength="10" placeholder="名前" style="padding:8px; width:80%; text-align:center; margin-bottom:10px;"><br>
      <button class="primary" id="create" style="width:80%; margin-bottom:10px;">部屋を作る</button>
      <div id="roomWait" class="hidden"></div>
    </section>

    <!-- メイン対局画面 -->
    <section id="game" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><b>部屋:</b> <span id="codeView" style="color:var(--gold);"></span></div>
        <div id="turnView" style="color:var(--gold); font-weight:bold;"></div>
        <button id="leave" class="danger" style="padding:4px 8px;">退出</button>
      </div>

      <div class="table-container">
        <div class="table-felt">
          <div style="text-align:center; color:var(--gold);">山札: <span id="wallCount">0</span>枚</div>
          <div class="river-area" id="river"></div>
        </div>
      </div>

      <div class="hand-container">
        <div style="font-size:13px; color:var(--gold);">あなたの手牌（2回クリックで濁音に変化）</div>
        <div id="hand"></div>
        <div id="completeHint" class="complete-hint hidden"></div>
        <div id="actions" style="margin-top:10px;"></div>
      </div>
    </section>
  </div>

  <script>
    const BASE = [...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];
    const WORDS = (window.MAHJONG_WORDS || ["あい","あお"]).filter(w => w.length === 2 || w.length === 3);

    const TRANS = {
      'あ':['あ','ぁ'],'い':['い','ぃ'],'う':['う','ぅ','ゔ'],'え':['え','ぇ'],'お':['お','ぉ'],
      'か':['か','が'],'き':['き','ぎ'],'く':['く','ぐ'],'け':['け','げ'],'こ':['こ','ご'],
      'さ':['さ','ざ'],'し':['し','じ'],'す':['す','ず'],'せ':['せ','ぜ'],'そ':['そ','ぞ'],
      'た':['た','だ'],'ち':['ち','ぢ'],'つ':['つ','づ','っ'],'て':['て','で'],'と':['と','ど'],
      'は':['は','ば','ぱ'],'ひ':['ひ','び','ぴ'],'ふ':['ふ','ぶ','ぷ'],'へ':['へ','べ','ぺ'],'ほ':['ほ','ぼ','ぽ'],
      'や':['や','ゃ'],'ゆ':['ゆ','ゅ'],'よ':['よ','ょ'],'わ':['わ','ゎ']
    };
    const CYCLE = {};
    Object.entries(TRANS).forEach(([b, arr]) => arr.forEach((x, i) => CYCLE[x] = arr[(i + 1) % arr.length]));

    let myId = 'host', S = null, selected = null;

    function $(id) { return document.getElementById(id); }

    function makeWall() {
      const wall = [];
      for (const c of BASE) for (let i = 0; i < 4; i++) wall.push(c);
      return wall.sort(() => Math.random() - 0.5);
    }

    function checkWords(hand) {
      const str = hand.join('');
      return WORDS.filter(w => str.includes(w));
    }

    function render() {
      if (!S || !S.started) return;
      $('lobby').classList.add('hidden');$('game').classList.remove('hidden');

      $('wallCount').textContent = S.wall.length;
      $('turnView').textContent = 'あなたの手番';
      $('river').innerHTML = S.discards.map(d => `<div class="tile tile-river">${d}</div>`).join('');

      const hand = S.hand;
      $('hand').innerHTML = hand.map((x, i) => `<div class="tile ${selected === i ? 'selected' : ''}" onclick="selectTile(${i})">${x}</div>`).join('');

      const completed = checkWords(hand);
      const hint = $('completeHint');
      if (completed.length > 0) {
        hint.classList.remove('hidden');
        hint.innerHTML = `💡 完成中の言葉: <b>${completed.slice(0, 5).join('、')}</b>`;
      } else {
        hint.classList.add('hidden');
      }

      const actions = $('actions');
      actions.innerHTML = '';
      if (S.drawn) {
        const b1 = document.createElement('button');
        b1.textContent = '選択した牌を捨てる';
        b1.disabled = selected == null;
        b1.onclick = discardTile;
        actions.appendChild(b1);

        if (completed.length > 0) {
          const b2 = document.createElement('button');
          b2.className = 'primary';
          b2.style.marginLeft = '10px';
          b2.textContent = 'ツモあがり！';
          b2.onclick = () => alert('上がり！完成した言葉: ' + completed.join(', '));
          actions.appendChild(b2);
        }
      }
    }

    function selectTile(i) {
      if (selected === i && CYCLE[S.hand[i]]) {
        S.hand[i] = CYCLE[S.hand[i]];
      } else {
        selected = i;
      }
      render();
    }

    function discardTile() {
      if (selected == null) return;
      const tile = S.hand.splice(selected, 1)[0];
      S.discards.push(tile);
      selected = null;
      S.drawn = false;
      render();

      // 自動ツモ
      setTimeout(() => {
        if (S.wall.length > 0) {
          S.hand.push(S.wall.pop());
          S.drawn = true;
          render();
        } else {
          alert('流局（山札がなくなりました）');
        }
      }, 500);
    }

    $('create').onclick = () => {
      S = {
        started: true,
        wall: makeWall(),
        hand: [],
        discards: [],
        drawn: true
      };
      S.hand = S.wall.splice(0, 14);
      render();
    };

    $('leave').onclick = () => location.reload();
  </script>
</body>
</html>
