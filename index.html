<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひらがな麻雀 - オンライン対戦</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1b1e;
      --card-bg: #162a2d;
      --accent-color: #00e676;
      --text-color: #ffffff;
      --gold: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
    .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #2a4d53; text-align: center; }
    h1 { color: var(--accent-color); margin-bottom: 15px; font-size: 1.8rem; }
    p { color: #ccc; margin-bottom: 15px; font-size: 0.95rem; }
    
    .btn { background: #00b0ff; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin: 6px; transition: 0.2s; width: 100%; max-width: 280px; }
    .btn:hover { background: #0091ea; transform: translateY(-2px); }
    .btn-gold { background: var(--gold); color: #000; font-size: 1.1rem; }
    .btn-gold:hover { background: #e6c200; }
    
    input[type="text"] { padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #336666; background: #081012; color: #fff; width: 100%; max-width: 280px; text-align: center; margin-bottom: 15px; }
    
    /* モード選択 */
    .mode-select { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .mode-btn { flex: 1; max-width: 130px; background: #224448; color: #fff; border: 2px solid transparent; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .mode-btn.active { border-color: var(--accent-color); background: #133337; color: var(--accent-color); }

    /* 待機画面・キャラ表示 */
    .avatar-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--accent-color); object-fit: cover; margin: 15px auto; box-shadow: 0 0 20px rgba(0,230,118,0.4); display: block; }
    .status-badge { background: #081012; border: 1px solid var(--accent-color); padding: 10px 20px; border-radius: 20px; display: inline-block; font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: var(--accent-color); }
    .player-list { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; align-items: center; }
    .player-card { background: #0a1517; padding: 10px 20px; border-radius: 8px; border: 1px solid #2a4d53; width: 100%; max-width: 280px; text-align: left; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>🀄 ひらがな麻雀</h1>

  <!-- 1. トップ（ロビー）画面 -->
  <div id="screen-lobby">
    <p>対戦人数を選び、部屋コードを入力して参戦！</p>
    
    <div class="mode-select">
      <button class="mode-btn active" id="btn-mode-3" onclick="setMode(3)">3人対戦</button>
      <button class="mode-btn" id="btn-mode-4" onclick="setMode(4)">4人対戦</button>
    </div>

    <div>
      <input type="text" id="room-code-input" placeholder="部屋コード (例: 7777)" maxlength="12">
      <br>
      <button class="btn btn-gold" onclick="joinRoom()">対戦部屋に入る・作成</button>
    </div>
  </div>

  <!-- 2. 待機画面 -->
  <div id="screen-waiting" class="hidden">
    <h2>対戦相手を待っています...</h2>
    
    <!-- ご指定のアイコン画像 -->
    <img src="54_20260130212031.jpg" alt="キャラクター" class="avatar-img" onerror="this.src='https://via.placeholder.com/150/00e676/000000?text=Wait...'">
    
    <div class="status-badge">
      参加中: <span id="current-count">1</span> / <span id="target-count">3</span> 人
    </div>
    
    <p style="font-size:0.85rem; color:#888;">※コードを入力した本物のプレイヤーが揃うまでCPUは入らず待機します</p>

    <div class="player-list" id="player-list-container">
      <!-- 参加プレイヤー一覧がここに入る -->
    </div>

    <div style="margin-top: 15px;">
      <button class="btn" onclick="copyInviteURL()">🔗 招待URLをコピー</button>
      <button class="btn" style="background:#444;" onclick="copyRoomCode()">🔑 部屋コードをコピー</button>
    </div>
  </div>

  <!-- 3. ゲーム画面 -->
  <div id="screen-game" class="hidden">
    <h2 style="color:var(--accent-color); font-size:2rem; margin-top:20px;">🎉 全員揃いました！</h2>
    <p style="margin-top:10px;">対局を開始します...</p>
  </div>
</div>

<script>
  let targetPlayers = 3;
  let currentRoomCode = '';
  let myPeerId = '';
  let peer = null;
  let connections = [];

  // URLパラメーターから自動で部屋コードをロード
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('room-code-input').value = roomParam;
    }
  });

  function setMode(num) {
    targetPlayers = num;
    document.getElementById('btn-mode-3').classList.toggle('active', num === 3);
    document.getElementById('btn-mode-4').classList.toggle('active', num === 4);
    document.getElementById('target-count').innerText = num;
  }

  function joinRoom() {
    const code = document.getElementById('room-code-input').value.trim();
    if (!code) {
      alert('部屋コードを入力してください！');
      return;
    }
    currentRoomCode = code;

    // 画面切り替え
    document.getElementById('screen-lobby').classList.add('hidden');
    document.getElementById('screen-waiting').classList.remove('hidden');

    // 通信の開始（人間同士のマッチング）
    initPeer(code);
  }

  function initPeer(code) {
    // ユニークなIDでPeer作成
    myPeerId = 'mahjong-' + code + '-' + Math.floor(Math.random() * 8999 + 1000);
    peer = new Peer(myPeerId);

    peer.on('open', (id) => {
      updateUI([ 'あなた (プレイヤー1)' ]);
    });

    // 他プレイヤーからの接続受領
    peer.on('connection', (conn) => {
      connections.push(conn);
      
      conn.on('open', () => {
        broadcastPlayerCount();
      });

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        broadcastPlayerCount();
      });
    });
  }

  function broadcastPlayerCount() {
    const totalCount = connections.length + 1;
    let list = ['あなた (プレイヤー1)'];
    for(let i = 2; i <= totalCount; i++) {
      list.push(`プレイヤー ${i}`);
    }
    updateUI(list);

    // 人数が満たされたらゲーム開始
    if (totalCount >= targetPlayers) {
      setTimeout(() => {
        document.getElementById('screen-waiting').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
      }, 800);
    }
  }

  function updateUI(playerList) {
    document.getElementById('current-count').innerText = playerList.length;
    const container = document.getElementById('player-list-container');
    container.innerHTML = '';

    playerList.forEach((name) => {
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerText = '🟢 ' + name;
      container.appendChild(card);
    });
  }

  function copyRoomCode() {
    navigator.clipboard.writeText(currentRoomCode);
    alert('部屋コードをコピーしました: ' + currentRoomCode);
  }

  function copyInviteURL() {
    const inviteURL = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoomCode)}`;
    navigator.clipboard.writeText(inviteURL);
    alert('招待URLをコピーしました！LINE等で友達に共有してください。');
  }
</script>

</body>
</html>
