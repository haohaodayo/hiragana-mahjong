<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀 4人対戦</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eadc;color:#241d17;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:#fffaf1;border:2px solid #c8b99e;border-radius:16px;padding:18px;box-shadow:0 5px 18px #0001}
h1,h2,h3{margin-top:0}.muted{color:#766b5e}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input{font-size:18px;padding:11px 12px;border:2px solid #c8b99e;border-radius:9px;background:#fff;width:190px;text-transform:uppercase}
button{font-size:15px;font-weight:700;padding:10px 14px;border:0;border-radius:9px;background:#604832;color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.danger{background:#9d4035}.green{background:#3e6b4b}.gold{background:#94702e}
.hidden{display:none}.room{font-size:32px;font-weight:800;letter-spacing:7px;background:#eee1c6;border-radius:10px;padding:8px 15px;display:inline-block}
#players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.player{padding:10px;border-radius:10px;background:#eee5d6;border:2px solid transparent}.player.me{border-color:#94702e}.player.turn{box-shadow:inset 0 0 0 3px #b28b42}
#table{display:grid;grid-template-columns:1fr 2fr 1fr;grid-template-rows:1fr 2fr 1fr;gap:8px;min-height:520px;margin:12px 0}
.seat{background:#eee5d6;border-radius:12px;padding:10px}.north{grid-column:2}.west{grid-column:1;grid-row:2}.center{grid-column:2;grid-row:2;background:#e5d7bc;display:flex;flex-direction:column;justify-content:center;align-items:center}.east{grid-column:3;grid-row:2}.south{grid-column:2;grid-row:3}
.tiles{display:flex;gap:6px;flex-wrap:wrap}.tile{width:48px;height:58px;border:2px solid #9d8b72;border-radius:8px;background:#fff;color:#241d17;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;cursor:pointer;user-select:none;box-shadow:0 2px 3px #0002}.tile.sel{background:#ead29b;border-color:#8b681f;transform:translateY(-5px)}.smalltile{width:34px;height:42px;font-size:19px;cursor:default}.meld{background:#ddd0b9;border-radius:8px;padding:5px;margin:4px 0}.log{height:130px;overflow:auto;background:#211d19;color:#f4e7d1;padding:10px;border-radius:10px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.notice{font-weight:800;font-size:18px}.centerword{font-size:25px;letter-spacing:4px;min-height:36px}
@media(max-width:800px){#players{grid-template-columns:repeat(2,1fr)}#table{grid-template-columns:1fr;grid-template-rows:auto;min-height:0}.north,.west,.center,.east,.south{grid-column:1;grid-row:auto}.tile{width:43px;height:53px;font-size:24px}}
</style>
</head>
<body><div class="wrap">
<div id="lobby" class="panel">
<h1>🀄 ひらがな麻雀・4人対戦</h1>
<p class="muted">部屋を作ってコードを共有するか、友達のコードを入力して参加。</p>
<div class="row">
<button id="hostBtn" class="green">部屋を作る</button>
<input id="codeInput" maxlength="6" placeholder="参加コード">
<button id="joinBtn">部屋に参加</button>
</div>
<p id="status" class="muted"></p>
</div>

<div id="game" class="hidden">
<div class="panel">
<div class="row"><div>参加コード</div><div id="roomCode" class="room"></div><button id="copyBtn">コードをコピー</button><span id="gameStatus" class="notice"></span></div>
<div id="players"></div>
</div>

<div id="table">
<div class="seat north" id="seat1"></div>
<div class="seat west" id="seat2"></div>
<div class="center"><div class="muted">場</div><div id="centerStatus" class="notice"></div><div class="centerword" id="lastDiscard">—</div><div class="muted">最後の捨て牌</div></div>
<div class="seat east" id="seat3"></div>
<div class="seat south" id="seat0"></div>
</div>

<div class="panel">
<h3>あなたの手牌 <span id="count"></span></h3><div id="hand" class="tiles"></div>
<div class="actions">
<button id="drawBtn">ツモ</button><button id="discardBtn" disabled>選択牌を捨てる</button>
<button id="ponBtn" class="gold" disabled>ポン</button><button id="chiBtn" class="gold" disabled>チー</button>
<button id="ronBtn" class="green" disabled>ロン</button><button id="tsumoBtn" class="green" disabled>ツモあがり</button>
</div>
<div id="actionNotice" class="muted"></div>
<h3>ログ</h3><div id="log" class="log"></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const KANA=[..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
const COPIES=4, MAX=4;
let peer=null, host=false, room="", myId="", conns={}, state=null, selected=-1, pending=null;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){return shuffle(KANA.flatMap(x=>Array(COPIES).fill(x)))}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function msg(s){$("log").textContent=s+"\n"+$("log").textContent}
function setStatus(s){$("status").textContent=s}
function showGame(){ $("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("roomCode").textContent=room }
function mkState(){
 let deck=makeDeck(), players=[];
 for(let i=0;i<MAX;i++) players.push({id:i,name:i===0?"ホスト":"待機中",online:i===0,hand:[],melds:[],discards:[],ready:false});
 for(let i=0;i<MAX;i++) for(let j=0;j<13;j++) players[i].hand.push(deck.pop());
 return {players,deck,turn:0,phase:"waiting",lastDiscard:null,lastDiscardBy:null,started:false,winner:null};
}
function broadcast(){
 if(!host)return;
 const safe=JSON.parse(JSON.stringify(state));
 Object.values(conns).forEach(c=>{try{c.send({type:"state",state:safe})}catch(e){}}); render();
}
function sendToHost(o){if(host){handleMsg({type:o.type,payload:o.payload,from:myId});return} if(window.hostConn&&window.hostConn.open)window.hostConn.send(o)}
function connectTo(id){
 const c=peer.connect(id,{reliable:true}); window.hostConn=c;
 c.on("open",()=>{setStatus("部屋に接続しました。参加登録中…");c.send({type:"join",name:"プレイヤー"})});
 c.on("data",handleMsg);c.on("close",()=>setStatus("ホストとの接続が切れました。"));
 c.on("error",e=>setStatus("接続エラー："+e.type));
}
function handleMsg(m){
 if(host){
  if(m.type==="join"){
   const idx=state.players.findIndex(p=>!p.online);
   if(idx<0){let c=conns[m.from];try{c.send({type:"full"})}catch(e){}return}
   const c=conns[m.from];state.players[idx].id=idx;state.players[idx].online=true;state.players[idx].name="プレイヤー"+(idx+1);c.playerIndex=idx;
   c.send({type:"assigned",index:idx,room});broadcast(); if(state.players.filter(p=>p.online).length===4){state.started=true;state.phase="draw";state.turn=0;msg("4人そろった！ゲーム開始！");broadcast()}
  } else if(m.type==="action") handleAction(m.from,m.payload);
  return;
 }
 if(m.type==="assigned"){window.myIndex=m.index;showGame();setStatus("参加完了！4人そろうまで待機。")}
 if(m.type==="state"){state=m.state;render()}
 if(m.type==="full"){setStatus("この部屋は満員です。")}
}
function handleAction(from,a){
 const c=conns[from], idx=c?.playerIndex; if(idx==null)return;
 if(a.kind==="draw"){
  if(!state.started||state.phase!=="draw"||state.turn!==idx||state.deck.length===0)return;
  state.players[idx].hand.push(state.deck.pop());state.phase="discard";state.lastDiscard=null;broadcast()
 }else if(a.kind==="discard"){
  if(state.phase!=="discard"||state.turn!==idx)return;
  const x=state.players[idx].hand.splice(a.pos,1)[0];if(!x)return;
  state.players[idx].discards.push(x);state.lastDiscard=x;state.lastDiscardBy=idx;
  state.turn=(idx+1)%4;state.phase="draw";broadcast()
 }else if(a.kind==="pon"){
  if(state.lastDiscard==null||state.lastDiscardBy===idx||state.phase!=="draw")return;
  let h=state.players[idx].hand, x=state.lastDiscard, pos=[];
  h.forEach((v,i)=>{if(v===x)pos.push(i)});if(pos.length<2)return;
  for(let i=pos.length-1;i>=0;i--)h.splice(pos[i],1);
  state.players[idx].melds.push([x,x,x]);state.lastDiscard=null;state.turn=idx;state.phase="discard";broadcast()
 }else if(a.kind==="chi"){
  if(state.lastDiscard==null||state.lastDiscardBy===idx||state.phase!=="draw")return;
  let x=state.lastDiscard, n=KANA.indexOf(x), h=state.players[idx].hand;
  if(n<1||n>=KANA.length-1)return;
  let a1=h.indexOf(KANA[n-1]),a2=h.indexOf(KANA[n+1]);if(a1<0||a2<0)return;
  h.splice(Math.max(a1,a2),1);h.splice(Math.min(a1,a2),1);state.players[idx].melds.push([KANA[n-1],x,KANA[n+1]]);
  state.lastDiscard=null;state.turn=idx;state.phase="discard";broadcast()
 }else if(a.kind==="win"){
  if(state.turn!==idx)return; state.winner=idx;state.phase="end";broadcast()
 }
}
function action(kind,payload={}){
 sendToHost({type:"action",payload:{kind,...payload}});
}
$("hostBtn").onclick=()=>{
 host=true;room=code();myId=room;peer=new Peer(room);peer.on("open",()=>{state=mkState();showGame();window.myIndex=0;setStatus("あなたがホスト。コードを共有して4人集めよう。");render()});
 peer.on("connection",c=>{conns[c.peer]=c;c.on("data",m=>{m.from=c.peer;handleMsg(m)})});peer.on("error",e=>setStatus("通信エラー："+e.type));
};
$("joinBtn").onclick=()=>{
 room=$("codeInput").value.trim().toUpperCase();if(room.length<4){setStatus("参加コードを入力してね");return}
 peer=new Peer();peer.on("open",id=>{myId=id;connectTo(room)});peer.on("error",e=>setStatus("部屋が見つからないか通信エラー："+e.type));
};
$("copyBtn").onclick=()=>navigator.clipboard?.writeText(room);
$("drawBtn").onclick=()=>action("draw");
$("discardBtn").onclick=()=>{if(selected>=0)action("discard",{pos:selected})};
$("ponBtn").onclick=()=>action("pon");
$("chiBtn").onclick=()=>action("chi");
$("ronBtn").onclick=()=>action("win");
$("tsumoBtn").onclick=()=>action("win");

function canPon(){if(!state?.lastDiscard||state.lastDiscardBy===window.myIndex)return false;let x=state.lastDiscard;return state.players[window.myIndex].hand.filter(v=>v===x).length>=2}
function canChi(){if(!state?.lastDiscard||state.lastDiscardBy===window.myIndex)return false;let n=KANA.indexOf(state.lastDiscard),h=state.players[window.myIndex].hand;if(n<1||n>=KANA.length-1)return false;return h.includes(KANA[n-1])&&h.includes(KANA[n+1])}
function renderSeat(el,p,i){
 el.innerHTML="<b>"+p.name+(i===window.myIndex?"（あなた）":"")+"</b> "+(p.online?"🟢":"⚪")+"<br><span class='muted'>手牌："+p.hand.length+"枚　副露："+p.melds.length+"組</span>";
 if(p.melds.length)el.innerHTML+="<div>"+p.melds.map(m=>"<span class='meld'>"+m.join("")+"</span>").join("")+"</div>";
 el.innerHTML+="<div class='muted'>捨て牌："+p.discards.join(" ")+"</div>";
}
function render(){
 if(!state)return; $("gameStatus").textContent=state.phase==="end"?"🏆 "+state.players[state.winner].name+" の勝ち！":state.started?"手番："+state.players[state.turn].name:"4人待機中";
 $("players").innerHTML=state.players.map((p,i)=>`<div class="player ${i===window.myIndex?"me":""} ${i===state.turn?"turn":""}"><b>${p.name}</b><br>${p.online?"参加中":"待機中"}　手牌 ${p.hand.length}</div>`).join("");
 [0,1,2,3].forEach(i=>renderSeat($("seat"+i),state.players[i],i));
 const h=$("hand");h.innerHTML="";let mine=state.players[window.myIndex];
 mine.hand.forEach((x,i)=>{let b=document.createElement("button");b.className="tile"+(i===selected?" sel":"");b.textContent=x;b.onclick=()=>{selected=i;render()};h.appendChild(b)});
 $("count").textContent="（"+mine.hand.length+"枚）";
 $("lastDiscard").textContent=state.lastDiscard||"—";
 $("centerStatus").textContent=state.started?(state.phase==="draw"?"ツモ待ち":"捨て牌待ち"):"待機中";
 const myTurn=state.started&&state.turn===window.myIndex&&state.phase==="discard";
 $("drawBtn").disabled=!(state.started&&state.turn===window.myIndex&&state.phase==="draw");
 $("discardBtn").disabled=!(myTurn&&selected>=0);
 $("ponBtn").disabled=!(state.started&&state.phase==="draw"&&canPon());
 $("chiBtn").disabled=!(state.started&&state.phase==="draw"&&canChi());
 $("ronBtn").disabled=!(state.started&&state.phase==="draw"&&state.lastDiscardBy!==window.myIndex&&state.lastDiscard);
 $("tsumoBtn").disabled=!(state.started&&state.turn===window.myIndex&&state.phase==="discard");
 if(state.phase==="end")[$("drawBtn"),$("discardBtn"),$("ponBtn"),$("chiBtn"),$("ronBtn"),$("tsumoBtn")].forEach(b=>b.disabled=true);
}
setInterval(()=>{if(host&&state)broadcast()},1500);
</script>
</body></html>
