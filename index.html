<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひとりだけ知らない</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#10131c;--panel:#191e2b;--panel2:#22293a;--text:#f4f7ff;--muted:#9ca7bd;--accent:#7c5cff;--accent2:#22d3ee;--danger:#ff5577;--ok:#38d39f;}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#252044 0,#10131c 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.logo{text-align:center;font-weight:900;font-size:clamp(30px,7vw,58px);letter-spacing:.03em;margin:20px 0 4px}.sub{text-align:center;color:var(--muted);margin-bottom:25px}.card{background:rgba(25,30,43,.94);border:1px solid #30394e;border-radius:22px;padding:20px;box-shadow:0 15px 50px #0005;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:13px 16px;font-weight:800;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#30384d}button.good{background:var(--ok);color:#071b15}button.danger{background:var(--danger)}button:disabled{opacity:.4;cursor:not-allowed}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #3a455d;background:#0f1420;color:white;outline:none}label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.center{text-align:center}.hidden{display:none!important}.big{font-size:32px;font-weight:900}.role{display:inline-block;padding:7px 11px;border-radius:99px;background:#332a65;color:#cfc6ff;font-weight:800}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.player{background:var(--panel2);border-radius:15px;padding:13px;text-align:center;border:1px solid #30394e}.player.host{border-color:#7c5cff}.player .dot{font-size:26px}.phase{color:var(--accent2);font-weight:900}.prompt{font-size:clamp(23px,5vw,40px);font-weight:900;line-height:1.25;text-align:center;padding:25px 8px}.answers{display:grid;gap:10px}.answer{background:#111725;border:1px solid #343e55;border-radius:15px;padding:15px}.answer .who{color:var(--muted);font-size:12px}.answer .text{font-size:20px;font-weight:800;margin-top:4px}.timer{text-align:center;font-size:28px;font-weight:900}.vote{width:100%;text-align:left;background:#252d40;border:1px solid #3a465f}.vote.selected{outline:3px solid var(--accent2)}.result{font-size:18px;line-height:1.7}.small{font-size:13px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-weight:800;display:none;z-index:5}.tabs{display:flex;gap:8px}.tabs button{flex:1}.score{font-weight:900;color:#ffd86b}.list{padding-left:20px}.hr{height:1px;background:#30394e;margin:18px 0}
</style></head>
<body><div class="wrap">
<div class="logo">🎭 ひとりだけ知らない</div><div class="sub">みんな知ってる。ひとりだけ、知らない。</div>
<section id="home" class="card">
<h2>部屋をつくる</h2><div class="grid"><div><label>名前</label><input id="name" maxlength="12" placeholder="名前を入力"></div><div><label>人数</label><select id="maxPlayers"><option value="4">4人</option><option value="5">5人</option><option value="6">6人</option><option value="7">7人</option><option value="8" selected>8人</option></select></div></div><button style="width:100%;margin-top:12px" onclick="createRoom()">部屋をつくる</button><div class="hr"></div><h2>部屋に入る</h2><div class="grid"><div><label>ルームコード</label><input id="roomCode" maxlength="8" placeholder="例：AB12CD"></div><div><label>名前</label><input id="joinName" maxlength="12" placeholder="名前を入力"></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="joinRoom()">参加する</button></section>
<section id="lobby" class="card hidden"><div class="row"><div><div class="small">ルームコード</div><div id="code" class="big">------</div></div><button class="secondary" onclick="copyCode()">コードをコピー</button></div><div class="hr"></div><h2>参加者</h2><div id="players" class="players"></div><div class="hr"></div><div id="hostControls"></div><p class="small">4〜8人がおすすめ。ホストが「ゲーム開始」を押すと始まります。</p></section>
<section id="game" class="card hidden"><div class="row"><div class="phase" id="phase"></div><div class="timer" id="timer"></div></div><div id="gameContent"></div></section>
<section id="help" class="card"><h2>🎮 遊び方</h2><ol class="list"><li>部屋を作って友達にコードを送る</li><li>全員に同じお題が配られる。ただし<strong>1人だけお題を知らない</strong></li><li>順番に、お題を直接言わない一言ヒントを出す</li><li>全員の発言後、「知らない人」を投票</li><li>最多票の人が正体を明かし、最後にお題を当てる</li></ol></section>
</div><div id="toast" class="toast"></div>
<script>
const WORDS=[
['ラーメン','食べ物'],['カレー','食べ物'],['寿司','食べ物'],['たこ焼き','食べ物'],['ハンバーガー','食べ物'],['焼肉','食べ物'],['プリン','食べ物'],['アイスクリーム','食べ物'],['おにぎり','食べ物'],['ピザ','食べ物'],
['学校','場所'],['コンビニ','場所'],['遊園地','場所'],['海','場所'],['病院','場所'],['映画館','場所'],['公園','場所'],['温泉','場所'],['図書館','場所'],['空港','場所'],
['猫','生き物'],['犬','生き物'],['ペンギン','生き物'],['ライオン','生き物'],['パンダ','生き物'],['カブトムシ','生き物'],['イルカ','生き物'],['フクロウ','生き物'],
['ポケモン','ゲーム・作品'],['マリオ','ゲーム・作品'],['ドラえもん','作品'],['映画','作品'],['漫画','作品'],['ゲーム','作品'],['YouTube','ネット'],['Discord','ネット'],['SNS','ネット'],
['夏休み','概念'],['恋愛','概念'],['お金','概念'],['友情','概念'],['嘘','概念'],['秘密','概念'],['運','概念'],['青春','概念'],
['医者','職業'],['警察官','職業'],['教師','職業'],['料理人','職業'],['アイドル','職業'],['YouTuber','職業'],['ゲーム実況者','職業']
];
let peer=null,isHost=false,myId='',roomId='',me='',players={},state=null,hostConn=null,connections={};
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function codeGen(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function createRoom(){me=$('name').value.trim()||'名無し';roomId=codeGen();isHost=true;startPeer(roomId)}
function joinRoom(){me=$('joinName').value.trim()||'名無し';roomId=$('roomCode').value.trim().toUpperCase();if(roomId.length<4)return toast('ルームコードを入力してね');isHost=false;connectToHost(roomId)}
function startPeer(id){peer=new Peer('hitorishiranai-'+id,{debug:0});peer.on('open',pid=>{myId=pid;players[myId]={id:myId,name:me,score:0};$('code').textContent=roomId;show('lobby');renderLobby()});peer.on('connection',c=>{connections[c.peer]=c;c.on('open',()=>{c.send({type:'welcome',hostId:myId,state,players});});c.on('data',m=>onHostMessage(c,m));c.on('close',()=>{delete players[c.peer];delete connections[c.peer];broadcast({type:'players',players});renderLobby()})});peer.on('error',e=>toast('通信エラー：'+e.type))}
function connectToHost(id){peer=new Peer({debug:0});peer.on('open',pid=>{myId=pid;hostConn=peer.connect('hitorishiranai-'+id,{reliable:true});hostConn.on('open',()=>hostConn.send({type:'join',name:me}));hostConn.on('data',onClientMessage);hostConn.on('close',()=>toast('ホストとの接続が切れました'))});peer.on('error',e=>toast('部屋が見つからないか、通信に失敗しました'))}
function onHostMessage(c,m){if(m.type==='join'){players[c.peer]={id:c.peer,name:m.name,score:0};connections[c.peer]=c;c.send({type:'joined',myId:c.peer,roomId,players,state});broadcast({type:'players',players});renderLobby() } else if(m.type==='action'){handleAction(c.peer,m.action,m.data)}}
function onClientMessage(m){if(m.type==='joined'){players=m.players;roomId=m.roomId;$('code').textContent=roomId;show('lobby');renderLobby()}else if(m.type==='players'){players=m.players;renderLobby()}else if(m.type==='state'){state=m.state;renderGame()}else if(m.type==='start'){state=m.state;show('game');renderGame()}else if(m.type==='toast'){toast(m.text)}}
function broadcast(msg){Object.values(connections).forEach(c=>{try{c.send(msg)}catch{}})}
function broadcastState(){Object.values(connections).forEach(c=>{try{const st={...state,playersSnapshot:players}; if(state.phase!=='result' && state.unknown===c.peer) st.word=undefined; c.send({type:'state',state:st})}catch{}})}
function sendAction(action,data){if(isHost)handleAction(myId,action,data);else hostConn&&hostConn.send({type:'action',action,data})}
function renderLobby(){$('players').innerHTML=Object.values(players).map(p=>`<div class="player ${p.id===myId&&isHost?'host':''}"><div class="dot">🎭</div><strong>${esc(p.name)}</strong>${p.id===myId?' <span class="small">(あなた)</span>':''}${p.id===myId&&isHost?'<div class="small">HOST</div>':''}</div>`).join('');$('hostControls').innerHTML=isHost?`<button class="good" style="width:100%" onclick="startGame()" ${Object.keys(players).length<3?'disabled':''}>ゲーム開始（${Object.keys(players).length}人）</button>`:`<div class="center small">ホストがゲームを開始するまで待ってね。</div>`}
function startGame(){if(Object.keys(players).length<3)return;newRound()}
function newRound(){const arr=Object.values(players),word=WORDS[Math.floor(Math.random()*WORDS.length)][0],unknown=arr[Math.floor(Math.random()*arr.length)].id;state={phase:'clue',word,unknown,turn:0,clues:{},votes:{},voteChoice:null,round:1};Object.values(connections).forEach(c=>{try{const st={...state,playersSnapshot:players};if(state.unknown===c.peer)st.word=undefined;c.send({type:'start',state:st})}catch{}});state.playersSnapshot=players;state.phase='clue';renderGame()}
function publicState(){return {...state,word:undefined,unknown:undefined,playersSnapshot:players}}
function privateState(){const s={...state,playersSnapshot:players};if(state.unknown===myId)s.word=undefined;return s}
function sync(){broadcastState();renderGame()}
function renderGame(){if(!state)return;show('game');$('phase').textContent=state.phase==='clue'?'💬 ヒントタイム':state.phase==='vote'?'🕵️ 投票タイム':state.phase==='guess'?'🎯 お題当て':'🏆 結果';$('timer').textContent='';let html='';if(state.phase==='clue')html=clueView();if(state.phase==='vote')html=voteView();if(state.phase==='guess')html=guessView();if(state.phase==='result')html=resultView();$('gameContent').innerHTML=html}
function clueView(){const arr=Object.values(players);let current=arr[state.turn%arr.length];let list=Object.entries(state.clues).map(([id,x])=>`<div class="answer"><div class="who">${esc(players[id]?.name||'?')}</div><div class="text">${esc(x)}</div></div>`).join('');let mine=state.clues[myId]!=null;return `<div class="prompt">お題について、一言だけヒント！</div><div class="center small">${current.id===myId?'あなたの番！':'現在の発言者：'+esc(current.name)}</div><div class="card" style="background:#121725"><div class="center">あなたのお題</div><div class="center big" style="font-size:26px">${state.unknown===myId?'❓ 知らない':esc(state.word||'')}</div><div class="small center">※お題そのもの・答えが分かる単語は言わないでね</div></div>${current.id===myId&&!mine?`<div class="row"><input id="clueInput" maxlength="40" placeholder="例：熱い／店によって違う／夏に食べたい"><button onclick="submitClue()">発言する</button></div>`:''}<div class="hr"></div><div class="answers">${list||'<div class="center small">まだ発言はありません</div>'}</div>`}
function submitClue(){const v=$('clueInput')?.value.trim();if(!v)return toast('一言入力してね');sendAction('clue',v)}
function voteView(){let already=state.votes[myId]!=null;let names=Object.values(players).map(p=>`<button class="vote ${state.votes[myId]===p.id?'selected':''}" onclick="castVote('${p.id}')">🎭 ${esc(p.name)}</button>`).join('');let count=Object.keys(state.votes).length;return `<div class="prompt">ひとりだけ知らないのは誰？</div><div class="center small">投票済み：${count}/${Object.keys(players).length}</div><div class="answers" style="margin-top:15px">${names}</div>`}
function castVote(id){if(state.votes[myId]!=null)return;sendAction('vote',id)}
function guessView(){if(state.unknown!==myId)return `<div class="prompt">${esc(players[state.unknown]?.name||'???')} が怪しい！</div><p class="center">正体は「お題を知らない人」。本人がお題を当てられるか勝負！</p><div class="center"><button onclick="revealForGuess()">お題当てを開始</button></div>`;return `<div class="prompt">🎯 最後のチャンス！</div><p class="center">あなたはお題を知りません。推理して入力してください。</p><div class="row"><input id="guessInput" placeholder="お題は何？"><button onclick="submitGuess()">当てる</button></div>`}
function revealForGuess(){sendAction('revealGuess')}
function submitGuess(){const v=$('guessInput')?.value.trim();if(!v)return;sendAction('guess',v)}
function resultView(){const culprit=players[state.unknown]?.name||'?';let msg=state.guessCorrect?`🎉 ${esc(culprit)} が逆転成功！お題は「${esc(state.word)}」でした。`:`🕵️ ${esc(culprit)} が知らない人でした！お題は「${esc(state.word)}」。`;let scores=Object.values(players).sort((a,b)=>b.score-a.score).map(p=>`<div class="answer"><strong>${esc(p.name)}</strong><span class="score">　${p.score} pt</span></div>`).join('');return `<div class="prompt">${msg}</div><div class="result">${Object.entries(state.votes).map(([voter,target])=>`<div>${esc(players[voter]?.name||'?')} → ${esc(players[target]?.name||'?')}</div>`).join('')}</div><div class="hr"></div><h3>🏆 スコア</h3>${scores}<div class="hr"></div>${isHost?`<button class="good" style="width:100%" onclick="newRound()">もう一回！</button>`:`<div class="center small">ホストが次のラウンドを開始します。</div>`}`}
function handleAction(pid,action,data){if(!isHost)return;if(action==='clue'){const arr=Object.values(players);const current=arr[state.turn%arr.length];if(pid!==current.id||state.clues[pid]!=null)return;state.clues[pid]=String(data).slice(0,40);state.turn++;if(state.turn>=arr.length)state.phase='vote';sync()}else if(action==='vote'){if(state.votes[pid]!=null||!players[data])return;state.votes[pid]=data;if(Object.keys(state.votes).length===Object.keys(players).length){const counts={};Object.values(state.votes).forEach(x=>counts[x]=(counts[x]||0)+1);let max=Math.max(...Object.values(counts)),top=Object.keys(counts).filter(k=>counts[k]===max);state.unknown=top[Math.floor(Math.random()*top.length)];state.phase='guess'}sync()}else if(action==='revealGuess'){state.phase='guess';broadcastState();renderGame()}else if(action==='guess'){state.guessCorrect=String(data).trim().toLowerCase()===String(state.word).trim().toLowerCase();if(state.guessCorrect)players[state.unknown].score+=3;else Object.entries(state.votes).forEach(([v,t])=>{if(t===state.unknown)players[v].score+=1});state.phase='result';broadcastState();renderGame()}}
function copyCode(){navigator.clipboard?.writeText(roomId);toast('コードをコピーした！')}
</script></body></html>
