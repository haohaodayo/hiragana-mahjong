  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at center, #0a1e17 0%, #030a08 100%);
      color: #fff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .mahjong-table {
      background: radial-gradient(circle at center, #134133 0%, #0a271e 70%, #03120d 100%);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
      border: 10px solid #2d1810;
      outline: 2px solid #fbbf24;
    }

    .gold-text {
      background: linear-gradient(135deg, #fffbeb 0%, #fef08a 25%, #f59e0b 60%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.5));
    }

    .emerald-glow {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .gold-button {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #92400e 100%);
      border: 1px solid #fef08a;
      box-shadow: 0 4px 20px rgba(217, 119, 6, 0.5), inset 0 2px 0 rgba(255,255,255,0.6);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gold-button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.8), inset 0 2px 0 rgba(255,255,255,0.8);
    }
    .gold-button:active {
      transform: translateY(1px) scale(0.98);
    }

    .tile {
      perspective: 1000px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      flex-shrink: 0;
    }
    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 0.5rem;
      background: linear-gradient(145deg, #ffffff 0%, #fef3c7 70%, #fde047 100%);
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 3px solid #d97706;
      border-bottom: 6px solid #064e3b;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6), inset 0 -3px 6px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    .tile:hover .tile-inner {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.7), 0 0 18px rgba(251, 191, 36, 0.6);
    }

    .tile.selected .tile-inner {
      transform: translateY(-16px) scale(1.08);
      background: linear-gradient(145deg, #fffbeb 0%, #fde047 100%) !important;
      border-color: #f59e0b !important;
      box-shadow: 0 16px 30px rgba(0,0,0,0.8), 0 0 25px rgba(245, 158, 11, 0.9) !important;
    }

    @keyframes avatar-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.6), 0 0 40px rgba(16, 185, 129, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.9), 0 0 60px rgba(16, 185, 129, 0.7); transform: scale(1.03); }
    }
    .avatar-glow {
      animation: avatar-pulse 3s infinite ease-in-out;
    }

    #toast-notification {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }
  </style>
</head>

  <script>
    class SoundEngine {
      constructor() { this.ctx = null; this.muted = false; }
      init() { if (!this.ctx) { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) this.ctx = new AudioCtx(); } }
      
      playClick() {
        if (this.muted) return; this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
      }

      playDiscard() {
        if (this.muted) return; this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.08);
      }

      playFanfare() {
        if (this.muted) return; this.init(); if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.3);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
        });
      }
    }
    const SE = new SoundEngine();

    const HIRAGANA_BASE = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","もの","や","ゆ","よ","ら","り","る","れ","ろ","わ","ん"];

    let isHost = true;
    let targetPlayerCount = 3;
    let roomCode = "";
    let playerName = "";
    let channel = null;
    let connectedPlayers = [];
    const myClientId = 'client_' + Math.random().toString(36).substring(2, 9);

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 2500);
    }

    function safeCopyText(textToCopy, successMsg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            showToast(successMsg);
          }).catch(() => {
            openCopyModal(textToCopy);
          });
        } else {
          openCopyModal(textToCopy);
        }
      } catch (err) {
        openCopyModal(textToCopy);
      }
    }

    function openCopyModal(text) {
      document.getElementById('copy-input-field').value = text;
      document.getElementById('copy-modal').classList.remove('hidden');
      document.getElementById('copy-input-field').select();
    }

    function closeCopyModal() {
      document.getElementById('copy-modal').classList.add('hidden');
      showToast("テキストをコピーしてください");
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        document.getElementById('tab-guest').click();
        document.getElementById('input-guest-code').value = roomParam.toUpperCase();
        showToast("招待コードを読み込みました");
      }
    });

    const tabHost = document.getElementById('tab-host');
    const tabGuest = document.getElementById('tab-guest');
    const sectionHost = document.getElementById('section-host');
    const sectionGuest = document.getElementById('section-guest');

    tabHost.addEventListener('click', () => {
      isHost = true;
      SE.playClick();
      tabHost.className = "py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-2 bg-amber-500/20 border border-amber-500/60 text-amber-300 shadow";
      tabGuest.className = "py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
      sectionHost.classList.remove('hidden');
      sectionGuest.classList.add('hidden');
    });

    tabGuest.addEventListener('click', () => {
      isHost = false;
      SE.playClick();
      tabGuest.className = "py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-2 bg-amber-500/20 border border-amber-500/60 text-amber-300 shadow";
      tabHost.className = "py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200";
      sectionGuest.classList.remove('hidden');
      sectionHost.classList.add('hidden');
    });

    const btnMode3p = document.getElementById('btn-mode-3p');
    const btnMode4p = document.getElementById('btn-mode-4p');

    btnMode3p.addEventListener('click', () => {
      targetPlayerCount = 3;
      SE.playClick();
      btnMode3p.className = "py-3 px-4 rounded-xl border-2 font-black text-xs transition flex items-center justify-center gap-2 border-amber-500 bg-amber-500/20 text-amber-300 shadow-md";
      btnMode4p.className = "py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex items-center justify-center gap-2 border-slate-800 bg-slate-950/80 text-slate-400 hover:border-slate-700";
    });

    btnMode4p.addEventListener('click', () => {
      targetPlayerCount = 4;
      SE.playClick();
      btnMode4p.className = "py-3 px-4 rounded-xl border-2 font-black text-xs transition flex items-center justify-center gap-2 border-amber-500 bg-amber-500/20 text-amber-300 shadow-md";
      btnMode3p.className = "py-3 px-4 rounded-xl border-2 font-bold text-xs transition flex items-center justify-center gap-2 border-slate-800 bg-slate-950/80 text-slate-400 hover:border-slate-700";
    });

    document.getElementById('btn-create-room').addEventListener('click', () => {
      SE.playClick();
      playerName = document.getElementById('input-player-name').value.trim() || 'ホスト雀士';
      isHost = true;
      roomCode = 'HM-' + Math.floor(1000 + Math.random() * 9000);
      setupRoomConnection(roomCode, playerName, targetPlayerCount, true);
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
      SE.playClick();
      playerName = document.getElementById('input-player-name').value.trim() || 'ゲスト雀士';
      isHost = false;
      const inputCode = document.getElementById('input-guest-code').value.trim().toUpperCase();

      if (!inputCode) {
        showToast("部屋コードを入力してください！");
        return;
      }
      roomCode = inputCode;
      setupRoomConnection(roomCode, playerName, 3, false);
    });

    function setupRoomConnection(code, name, targetCount, hostFlag) {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('waiting-room-modal').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = code;

      if (channel) channel.close();
      channel = new BroadcastChannel('hiragana_mahjong_room_' + code);

      connectedPlayers = [{ id: myClientId, name: name, isHost: hostFlag }];

      channel.onmessage = (event) => {
        const msg = event.data;
        if (!msg) return;

        if (msg.type === 'JOIN_REQUEST') {
          if (isHost) {
            if (!connectedPlayers.some(p => p.id === msg.clientId)) {
              connectedPlayers.push({ id: msg.clientId, name: msg.name, isHost: false });
            }
            broadcastRoomState();
          }
        } else if (msg.type === 'ROOM_STATE') {
          connectedPlayers = msg.players;
          targetPlayerCount = msg.targetCount;
          updateWaitingLobbyUI();
        } else if (msg.type === 'START_GAME') {
          startMahjongGame();
        }
      };

      if (hostFlag) {
        document.getElementById('waiting-title').innerText = "対戦部屋を作成しました";
        document.getElementById('btn-start-game-forced').classList.remove('hidden');
        updateWaitingLobbyUI();
      } else {
        document.getElementById('waiting-title').innerText = "部屋に参加しました";
        document.getElementById('btn-start-game-forced').classList.add('hidden');
        channel.postMessage({ type: 'JOIN_REQUEST', clientId: myClientId, name: name });
        showToast("ホストの部屋に接続しました！");
      }
    }

    function broadcastRoomState() {
      if (!channel || !isHost) return;
      channel.postMessage({
        type: 'ROOM_STATE',
        players: connectedPlayers,
        targetCount: targetPlayerCount
      });
      updateWaitingLobbyUI();
    }

    function updateWaitingLobbyUI() {
      document.getElementById('waiting-counter').innerText = `${connectedPlayers.length} / ${targetPlayerCount} 人`;
      const container = document.getElementById('waiting-player-list');
      container.innerHTML = '';

      for (let i = 0; i < targetPlayerCount; i++) {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-slate-950/90 p-3 rounded-xl border border-slate-800 text-xs font-bold";
        
        if (i < connectedPlayers.length) {
          const p = connectedPlayers[i];
          const isMe = p.id === myClientId;
          item.innerHTML = `
            <span class="text-emerald-300 flex items-center gap-2">
              <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
              ${p.name} ${p.isHost ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/40">ホスト</span>' : ''}
              ${isMe ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-500/40">あなた</span>' : ''}
            </span>
            <span class="text-emerald-400 text-[10px] bg-emerald-500/20 px-2 py-0.5 rounded font-mono">接続完了</span>
          `;
        } else {
          item.innerHTML = `
            <span class="text-slate-500 flex items-center gap-2">
              <i class="fa-solid fa-spinner animate-spin text-amber-400/60"></i> 参加者を待機中...
            </span>
            <span class="text-slate-600 text-[10px] font-mono">Empty</span>
          `;
        }
        container.appendChild(item);
      }

      if (isHost && connectedPlayers.length >= targetPlayerCount) {
        triggerStartGame();
      }
    }

    document.getElementById('btn-start-game-forced').addEventListener('click', () => {
      SE.playFanfare();
      triggerStartGame();
    });

    function triggerStartGame() {
      if (channel) {
        channel.postMessage({ type: 'START_GAME' });
      }
      startMahjongGame();
    }

    function startMahjongGame() {
      document.getElementById('waiting-room-modal').classList.add('hidden');
      initMahjongTable();
    }

    document.getElementById('btn-cancel-waiting').addEventListener('click', () => {
      SE.playClick();
      if (channel) channel.close();
      document.getElementById('waiting-room-modal').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    });

    document.getElementById('btn-copy-code-lobby').addEventListener('click', () => {
      SE.playClick();
      safeCopyText(roomCode, "部屋コードをコピーしました！");
    });

    document.getElementById('btn-copy-waiting-link').addEventListener('click', () => {
      SE.playClick();
      const inviteURL = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
      safeCopyText(inviteURL, "招待URLをコピーしました！");
    });

    let gameHand = [];
    let selectedTileIndex = null;

    function initMahjongTable() {
      document.getElementById('game-room-id-text').innerText = roomCode;
      document.getElementById('p0-name-disp').innerText = playerName;
      
      const opponents = connectedPlayers.filter(p => p.id !== myClientId);
      if (opponents[0]) document.getElementById('p1-name').innerText = opponents[0].name;
      if (opponents[1]) document.getElementById('p2-name').innerText = opponents[1].name;
      if (opponents[2]) document.getElementById('p3-name').innerText = opponents[2].name;

      gameHand = [];
      for (let i = 0; i < 13; i++) {
        const randomChar = HIRAGANA_BASE[Math.floor(Math.random() * HIRAGANA_BASE.length)];
        gameHand.push(randomChar);
      }
      renderHandUI();
      showToast("対局が開始されました！");
    }

    function renderHandUI() {
      const container = document.getElementById('free-tiles-area');
      container.innerHTML = '';

      gameHand.forEach((char, idx) => {
        const tileEl = document.createElement('div');
        const isSelected = selectedTileIndex === idx;
        tileEl.className = `tile w-10 sm:w-12 h-14 sm:h-16 ${isSelected ? 'selected' : ''}`;
        tileEl.innerHTML = `
          <div class="tile-inner flex flex-col justify-between p-1 text-slate-900">
            <span class="text-[8px] font-black text-amber-900/50">自由</span>
            <span class="text-xl sm:text-2xl font-black text-center my-auto leading-none">${char}</span>
          </div>
        `;

        tileEl.addEventListener('click', () => {
          SE.playClick();
          selectedTileIndex = (selectedTileIndex === idx) ? null : idx;
          renderHandUI();
        });

        container.appendChild(tileEl);
      });

      document.getElementById('btn-discard').disabled = selectedTileIndex === null;
    }

    document.getElementById('btn-discard').addEventListener('click', () => {
      if (selectedTileIndex !== null) {
        SE.playDiscard();
        const discardedChar = gameHand.splice(selectedTileIndex, 1)[0];
        
        const p0Discards = document.getElementById('p0-discards');
        const dBadge = document.createElement('span');
        dBadge.className = "bg-slate-800 text-amber-200 border border-amber-500/30 px-2 py-0.5 rounded text-xs font-bold shadow";
        dBadge.innerText = discardedChar;
        p0Discards.appendChild(dBadge);

        setTimeout(() => {
          const newChar = HIRAGANA_BASE[Math.floor(Math.random() * HIRAGANA_BASE.length)];
          gameHand.push(newChar);
          selectedTileIndex = null;
          renderHandUI();
        }, 500);
      }
    });

    document.getElementById('btn-back-lobby').addEventListener('click', () => {
      SE.playClick();
      if (confirm('ロビーに戻りますか？')) {
        location.reload();
      }
    });
  </script>
</body>
</html>
