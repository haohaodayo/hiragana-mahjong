<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀・3〜4人対戦</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eadc;color:#241d17;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1250px;margin:auto;padding:16px}.panel{background:#fffaf1;border:2px solid #c8b99e;border-radius:16px;padding:16px;box-shadow:0 5px 18px #0001}
h1,h2,h3{margin:0 0 10px}.muted{color:#766b5e}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input,select{font-size:17px;padding:10px 12px;border:2px solid #c8b99e;border-radius:9px;background:#fff}
button{font-size:15px;font-weight:700;padding:10px 14px;border:0;border-radius:9px;background:#604832;color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.green{background:#3e6b4b}.gold{background:#94702e}.red{background:#9d4035}
.hidden{display:none}.room{font-size:30px;font-weight:800;letter-spacing:6px;background:#eee1c6;border-radius:10px;padding:7px 14px;display:inline-block}
#players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.player{padding:9px;border-radius:10px;background:#eee5d6;border:2px solid transparent}.player.me{border-color:#94702e}.player.turn{box-shadow:inset 0 0 0 3px #b28b42}
#table{display:grid;grid-template-columns:1fr 2fr 1fr;grid-template-rows:1fr 2fr 1fr;gap:8px;min-height:500px;margin:12px 0}
.seat{background:#eee5d6;border-radius:12px;padding:10px}.north{grid-column:2}.west{grid-column:1;grid-row:2}.center{grid-column:2;grid-row:2;background:#e5d7bc;display:flex;flex-direction:column;justify-content:center;align-items:center}.east{grid-column:3;grid-row:2}.south{grid-column:2;grid-row:3}
.tiles{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}.tile{width:48px;height:58px;border:2px solid #9d8b72;border-radius:8px;background:#fff;color:#241d17;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;cursor:grab;user-select:none;box-shadow:0 2px 3px #0002}.tile:active{cursor:grabbing}.tile.sel{background:#ead29b;border-color:#8b681f;transform:translateY(-5px)}.tile.dragover{outline:3px dashed #94702e}.smalltile{width:32px;height:39px;font-size:18px;cursor:default}.meld{background:#ddd0b9;border-radius:8px;padding:5px;margin:4px 2px;display:inline-block}.log{height:135px;overflow:auto;background:#211d19;color:#f4e7d1;padding:10px;border-radius:10px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.notice{font-weight:800;font-size:18px}.centerword{font-size:30px;letter-spacing:5px;min-height:42px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee1c6;margin-left:6px;font-size:12px}
@media(max-width:800px){#players{grid-template-columns:repeat(2,1fr)}#table{grid-template-columns:1fr;grid-template-rows:auto;min-height:0}.north,.west,.center,.east,.south{grid-column:1;grid-row:auto}.tile{width:43px;height:53px;font-size:24px}}
</style>
</head>
<body><div class="wrap">

<div id="lobby" class="panel">
<h1>🀄 ひらがな麻雀・3〜4人対戦</h1>
<p class="muted">13枚スタート。ツモで14枚。牌は常に見える＆自由に並び替え。鳴きは「チー」のみ。</p>
<div class="row">
<input id="nameInput" maxlength="12" placeholder="名前">
<select id="seatCount"><option value="4">4人</option><option value="3">3人</option></select>
<button id="hostBtn" class="green">部屋を作る</button>
<input id="codeInput" maxlength="6" placeholder="参加コード">
<button id="joinBtn">部屋に参加</button>
</div>
<p id="status" class="muted"></p>
</div>

<div id="game" class="hidden">
<div class="panel">
<div class="row"><div>参加コード</div><div id="roomCode" class="room"></div><button id="copyBtn">コードをコピー</button><span id="gameStatus" class="notice"></span></div>
<div id="players"></div>
</div>

<div id="table">
<div class="seat north" id="seat1"></div>
<div class="seat west" id="seat2"></div>
<div class="center"><div class="muted">場</div><div id="centerStatus" class="notice"></div><div class="centerword" id="lastDiscard">—</div><div class="muted">最後の捨て牌</div></div>
<div class="seat east" id="seat3"></div>
<div class="seat south" id="seat0"></div>
</div>

<div class="panel">
<h3>あなたの手牌 <span id="count"></span></h3>
<p class="muted">牌をドラッグして自由に並び替えできます。チーするときは使いたい2牌を選択してください。</p>
<div id="hand" class="tiles"></div>
<div class="actions">
<button id="drawBtn">ツモ</button>
<button id="discardBtn" disabled>選択牌を捨てる</button>
<button id="chiBtn" class="gold" disabled>チー</button>
<button id="agariBtn" class="green" disabled>14枚で上がる</button>
<button id="passBtn" disabled>パス</button>
</div>
<div id="actionNotice" class="muted"></div>
<h3>ログ</h3><div id="log" class="log"></div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const KANA=[..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
const COPIES=4, MAX=4;
let peer=null,host=false,room="",myId="",conns={},state=null,selected=[],dragIndex=null;

const WORDS = [
/* 辞書系：一般的な日本語として使う3文字語（ゲーム判定用の短い語彙） */
"あさひ","あした","あそび","あたま","あつさ","あにき","いのち","いなか","いのち","うさぎ","えがお","おかし","おとな","おやつ",
"かえる","かおり","かがみ","かたち","かもめ","からだ","きもち","きのこ","きもの","きぼう","くるま","けしき","こころ","ことば","こども",
"さかな","さくら","さむさ","しあい","しごと","したく","すいか","すずめ","せかい","せなか","そら?","たまご","たから","ちから","つづき",
"てがみ","でんき","ともだち","なかま","なみだ","にほん","ぬくみ","ねこ?","のぞみ","はなび","はなし","ひかり","ひみつ","ふしぎ","へいわ",
"ほし?","まくら","まなび","みかた","みず?","みらい","むすめ","めがね","もの?","やさい","やすみ","ゆめ?","よあけ","よろこび","らしさ",
"りゆう","るす?","れきし","ろうか","わらい","わたし",
/* ネット・ミーム系：ゲーム内で使える特別語彙 */
"それな","わかる","おつ?","草?","ぴえん","しらん","むり?","すこ?","神?","優勝","解散","限界","虚無?","天才","有能","尊い","覇権","炎上","案件?","古参",
/* 言ノ国系：これまでの言ノ国で出てきた語 */
"ことの","ことく","侍?","柱?","門徒","流民","生徒","校舎","担任","副担任","非常勤","怪異","七不思議","鯖理解","評価","基本評価","特別評価","寿命","招待","言ノ札","駄菓子",
"理解度","オリテ","オリエン","アリ?","ソウル","凸待ち","いい声","声真似","寝落ち","のどぼとけ"
].map(x=>x.replace(/[?]/g,"")).filter(x=>[...x].length===3);

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){return shuffle(KANA.flatMap(x=>Array(COPIES).fill(x)))}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function log(s){$("log").textContent=s+"\n"+$("log").textContent}
function status(s){$("status").textContent=s}
function showGame(){$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("roomCode").textContent=room}
function permutations(a){if(a.length!==3)return[];return[[a[0],a[1],a[2]],[a[0],a[2],a[1]],[a[1],a[0],a[2]],[a[1],a[2],a[0]],[a[2],a[0],a[1]],[a[2],a[1],a[0]]].map(x=>x.join(""))}
function isWord3(a){return permutations(a).some(w=>WORDS.includes(w))}
function findChiPairs(hand,discard){
 let out=[];
 for(let i=0;i<hand.length;i++)for(let j=i+1;j<hand.length;j++){
  if(isWord3([hand[i],hand[j],discard]))out.push([i,j]);
 }
 return out;
}
function mkState(){
 let deck=makeDeck(),players=[];
 for(let i=0;i<stateMax;i++)players.push({id:i,name:i===0?myName:"待機中",online:i===0,hand:[],melds:[],discards:[]});
 for(let i=0;i<stateMax;i++)for(let j=0;j<13;j++)players[i].hand.push(deck.pop());
 return {maxPlayers:stateMax,players,deck,turn:0,phase:"waiting",lastDiscard:null,lastDiscardBy:null,started:false,winner:null};
}
function broadcast(){if(!host)return;let safe=JSON.parse(JSON.stringify(state));Object.values(conns).forEach(c=>{try{c.send({type:"state",state:safe})}catch(e){}});render()}
function sendHost(o){if(host){handle({type:o.type,payload:o.payload,from:myId});return}if(window.hostConn?.open)window.hostConn.send(o)}
function connectTo(id){
 const c=peer.connect(id,{reliable:true});window.hostConn=c;
 c.on("open",()=>{status("部屋に接続しました。参加登録中…");c.send({type:"join",name:myName})});
 c.on("data",handle);c.on("close",()=>status("ホストとの接続が切れました。"));c.on("error",e=>status("接続エラー："+e.type));
}
function handle(m){
 if(host){
  if(m.type==="join"){
   const idx=state.players.findIndex(p=>!p.online);
   if(idx<0){try{conns[m.from].send({type:"full"})}catch(e){}return}
   const c=conns[m.from];c.playerIndex=idx;state.players[idx].online=true;state.players[idx].name=(m.name||"プレイヤー"+(idx+1)).slice(0,12);
   c.send({type:"assigned",index:idx,room,maxPlayers:state.maxPlayers});broadcast();
   if(state.players.every(p=>p.online)){state.started=true;state.phase="draw";state.turn=0;log("人数がそろった！ゲーム開始！");broadcast()}
  }else if(m.type==="action")handleAction(m.from,m.payload);
  return;
 }
 if(m.type==="assigned"){window.myIndex=m.index;stateMax=m.maxPlayers;showGame();status("参加完了！");}
 if(m.type==="state"){state=m.state;render()}
 if(m.type==="full"){status("この部屋は満員です。")}
}
function handleAction(from,a){
 const c=conns[from],idx=c?.playerIndex;if(idx==null)return;
 const p=state.players[idx];
 if(a.kind==="draw"){
  if(!state.started||state.phase!=="draw"||state.turn!==idx||state.deck.length===0)return;
  p.hand.push(state.deck.pop());state.phase="discard";state.lastDiscard=null;broadcast();
 }else if(a.kind==="discard"){
  if(state.phase!=="discard"||state.turn!==idx||a.pos<0||a.pos>=p.hand.length)return;
  const x=p.hand.splice(a.pos,1)[0];p.discards.push(x);state.lastDiscard=x;state.lastDiscardBy=idx;
  state.phase="call";broadcast();
 }else if(a.kind==="chi"){
  if(state.phase!=="call"||state.lastDiscardBy===idx)return;
  const next=(state.lastDiscardBy+1)%state.maxPlayers;if(idx!==next)return;
  const pos=(a.pos||[]).slice().sort((x,y)=>y-x);if(pos.length!==2)return;
  const h=p.hand;if(pos[0]>=h.length||pos[1]<0||pos[0]===pos[1])return;
  const used=[h[pos[0]],h[pos[1]],state.lastDiscard];
  if(!isWord3(used))return;
  h.splice(pos[0],1);h.splice(pos[1],1);p.melds.push(used);state.lastDiscard=null;state.turn=idx;state.phase="discard";broadcast();
 }else if(a.kind==="pass"){
  if(state.phase==="call"&&idx===(state.lastDiscardBy+1)%state.maxPlayers){state.turn=(state.lastDiscardBy+1)%state.maxPlayers;state.phase="draw";broadcast()}
 }else if(a.kind==="agari"){
  if(state.phase!=="discard"||state.turn!==idx||p.hand.length!==14)return;
  state.winner=idx;state.phase="end";broadcast();
 }else if(a.kind==="reorder"){
  if(state.phase==="discard"&&state.turn===idx&&Array.isArray(a.order)){
    if(a.order.length===p.hand.length){p.hand=a.order.map(i=>p.hand[i]).filter(Boolean);broadcast()}
  }
 }
}
function action(kind,payload={}){sendHost({type:"action",payload:{kind,...payload}})}
function canChi(){
 if(!state||state.phase!=="call"||state.lastDiscardBy===window.myIndex)return false;
 if(window.myIndex!==((state.lastDiscardBy+1)%state.maxPlayers))return false;
 return findChiPairs(state.players[window.myIndex].hand,state.lastDiscard).length>0;
}
function renderSeat(el,p,i){
 el.innerHTML="<b>"+p.name+(i===window.myIndex?"（あなた）":"")+"</b> "+(p.online?"🟢":"⚪")+"<br><span class='muted'>手牌："+p.hand.length+"枚　チー："+p.melds.length+"組</span>";
 if(p.melds.length)el.innerHTML+="<div>"+p.melds.map(m=>"<span class='meld'>"+m.join("")+"</span>").join("")+"</div>";
 el.innerHTML+="<div class='muted'>捨て牌："+p.discards.join(" ")+"</div>";
}
function render(){
 if(!state)return;
 $("gameStatus").textContent=state.phase==="end"?"🏆 "+state.players[state.winner].name+" の上がり！":state.started?"手番："+state.players[state.turn].name:""+state.players.filter(p=>p.online).length+"人待機中";
 $("players").innerHTML=state.players.map((p,i)=>`<div class="player ${i===window.myIndex?"me":""} ${i===state.turn?"turn":""}"><b>${p.name}</b><br>${p.online?"参加中":"待機中"}　手牌 ${p.hand.length}</div>`).join("");
 for(let i=0;i<4;i++){let e=$("seat"+i);if(i<state.maxPlayers){e.classList.remove("hidden");renderSeat(e,state.players[i],i)}else e.classList.add("hidden")}
 const h=$("hand");h.innerHTML="";let mine=state.players[window.myIndex];
 mine.hand.forEach((x,i)=>{let b=document.createElement("button");b.className="tile"+(selected.includes(i)?" sel":"");b.textContent=x;b.draggable=true;b.onclick=()=>{if(selected.includes(i))selected=selected.filter(v=>v!==i);else if(selected.length<2)selected.push(i);render()};b.ondragstart=()=>dragIndex=i;b.ondragover=e=>{e.preventDefault();b.classList.add("dragover")};b.ondragleave=()=>b.classList.remove("dragover");b.ondrop=e=>{e.preventDefault();b.classList.remove("dragover");if(dragIndex==null||dragIndex===i)return;let order=[...mine.hand.keys()];let moved=order.splice(dragIndex,1)[0];order.splice(i,0,moved);action("reorder",{order});dragIndex=null;selected=[]};h.appendChild(b)});
 $("count").textContent="（"+mine.hand.length+"枚）";$("lastDiscard").textContent=state.lastDiscard||"—";
 let call=state.phase==="call"&&state.lastDiscardBy!==window.myIndex;
 $("centerStatus").textContent=state.phase==="draw"?"ツモ待ち":state.phase==="discard"?"捨て牌待ち":state.phase==="call"?"チー判断":state.phase==="end"?"終了":"待機中";
 const myTurnDraw=state.started&&state.turn===window.myIndex&&state.phase==="draw";
 const myTurnDiscard=state.started&&state.turn===window.myIndex&&state.phase==="discard";
 $("drawBtn").disabled=!myTurnDraw;
 $("discardBtn").disabled=!(myTurnDiscard&&selected.length===1);
 $("chiBtn").disabled=!(canChi()&&selected.length===2&&isWord3([mine.hand[selected[0]],mine.hand[selected[1]],state.lastDiscard]));
 $("passBtn").disabled=!(call&&window.myIndex===((state.lastDiscardBy+1)%state.maxPlayers));
 $("agariBtn").disabled=!(myTurnDiscard&&mine.hand.length===14);
 $("actionNotice").textContent=canChi()?"この捨て牌で3文字の言葉が作れます。使う2牌を選んで「チー」！":"";
 if(state.phase==="end")[$("drawBtn"),$("discardBtn"),$("chiBtn"),$("passBtn"),$("agariBtn")].forEach(b=>b.disabled=true);
}
$("hostBtn").onclick=()=>{
 myName=($("nameInput").value.trim()||"ホスト").slice(0,12);stateMax=+$("seatCount").value;host=true;room=code();myId=room;peer=new Peer(room);
 peer.on("open",()=>{state=mkState();window.myIndex=0;showGame();status("部屋作成完了。コードを3人/2人に共有してね。");render()});
 peer.on("connection",c=>{conns[c.peer]=c;c.on("data",m=>{m.from=c.peer;handle(m)})});peer.on("error",e=>status("通信エラー："+e.type));
};
$("joinBtn").onclick=()=>{
 myName=($("nameInput").value.trim()||"プレイヤー").slice(0,12);room=$("codeInput").value.trim().toUpperCase();if(room.length<4){status("参加コードを入力してね");return}
 peer=new Peer();peer.on("open",id=>{myId=id;connectTo(room)});peer.on("error",e=>status("部屋が見つからないか通信エラー："+e.type));
};
$("copyBtn").onclick=()=>navigator.clipboard?.writeText(room);
$("drawBtn").onclick=()=>action("draw");
$("discardBtn").onclick=()=>{if(selected.length===1)action("discard",{pos:selected[0]});selected=[]};
$("chiBtn").onclick=()=>{if(selected.length===2)action("chi",{pos:selected});selected=[]};
$("passBtn").onclick=()=>action("pass");
$("agariBtn").onclick=()=>action("agari");
</script>
</body></html>
