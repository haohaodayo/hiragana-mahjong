<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがな麻雀 - 試作版</title>
<style>
:root{--bg:#08110d;--panel:#102018;--panel2:#172b20;--line:#365341;--gold:#e6c76a;--text:#f5f1df;--muted:#aeb9ad;--red:#df6b63;--green:#65c48b;--blue:#70a9dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#193526 0,#08110d 55%);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid #55725d;background:#20382a;color:var(--text);border-radius:10px;padding:9px 13px}button:hover{filter:brightness(1.15)}button.primary{background:#8a6b20;border-color:#d8bd62;color:#fff9df}.danger{background:#512725;border-color:#8d4a45}.ghost{background:transparent}
#app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:28px;font-weight:900;letter-spacing:.08em}.badge{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.panel{background:linear-gradient(180deg,rgba(24,45,33,.96),rgba(11,25,18,.96));border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #0007}
#setup{padding:20px;margin-top:16px}.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;background:#08140d;border:1px solid #405b49;color:var(--text);border-radius:10px;padding:10px}
.help{color:var(--muted);line-height:1.7;font-size:13px;margin-top:14px}
#game{display:none;margin-top:14px}.layout{display:grid;grid-template-columns:1fr 310px;gap:14px}.board{padding:14px;min-height:680px;position:relative}.side{padding:14px}.river{min-height:240px;border:1px dashed #48624e;border-radius:14px;padding:12px;background:#07110b}.river-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted)}.river-grid{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}.tile{width:45px;height:56px;border-radius:8px;border:1px solid #9e9b80;background:linear-gradient(#fffef0,#d9d4b7);color:#15150f;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;user-select:none;box-shadow:0 3px 0 #7b795f}.tile.small{width:37px;height:45px;font-size:21px}.tile.selected{outline:3px solid var(--gold);transform:translateY(-4px)}.tile.hint{box-shadow:0 0 0 3px var(--green),0 0 22px #65c48b88}.tile.discard{width:38px;height:45px;font-size:21px}.turnbox{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 12px}.turn{font-weight:900}.turn.my{color:var(--gold)}.counts{display:flex;gap:8px;flex-wrap:wrap}.count{padding:5px 8px;border-radius:999px;background:#09150e;border:1px solid var(--line);font-size:12px}
.melds{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.meld{padding:7px 9px;border:1px solid #8b7a3c;border-radius:10px;background:#2a2513}.meld b{color:var(--gold)}
.hand-wrap{margin-top:14px}.hand-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.hand{display:flex;gap:6px;flex-wrap:wrap;padding:12px 4px 6px;min-height:75px}.hand .tile{transition:.12s}.hand .tile[draggable=true]{cursor:grab}.hand .tile.dragging{opacity:.35}
.progress{margin-top:8px;padding:10px;border-radius:10px;background:#09150e;border:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}.progress strong{color:var(--gold)}.waits{margin-top:8px;padding:10px;border-radius:10px;background:#09150e;border:1px solid var(--line)}.wait-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button:disabled{opacity:.35;cursor:not-allowed}
.side h3{margin:8px 0 8px;font-size:14px;color:var(--gold)}.players{display:grid;gap:8px}.player{padding:10px;border:1px solid var(--line);border-radius:11px;background:#0b1911}.player.active{border-color:var(--gold);box-shadow:0 0 0 1px #e6c76a44}.player .name{font-weight:900}.mini{font-size:12px;color:var(--muted);margin-top:3px}.log{max-height:230px;overflow:auto;font-size:12px;line-height:1.55}.log div{padding:4px 0;border-bottom:1px solid #ffffff0b}.book{max-height:230px;overflow:auto;display:flex;gap:5px;flex-wrap:wrap}.wordchip{padding:4px 7px;border-radius:999px;background:#1a2b20;border:1px solid #35503d;font-size:12px}.mvp{font-size:13px;line-height:1.7}.subtle{color:var(--muted)}
.overlay{position:fixed;inset:0;background:#020603cc;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal{width:min(720px,100%);padding:26px;text-align:center;background:linear-gradient(145deg,#182c20,#0b1710);border:1px solid #9f8542;border-radius:22px;box-shadow:0 25px 80px #000b}.win{font-size:58px;font-weight:1000;color:var(--gold);letter-spacing:.1em;text-shadow:0 0 25px #e6c76a88}.resultwords{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.resultwords span{padding:10px 13px;border:1px solid #756532;background:#282315;border-radius:10px;font-size:19px}.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
@media(max-width:900px){.layout{grid-template-columns:1fr}.board{min-height:auto}.side{order:2}}@media(max-width:600px){.tile{width:39px;height:50px;font-size:22px}.title{font-size:22px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><span class="title">ひらがな麻雀</span> <span class="badge">試作版 / 2〜4人対応</span></div>
    <div class="toolbar"><button id="newRoundBtn" class="primary" style="display:none">新しい局</button><button id="backBtn" class="ghost" style="display:none">設定へ戻る</button></div>
  </div>

  <section id="setup" class="panel">
    <h2 style="margin-top:0">対局設定</h2>
    <div class="setup-grid">
      <div class="field"><label>人数</label><select id="playerCount"><option value="2">2人（試作おすすめ）</option><option value="3">3人</option><option value="4">4人</option></select></div>
      <div class="field"><label>プレイヤー名</label><input id="p1" value="プレイヤー1"></div>
      <div class="field"><label>2人目の名前</label><input id="p2" value="プレイヤー2"></div>
      <div class="field"><label>3人目の名前</label><input id="p3" value="プレイヤー3"></div>
      <div class="field"><label>4人目の名前</label><input id="p4" value="プレイヤー4"></div>
    </div>
    <div class="help">
      この試作版は<strong>同一ブラウザ上で2〜4人を切り替えて遊ぶテスト版</strong>です。<br>
      最終版では同じ部屋に複数人が参加するオンライン対戦へ拡張する前提で、人数を2〜4人として扱えるようにしています。<br>
      単語判定は試作用の<strong>登録語彙リスト</strong>を使用。広辞苑そのものを内蔵・転載するものではありません。
    </div>
    <button id="startBtn" class="primary" style="margin-top:15px;font-size:17px">対局開始</button>
  </section>

  <section id="game">
    <div class="layout">
      <main class="board panel">
        <div class="turnbox">
          <div>手番：<span id="turnName" class="turn my"></span></div>
          <div class="counts"><span class="count">山 <b id="deckCount">0</b></span><span class="count">局勝利 <b id="roundWins">0</b></span></div>
        </div>

        <div class="river">
          <div class="river-title"><span>🀄 捨て牌</span><span class="subtle">全員公開</span></div>
          <div id="riverGrid" class="river-grid"></div>
        </div>

        <div id="melds" class="melds"></div>

        <div class="progress">
          <span>3文字：<strong id="threeCount">0 / 4</strong></span>
          <span>2文字：<strong id="pairCount">0 / 1</strong></span>
          <span>あと：<strong id="remainCount">5個</strong></span>
        </div>

        <div class="waits">
          <div><b>🎯 テンパイ・待ち</b> <span class="subtle">（自分だけ表示）</span></div>
          <div id="waitsList" class="wait-list"></div>
        </div>

        <div class="hand-wrap">
          <div class="hand-title"><span id="handTitle"></span><span>ドラッグで並び替え可能</span></div>
          <div id="hand" class="hand"></div>
        </div>

        <div class="actions">
          <button id="drawBtn" class="primary">ツモる</button>
          <button id="ronBtn">ロン！</button>
          <button id="tsumoBtn">ツモ！</button>
          <button id="chiBtn">チー候補</button>
          <button id="discardBtn">選択牌を捨てる</button>
        </div>
        <div id="actionHelp" class="help"></div>
      </main>

      <aside class="side panel">
        <h3>👥 参加者</h3><div id="players" class="players"></div>
        <h3>📖 今回の単語帳</h3><div id="book" class="book"></div>
        <h3>🏅 対局記録</h3><div id="mvp" class="mvp"></div>
        <h3>📜 ログ</h3><div id="log" class="log"></div>
      </aside>
    </div>
  </section>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <div class="win" id="winText">WIN!</div>
    <div id="winSub"></div>
    <div class="resultwords" id="resultWords"></div>
    <div class="modal-actions"><button id="rematchBtn" class="primary">同じ部屋で再戦</button><button id="closeOverlayBtn">閉じる</button></div>
  </div>
</div>

<script>
/* 試作用・手作業で登録した基本語彙。
   広辞苑本文の転載ではなく、ゲーム判定用の短い登録リストです。
   正式版では別ファイル words.js に分離し、検証済み語彙を増やします。 */
const WORDS = new Set(`
あい あお あき あさ あし あじ あす あせ あと あな あめ あゆ いえ いか いき いけ いし いす いぬ いま いろ うえ うし うそ うた うみ えき えさ おい おか おき おと おに おや かお かき かぎ かさ かぜ かた かに かね かみ かめ から きく きの きみ きも きり くさ くち くつ くに くま くも けし けむ こえ こお こめ ころ さけ さき さく さと さば さめ さら しお しか しき しし した しに しも すい すし すな せき せみ そら たい たこ たね たに たま ちえ ちず ちち つき つく つち つの てら とき とけ とり なつ なみ にく にし にわ ぬの ねこ のり はこ はし はな はね はる ひえ ひと ひる ふね へや ほし ほん まえ まめ まる みず みせ みち みみ むし むね めし もり やま ゆき よる らく りす りん れき れん わに わら
あさひ あかり あきら あなた あめり あゆみ いかだ いかり いきもの いしだ いちご いちじ いなか いのち いぬや うさぎ うしろ うみべ えがお おかし おさけ おしろ おすし おそら おとこ おんな かがみ かさね かたち かなた かにく かみなり からす かわら きつね きのこ きもの くじら くすり くもり けむり こいぬ こいびと こおり こたえ ことば こども さかな さくら さとう しずく しごと ししまい しずか すいか すずめ せかい せなか そよかぜ たぬき たまご ちから つばさ つぼみ てがみ てまり とかげ とまと ともだち ながれ なつやすみ にじいろ にんじん ねずみ のはら はさみ はたけ はなび ひかり ひつじ ふくろ ほたる まくら まつり みかん みずうみ むかし めがね もみじ やさい やかた ゆめみ ゆらゆら ようふく りんご わたし わたげ
`.trim().split(/\s+/));

const KANA = [...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];
const VOICED = [...'がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっぁぃぅぇぉ'];
const TILE_CHARS = [...new Set([...KANA,...VOICED])];

const state = {
  started:false, players:[], current:0, deck:[], river:[], lastDiscard:null,
  wins:[], stats:[], hands:[], melds:[], books:[], selected:-1, roundBook:new Set(),
  dragged:null, roundOver:false, actionCount:0
};

const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function log(s){ const d=document.createElement('div'); d.textContent=s; $('log').prepend(d); }
function normalize(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function isWord(s){return WORDS.has(normalize(s));}
function charCount(s){const m=new Map(); for(const c of s)m.set(c,(m.get(c)||0)+1);return m;}
function sameMultiset(a,b){if(a.length!==b.length)return false;const x=charCount(a),y=charCount(b);if(x.size!==y.size)return false;for(const [k,v] of x)if(y.get(k)!==v)return false;return true;}
function combos(arr,n,start=0,prefix=[],out=[]){if(prefix.length===n){out.push([...prefix]);return out}for(let i=start;i<=arr.length-(n-prefix.length);i++){prefix.push(i);combos(arr,n,i+1,prefix,out);prefix.pop()}return out}
function wordsFromTiles(tiles,len){const out=[];const inds=combos(tiles,len);for(const ix of inds){const s=ix.map(i=>tiles[i]).join('');if(isWord(s))out.push({word:s,indices:ix})}return out}
function findPartition(tiles){
  if(tiles.length!==14)return null;
  const tw=wordsFromTiles(tiles,2), th=wordsFromTiles(tiles,3);
  for(const p of tw){
    const rem=tiles.filter((_,i)=>!p.indices.includes(i));
    const a=wordsFromTiles(rem,3);
    for(const w1 of a){
      const rem1=rem.filter((_,i)=>!w1.indices.includes(i));
      const b=wordsFromTiles(rem1,3);
      for(const w2 of b){
        const rem2=rem1.filter((_,i)=>!w2.indices.includes(i));
        const c=wordsFromTiles(rem2,3);
        for(const w3 of c){
          const rem3=rem2.filter((_,i)=>!w3.indices.includes(i));
          const d=wordsFromTiles(rem3,3);
          if(d.length)return {pair:p.word,words:[w1.word,w2.word,w3.word,d[0].word]};
        }
      }
    }
  }
  return null;
}
function completedWords(hand){
  const found=[]; const seen=new Set();
  for(const w of wordsFromTiles(hand,3)){if(!seen.has(w.word)){seen.add(w.word);found.push(w.word)}}
  return found;
}
function waits(hand){
  if(hand.length!==13)return [];
  const out=[]; for(const c of TILE_CHARS){const p=findPartition([...hand,c]);if(p)out.push(c)}
  return out;
}
function makeDeck(){
  const d=[]; for(const c of TILE_CHARS)for(let i=0;i<4;i++)d.push(c); return shuffle(d);
}
function setupState(){
  const n=+$('playerCount').value;
  state.players=Array.from({length:n},(_,i)=>({name:$('p'+(i+1)).value.trim()||`プレイヤー${i+1}`}));
  state.wins=Array(n).fill(0); state.stats=Array.from({length:n},()=>({ron:0,tsumo:0,chi:0}));
  state.books=Array.from({length:n},()=>new Set()); state.started=true; startRound(true);
}
function startRound(first=false){
  state.deck=makeDeck(); state.river=[]; state.lastDiscard=null; state.current=0; state.selected=-1; state.roundOver=false; state.roundBook=new Set(); state.melds=Array.from({length:state.players.length},()=>[]);
  state.hands=Array.from({length:state.players.length},()=>[]);
  for(let r=0;r<13;r++)for(let p=0;p<state.players.length;p++)state.hands[p].push(state.deck.pop());
  state.hands=state.hands.map(h=>h);
  if(first) $('setup').style.display='none';
  $('game').style.display='block'; $('backBtn').style.display='inline-block'; $('newRoundBtn').style.display='inline-block'; $('log').innerHTML='';
  log(`対局開始：${state.players.length}人`);
  render();
}
function currentPlayer(){return state.current}
function playerCanWin(p){
  return findPartition(state.hands[p]);
}
function draw(){
  if(state.roundOver)return;
  if(state.current!==0){ aiTurn(); return; }
  if(state.deck.length===0){log('山がなくなったため流局。'); nextTurn();return}
  state.hands[0].push(state.deck.pop()); state.selected=-1; state.actionCount++;
  const p=findPartition(state.hands[0]); if(p){render(); showWin(0,p,'ツモ');return}
  log('自分が1枚ツモ。'); render();
}
function discard(){
  if(state.roundOver||state.current!==0)return;
  if(state.hands[0].length!==14){log('まずツモってください。');return}
  if(state.selected<0){log('捨てる牌を選んでください。');return}
  const c=state.hands[0].splice(state.selected,1)[0]; state.selected=-1; state.river.push({player:0,char:c}); state.lastDiscard={player:0,char:c}; log(`${state.players[0].name}：${c} を捨てた`);
  checkRonOrChi(0,c);
}
function checkRonOrChi(discarder,c){
  // 試作では全員のロンを先に確認。人間側が宣言する前に、AIは自動判定。
  for(let p=0;p<state.players.length;p++){
    if(p===discarder)continue;
    const h=state.hands[p]; const candidate=[...h,c];
    const win=findPartition(candidate);
    if(win){
      if(p===0){render(); $('ronBtn').disabled=false; log(`🀄 ${c} でロンできます！`); state.pendingRon={p,c,win}; return}
      showWin(p,win,'ロン'); return;
    }
  }
  if(discarder===0){
    const chi=wordsFromTiles([...state.hands[0],c],3).filter(x=>x.indices.includes(state.hands[0].length));
    if(chi.length){state.pendingChi={p:0,c,choices:chi}; log(`チー候補：${chi.map(x=>x.word).join(' / ')}`)}
  }
  nextTurn();
}
function doRon(){
  if(!state.pendingRon)return;
  const x=state.pendingRon; state.pendingRon=null; state.stats[x.p].ron++; showWin(x.p,x.win,'ロン');
}
function doChi(){
  if(!state.pendingChi)return;
  const x=state.pendingChi; const choice=x.choices[0]; const all=[...state.hands[0],x.c];
  const used=new Set(choice.indices.filter(i=>i<state.hands[0].length));
  const own=[...used].map(i=>state.hands[0][i]).join('');
  const discard=x.c;
  state.hands[0]=state.hands[0].filter((_,i)=>!used.has(i));
  state.melds[0].push(choice.word); state.stats[0].chi++; state.roundBook.add(choice.word); state.books[0].add(choice.word);
  state.pendingChi=null; state.lastDiscard=null; log(`🀄 チー！「${choice.word}」`);
  // 鳴いた後は自分の番として1枚捨てる
  state.current=0; state.hands[0].push(state.deck.pop()||'あ'); render();
}
function nextTurn(){
  if(state.roundOver)return;
  state.current=(state.current+1)%state.players.length;
  render();
  if(state.current!==0) setTimeout(aiTurn,500);
}
function aiTurn(){
  if(state.roundOver)return;
  const p=state.current; if(p===0)return;
  if(state.deck.length===0){log('山がなくなったため流局。');return}
  state.hands[p].push(state.deck.pop());
  const win=findPartition(state.hands[p]); if(win){showWin(p,win,'ツモ');return}
  const candidates=state.hands[p].map((c,i)=>({c,i,score:completedWords(state.hands[p].filter((_,j)=>j!==i)).length}));
  candidates.sort((a,b)=>b.score-a.score);
  const chosen=candidates[candidates.length-1];
  const c=state.hands[p].splice(chosen.i,1)[0];
  state.river.push({player:p,char:c}); state.lastDiscard={player:p,char:c}; log(`${state.players[p].name}：${c} を捨てた`);
  // human player 0 can ron
  const candidate=[...state.hands[0],c], win0=findPartition(candidate);
  if(win0){state.pendingRon={p:0,c,win:win0};render();log(`🔥 ${c} でロンできます！`);return}
  // simple AI chi if it can form a word with the discard; otherwise next
  const chi=wordsFromTiles([...state.hands[p],c],3).filter(x=>x.indices.includes(state.hands[p].length));
  if(chi.length){const choice=chi[0]; const used=new Set(choice.indices.filter(i=>i<state.hands[p].length)); state.hands[p]=state.hands[p].filter((_,i)=>!used.has(i));state.melds[p].push(choice.word);state.stats[p].chi++;state.books[p].add(choice.word);log(`${state.players[p].name}：チー「${choice.word}」`);state.hands[p].push(state.deck.pop()||'あ')}
  nextTurn();
}
function showWin(p,part,kind){
  state.roundOver=true; state.wins[p]++; if(kind==='ツモ')state.stats[p].tsumo++;
  const words=[...part.words,part.pair]; words.forEach(w=>{state.books[p].add(w);state.roundBook.add(w)});
  $('winText').textContent=kind+'！';
  $('winSub').innerHTML=`<b>${state.players[p].name}</b> の和了`;
  $('resultWords').innerHTML=words.map(w=>`<span>${w}</span>`).join('');
  $('overlay').style.display='flex'; render();
}
function rematch(){ $('overlay').style.display='none'; startRound(); }
function render(){
  if(!state.started)return;
  $('turnName').textContent=state.players[state.current].name+(state.current===0?'（あなた）':'');
  $('turnName').className='turn '+(state.current===0?'my':'');
  $('deckCount').textContent=state.deck.length;
  $('roundWins').textContent=state.wins[0]||0;
  $('handTitle').textContent=`${state.players[0].name}の手牌（${state.hands[0].length}枚）`;
  const hand=$('hand'); hand.innerHTML='';
  state.hands[0].forEach((c,i)=>{
    const t=document.createElement('div'); t.className='tile'+(i===state.selected?' selected':'');
    if(completedWords(state.hands[0]).some(w=>w.includes(c)))t.classList.add('hint');
    t.textContent=c;t.draggable=true;t.dataset.i=i;
    t.onclick=()=>{state.selected=i;render()};
    t.ondragstart=()=>{state.dragged=i;t.classList.add('dragging')};
    t.ondragend=()=>{state.dragged=null;t.classList.remove('dragging')};
    t.ondragover=e=>e.preventDefault();
    t.ondrop=()=>{const from=state.dragged,to=i;if(from==null||from===to)return;const x=state.hands[0].splice(from,1)[0];state.hands[0].splice(to,0,x);state.selected=-1;render()};
    hand.appendChild(t);
  });
  $('riverGrid').innerHTML=state.river.map(x=>`<div class="tile discard" title="${state.players[x.player].name}">${x.char}</div>`).join('');
  $('melds').innerHTML=state.melds[0].map(w=>`<div class="meld">🀄 <b>チー</b>「${w}」</div>`).join('');
  const th=completedWords(state.hands[0]);
  $('threeCount').textContent=`${Math.min(th.length,4)} / 4`;
  const pair=wordsFromTiles(state.hands[0],2).map(x=>x.word);
  $('pairCount').textContent=`${pair.length?1:0} / 1`;
  const remain=Math.max(0,5-Math.min(th.length,4)-(pair.length?1:0));$('remainCount').textContent=`${remain}個`;
  const ws=waits(state.hands[0]);
  $('waitsList').innerHTML=ws.length?ws.map(c=>`<span class="wordchip">${c} が必要</span>`).join(''):'<span class="subtle">現在の手牌ではテンパイしていません</span>';
  $('drawBtn').disabled=state.roundOver||state.current!==0||state.hands[0].length>=14;
  $('discardBtn').disabled=state.roundOver||state.current!==0||state.hands[0].length!==14;
  $('tsumoBtn').disabled=state.roundOver||!findPartition(state.hands[0]);
  $('ronBtn').disabled=!state.pendingRon;
  $('chiBtn').disabled=!state.pendingChi;
  $('actionHelp').textContent=state.current===0?'自分の番：ツモ → 必要なら和了 → 牌を選んで捨てる。チー候補が出たら選択できます。':'相手の手番です。試作版ではAIが自動進行します。';
  $('players').innerHTML=state.players.map((p,i)=>`<div class="player ${i===state.current?'active':''}"><div class="name">${p.name}${i===0?'（操作側）':''}</div><div class="mini">勝利 ${state.wins[i]} / ロン ${state.stats[i].ron} / ツモ ${state.stats[i].tsumo} / チー ${state.stats[i].chi}</div><div class="mini">公開鳴き：${state.melds[i].join('・')||'なし'}</div></div>`).join('');
  $('book').innerHTML=[...state.books[0]].sort().map(w=>`<span class="wordchip">${w}</span>`).join('')||'<span class="subtle">まだ発見なし</span>';
  $('mvp').innerHTML=`今回発見：${[...state.roundBook].length}語<br>通算図鑑：${state.books[0].size}語<br>チー：${state.stats[0].chi}回 / ロン：${state.stats[0].ron}回 / ツモ：${state.stats[0].tsumo}回`;
}
$('startBtn').onclick=setupState;
$('drawBtn').onclick=draw;
$('discardBtn').onclick=discard;
$('ronBtn').onclick=doRon;
$('chiBtn').onclick=doChi;
$('tsumoBtn').onclick=()=>{const p=findPartition(state.hands[0]);if(p)showWin(0,p,'ツモ')};
$('rematchBtn').onclick=rematch;
$('closeOverlayBtn').onclick=()=>$('overlay').style.display='none';
$('newRoundBtn').onclick=()=>{if(confirm('この局を終了して新しい局を始めますか？'))startRound()};
$('backBtn').onclick=()=>{if(confirm('設定画面に戻りますか？')){state.started=false;$('game').style.display='none';$('setup').style.display='block';$('backBtn').style.display='none';$('newRoundBtn').style.display='none'}};
$('playerCount').onchange=()=>{for(let i=3;i<=4;i++)$('p'+i).parentElement.style.display=(+$('playerCount').value>=i?'block':'none')};
$('playerCount').onchange();
</script>
</body>
</html>
